<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News &amp; Recaps — Mountain State Miles</title>
  <meta name="description" content="West Virginia cross country and track news: meet recaps, weekly results, risers and the Story of the Week from Mountain State Miles.">
  <link rel="canonical" href="https://mountainstatemiles.com/news">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mountain State Miles">
  <meta property="og:title" content="News &amp; Recaps — Mountain State Miles">
  <meta property="og:description" content="Meet recaps, weekly results, risers and the Story of the Week from Mountain State Miles.">
  <meta property="og:url" content="https://mountainstatemiles.com/news">
  <meta property="og:image" content="https://mountainstatemiles.com/assets/images/favicon/web-app-manifest-512x512.png">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    /* Scoped to .nw- so nothing collides with the shared stylesheet. */
    .nw-main{max-width:1180px;margin:0 auto;padding:1.75rem 1.25rem 5rem}
    .nw-skip{position:absolute;left:-9999px;top:0;background:var(--primary);color:#fff;padding:.6rem 1rem;border-radius:0 0 var(--radius-md) 0;z-index:99}
    .nw-skip:focus{left:0}

    .nw-head{margin-bottom:1.5rem}
    .nw-head h1{margin:0 0 .35rem;font-size:clamp(1.9rem,4.6vw,2.7rem)}
    .nw-head p{margin:0;color:var(--text-secondary);max-width:64ch;line-height:1.6}

    /* ---- toolbar ---- */
    .nw-toolbar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin:1.25rem 0 1.1rem;padding:.85rem 1rem;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 5px 18px var(--shadow-light)}
    .nw-search{flex:1 1 240px;min-width:180px;font:inherit;border:1px solid var(--border);border-radius:99px;background:var(--bg-secondary);color:var(--text-primary);padding:.6rem 1rem;transition:border-color .18s ease,box-shadow .18s ease}
    .nw-search:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent)}
    .nw-select{font:inherit;font-weight:700;border:1px solid var(--border);border-radius:99px;background:var(--bg-secondary);color:var(--text-secondary);padding:.6rem .9rem;cursor:pointer}
    .nw-select:focus{outline:2px solid var(--primary);outline-offset:1px}
    .nw-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.1rem}
    .nw-chip{border:1px solid var(--border);border-radius:99px;background:var(--bg-primary);color:var(--text-secondary);font:inherit;font-size:.8rem;font-weight:800;padding:.42rem .9rem;cursor:pointer;transition:background .18s ease,color .18s ease,border-color .18s ease}
    .nw-chip:hover{border-color:var(--primary);color:var(--primary)}
    .nw-chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
    .nw-count{margin-left:auto;color:var(--text-tertiary);font-size:.8rem;font-weight:700}

    /* ---- featured story ---- */
    .nw-feature{position:relative;overflow:hidden;border-radius:var(--radius-xl);background:linear-gradient(140deg,var(--bg-dark),#1e4235);color:#fbf7ef;padding:clamp(1.4rem,3.5vw,2.6rem);margin-bottom:2rem;box-shadow:0 12px 34px var(--shadow-medium)}
    .nw-feature .nw-kicker{color:var(--msm-gold);font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    .nw-feature h2{margin:.5rem 0 .6rem;font-size:clamp(1.5rem,3.6vw,2.35rem);line-height:1.12;color:#fff}
    .nw-feature .nw-dek{font-size:clamp(.98rem,2vw,1.15rem);font-weight:700;color:rgba(251,247,239,.86);line-height:1.5;margin:0 0 1rem}
    .nw-feature .nw-body{color:rgba(251,247,239,.8);line-height:1.7;font-size:.95rem;max-width:70ch}
    .nw-feature .nw-body p{margin:0 0 .9rem}
    .nw-feature .nw-stats{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.1rem 0 0}
    .nw-feature .nw-stats span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:.34rem .8rem;border-radius:99px;font-size:.76rem;font-weight:800}
    .nw-feature .nw-byline{margin-top:1.1rem;font-size:.8rem;color:rgba(251,247,239,.62)}

    /* ---- grid ---- */
    .nw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.1rem;align-items:start}
    @media (max-width:640px){.nw-grid{grid-template-columns:1fr}}

    .nw-card{display:flex;flex-direction:column;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 5px 18px var(--shadow-light);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
    .nw-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px var(--shadow-medium);border-color:color-mix(in srgb, var(--primary) 40%, var(--border))}
    @media (prefers-reduced-motion: reduce){.nw-card{transition:none}.nw-card:hover{transform:none}}
    .nw-thumb{position:relative;aspect-ratio:16/9;background:var(--bg-secondary);overflow:hidden}
    .nw-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
    .nw-card:hover .nw-thumb img{transform:scale(1.04)}
    @media (prefers-reduced-motion: reduce){.nw-card:hover .nw-thumb img{transform:none}}
    .nw-thumb-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;background:linear-gradient(140deg,var(--bg-secondary),color-mix(in srgb, var(--primary) 16%, var(--bg-secondary)))}
    .nw-card-body{padding:1rem 1.1rem 1.15rem;display:flex;flex-direction:column;flex:1}
    .nw-meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.72rem;font-weight:800;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
    .nw-tag{background:color-mix(in srgb, var(--primary) 16%, transparent);color:var(--primary);border-radius:99px;padding:.2rem .6rem;font-size:.68rem}
    .nw-card h3{margin:0 0 .45rem;font-size:1.08rem;line-height:1.3}
    .nw-card h3 a{color:inherit;text-decoration:none}
    .nw-card h3 a:hover{color:var(--primary)}
    .nw-card h3 a:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px}
    .nw-excerpt{margin:0 0 .8rem;color:var(--text-secondary);font-size:.88rem;line-height:1.55}
    .nw-card-foot{margin-top:auto;display:flex;align-items:center;gap:.6rem;font-size:.74rem;color:var(--text-tertiary);font-weight:700}
    .nw-read{border:0;background:transparent;color:var(--primary);font:inherit;font-weight:800;font-size:.8rem;cursor:pointer;padding:0;margin-left:auto}
    .nw-read:hover{text-decoration:underline}

    /* ---- article view ---- */
    .nw-article{max-width:760px;margin:0 auto}
    .nw-back{border:1px solid var(--border);background:var(--bg-primary);color:var(--text-secondary);font:inherit;font-weight:800;font-size:.82rem;border-radius:99px;padding:.5rem 1rem;cursor:pointer;margin-bottom:1.25rem}
    .nw-back:hover{border-color:var(--primary);color:var(--primary)}
    .nw-article h1{margin:.5rem 0 .7rem;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.14}
    .nw-article .nw-hero{width:100%;border-radius:var(--radius-lg);margin:1.1rem 0;display:block}
    .nw-prose{font-size:1.02rem;line-height:1.75;color:var(--text-primary)}
    .nw-prose p{margin:0 0 1.15rem}
    .nw-prose h3{margin:1.6rem 0 .6rem;font-size:1.2rem;color:var(--primary)}
    .nw-prose ul,.nw-prose ol{margin:0 0 1.15rem;padding-left:1.35rem}
    .nw-prose li{margin-bottom:.45rem}
    .nw-prose blockquote{margin:0 0 1.15rem;padding:.2rem 0 .2rem 1.1rem;border-left:4px solid var(--msm-gold);font-family:var(--font-display);font-style:italic;font-size:1.1rem;color:var(--text-secondary)}
    .nw-prose a{color:var(--primary)}
    .nw-prose img{max-width:100%;height:auto;border-radius:var(--radius-md);margin:.6rem 0}
    .nw-highlights{margin:1.4rem 0;padding:1.1rem 1.25rem;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg)}
    .nw-highlights h4{margin:0 0 .6rem;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-tertiary)}
    .nw-highlights ul{margin:0;padding-left:1.2rem}
    .nw-highlights li{margin-bottom:.4rem;line-height:1.55}

    .nw-share{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:1.75rem 0 0;padding-top:1.2rem;border-top:1px solid var(--border)}
    .nw-share span{font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-tertiary)}
    .nw-share button,.nw-share a{border:1px solid var(--border);background:var(--bg-primary);color:var(--text-secondary);font:inherit;font-weight:800;font-size:.8rem;border-radius:99px;padding:.45rem .85rem;cursor:pointer;text-decoration:none}
    .nw-share button:hover,.nw-share a:hover{border-color:var(--primary);color:var(--primary)}

    /* ---- states ---- */
    .nw-skeleton{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-lg);height:260px;overflow:hidden;position:relative}
    .nw-skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb, var(--text-primary) 7%, transparent),transparent);animation:nw-shimmer 1.4s infinite}
    @keyframes nw-shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
    @media (prefers-reduced-motion: reduce){.nw-skeleton::after{animation:none}}
    .nw-empty{text-align:center;padding:3.5rem 1.25rem;background:var(--bg-primary);border:1px dashed var(--border);border-radius:var(--radius-lg)}
    .nw-empty-ico{font-size:2.4rem;margin-bottom:.6rem}
    .nw-empty h3{margin:0 0 .4rem}
    .nw-empty p{margin:0;color:var(--text-secondary);line-height:1.6}
    .nw-error{border-left:4px solid var(--danger)}

    .nw-more{display:block;margin:1.75rem auto 0;border:1px solid var(--border);background:var(--bg-primary);color:var(--text-primary);font:inherit;font-weight:800;border-radius:99px;padding:.75rem 1.5rem;cursor:pointer;transition:border-color .18s ease,color .18s ease}
    .nw-more:hover{border-color:var(--primary);color:var(--primary)}

    .nw-visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    /* Printing usually means printing one article. */
    @media print{
      .nw-toolbar,.nw-chips,.nw-share,.nw-back,.nw-more,#global-header,#global-footer,.nw-feature .nw-stats{display:none !important}
      .nw-card{break-inside:avoid;box-shadow:none}
      .nw-article{max-width:none}
      .nw-feature{background:#fff !important;color:#000 !important;box-shadow:none;border:1px solid #ccc}
      .nw-feature h2,.nw-feature .nw-body,.nw-feature .nw-dek,.nw-feature .nw-kicker{color:#000 !important}
    }
  </style>

<body>
  <a class="nw-skip" href="#nw-content">Skip to news</a>
  <div id="global-header"></div>

  <main class="nw-main" id="nw-content">
    <div id="nw-view" aria-live="polite">
      <div class="nw-head">
        <h1>📰 News &amp; Recaps</h1>
        <p>Meet recaps, weekly results and the numbers behind them — plus the Story of the Week from across West Virginia.</p>
      </div>
      <div class="nw-grid" id="nw-skeletons">
        <div class="nw-skeleton"></div><div class="nw-skeleton"></div><div class="nw-skeleton"></div>
      </div>
    </div>
  </main>

  <div id="global-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="/CrossCountry/firebase-config.js"></script>
  <script src="/scripts/msm-rating.js"></script>
  <script src="/scripts/hub-engine.js"></script>
  <script>
  (function () {
    'use strict';

    var PAGE_SIZE = 9;
    var db = window.firebaseDatabase;

    /* ==================================================================
     *  State
     * ================================================================== */

    var state = {
      articles: [],
      featured: null,
      error: null,
      query: '',
      category: 'all',
      sort: 'newest',
      shown: PAGE_SIZE,
      route: { name: 'list', id: null },
      hubReady: false,
    };

    var view = document.getElementById('nw-view');

    /* ==================================================================
     *  Helpers
     * ================================================================== */

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function slugify(text) {
      return String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70);
    }

    function articleId(item) {
      return item.id || slugify(item.title || 'article');
    }

    function fullDate(value) {
      var d = new Date(String(value || '').slice(0, 10) + 'T12:00:00');
      if (isNaN(d)) return 'Date TBD';
      return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }

    function shortDate(value) {
      var d = new Date(String(value || '').slice(0, 10) + 'T12:00:00');
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    /** "3 days ago" for recent items, a plain date once it is older. */
    function relativeDate(value) {
      var d = new Date(String(value || '').slice(0, 10) + 'T12:00:00');
      if (isNaN(d)) return '';
      var days = Math.round((Date.now() - d.getTime()) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 7) return days + ' days ago';
      if (days < 30) return Math.floor(days / 7) + ' week' + (Math.floor(days / 7) === 1 ? '' : 's') + ' ago';
      return shortDate(value);
    }

    function readingTime(text) {
      var words = String(text || '').replace(/<[^>]*>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
      return Math.max(1, Math.round(words / 200));
    }

    function hasMarkup(text) {
      return /<\/?[a-z][\s\S]*>/i.test(String(text || ''));
    }

    /**
     * News content is authored in the admin, but it is still rendered on a
     * public page, so any HTML is filtered through a whitelist: no scripts,
     * no inline handlers, no javascript: URLs.
     */
    var ALLOWED = { P: 1, BR: 1, STRONG: 1, B: 1, EM: 1, I: 1, U: 1, A: 1, UL: 1, OL: 1, LI: 1, H2: 1, H3: 1, H4: 1, BLOCKQUOTE: 1, IMG: 1, FIGURE: 1, FIGCAPTION: 1, HR: 1, SPAN: 1 };

    function sanitize(html) {
      var doc;
      try {
        doc = new DOMParser().parseFromString('<div id="root">' + String(html || '') + '</div>', 'text/html');
      } catch (e) {
        return esc(String(html || ''));
      }
      var root = doc.getElementById('root');
      if (!root) return '';

      Array.prototype.slice.call(root.querySelectorAll('*')).forEach(function (node) {
        if (!ALLOWED[node.tagName]) {
          // Unwrap unknown elements (keep their text) instead of dropping it.
          while (node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
          node.parentNode.removeChild(node);
          return;
        }
        Array.prototype.slice.call(node.attributes).forEach(function (attr) {
          var name = attr.name.toLowerCase();
          var value = String(attr.value || '');
          if (name.indexOf('on') === 0) { node.removeAttribute(attr.name); return; }
          if (name === 'style' || name === 'class' || name === 'id') { node.removeAttribute(attr.name); return; }
          if ((name === 'href' || name === 'src') && /^\s*(javascript|data|vbscript):/i.test(value)) {
            node.removeAttribute(attr.name);
          }
        });
        if (node.tagName === 'A') {
          node.setAttribute('rel', 'noopener noreferrer');
          if (/^https?:/i.test(node.getAttribute('href') || '')) node.setAttribute('target', '_blank');
        }
        if (node.tagName === 'IMG') {
          node.setAttribute('loading', 'lazy');
          node.removeAttribute('width');
          node.removeAttribute('height');
        }
      });

      return root.innerHTML;
    }

    /** Plain text (or markup) -> safe HTML paragraphs. */
    function renderContent(text) {
      var value = String(text || '').trim();
      if (!value) return '';
      if (hasMarkup(value)) return sanitize(value);
      return value.split(/\n\s*\n/).map(function (chunk) {
        return '<p>' + esc(chunk).replace(/\n/g, '<br>') + '</p>';
      }).join('');
    }

    function plainExcerpt(item, length) {      var source = item.summary || item.excerpt || item.content || '';
      var text = hasMarkup(source) ? sanitize(source).replace(/<[^>]+>/g, ' ') : String(source);
      text = text.replace(/\s+/g, ' ').trim();
      if (text.length <= length) return text;
      return text.slice(0, length).replace(/\s+\S*$/, '') + '…';
    }

    /** Stored highlights sometimes carry their own bullet glyph and tab. */
    function cleanHighlight(text) {
      return String(text == null ? '' : text).replace(/^[\s\u2022\u00b7\u2013\u2014*\-]+/, '').trim();
    }

    function imageOf(item) {
      return item.image || item.imageUrl || item.hero || '';
    }

    function copyLink(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(url).then(function () { return true; }).catch(function () { return false; });
      }
      var area = document.createElement('textarea');
      area.value = url;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      area.remove();
      return Promise.resolve(ok);
    }

    function toast(message) {
      var el = document.getElementById('nw-toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'nw-toast';
        el.setAttribute('role', 'status');
        el.style.cssText = 'position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--bg-dark);color:#fbf7ef;font-weight:700;font-size:.85rem;padding:.7rem 1.15rem;border-radius:99px;z-index:999;box-shadow:0 10px 26px rgba(0,0,0,.28);transition:opacity .25s ease';
        document.body.appendChild(el);
      }
      el.textContent = message;
      el.style.opacity = '1';
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function () { el.style.opacity = '0'; }, 2400);
    }

    /* ==================================================================
     *  Filtering + sorting
     * ================================================================== */

    function categories() {
      var seen = {};
      state.articles.forEach(function (item) {
        var cat = String(item.category || '').trim();
        if (cat) seen[cat] = (seen[cat] || 0) + 1;
      });
      return Object.keys(seen).sort();
    }

    function filtered() {
      var query = state.query.trim().toLowerCase();
      var out = state.articles.filter(function (item) {
        if (state.category !== 'all' && String(item.category || '') !== state.category) return false;
        if (!query) return true;
        var haystack = [
          item.title,
          item.category,
          plainExcerpt(item, 4000),
          (item.highlights || []).join(' '),
        ].join(' ').toLowerCase();
        return haystack.indexOf(query) !== -1;
      });

      out.sort(function (a, b) {
        if (state.sort === 'az') return String(a.title || '').localeCompare(String(b.title || ''));
        var cmp = String(a.date || '').localeCompare(String(b.date || ''));
        return state.sort === 'oldest' ? cmp : -cmp;
      });
      return out;
    }

    /* ==================================================================
     *  Views
     * ================================================================== */

    function skeletonGrid() {
      return '<div class="nw-grid">' + Array(3).join() + '<div class="nw-skeleton"></div><div class="nw-skeleton"></div><div class="nw-skeleton"></div></div>';
    }

    function featuredHtml() {
      var story = state.featured;
      if (!story || story.active === false) return '';
      var resolve = state.hubReady && window.MSMHub && typeof window.MSMHub.resolveStoryTokens === 'function'
        ? window.MSMHub.resolveStoryTokens
        : function (value) { return value; };

      var kicker = resolve(story.kicker || 'Story of the Week');
      var title = resolve(story.title || '');
      var dek = resolve(story.dek || '');
      if (!String(title).trim()) return '';

      var body = String(resolve(story.body || ''))
        .split(/\n\s*\n/)
        .map(function (p) { return '<p>' + esc(p) + '</p>'; })
        .join('');

      var stats = state.hubReady && window.MSMHub && window.MSMHub.state ? window.MSMHub.state.storyStats || {} : {};
      var pills = [];
      if (stats.rated_performances) pills.push(esc(stats.rated_performances) + ' rated performances');
      if (stats.schools_competing) pills.push(esc(stats.schools_competing) + ' schools');
      if (stats.next_meet) pills.push('Next: ' + esc(stats.next_meet));

      return '<article class="nw-feature">' +
        '<div class="nw-kicker">' + esc(kicker) + '</div>' +
        '<h2>' + esc(title) + '</h2>' +
        (dek ? '<p class="nw-dek">' + esc(dek) + '</p>' : '') +
        (body ? '<div class="nw-body">' + body + '</div>' : '') +
        (pills.length ? '<div class="nw-stats">' + pills.map(function (p) { return '<span>' + p + '</span>'; }).join('') + '</div>' : '') +
        (story.author ? '<div class="nw-byline">' + esc(story.author) + (state.hubReady ? ' · stats update live' : '') + '</div>' : '') +
        '</article>';
    }

    function cardHtml(item) {
      var id = articleId(item);
      var img = imageOf(item);
      var minutes = readingTime(item.content);
      var highlights = (item.highlights || []).length;

      var thumb = '<div class="nw-thumb">' +
        (img
          ? '<img src="' + esc(img) + '" alt="" loading="lazy" decoding="async" onerror="this.style.display=\'none\';this.parentNode.querySelector(\'.nw-thumb-fallback\').style.display=\'flex\'">' +
            '<div class="nw-thumb-fallback" style="display:none">🏃</div>'
          : '<div class="nw-thumb-fallback">🏃</div>') +
        '</div>';

      return '<article class="nw-card">' + thumb +
        '<div class="nw-card-body">' +
        '<div class="nw-meta">' +
        (item.category ? '<span class="nw-tag">' + esc(item.category) + '</span>' : '') +
        '<span>' + esc(relativeDate(item.date)) + '</span>' +
        '</div>' +
        '<h3><a href="#/article/' + encodeURIComponent(id) + '" data-open="' + esc(id) + '">' + esc(item.title || 'Untitled') + '</a></h3>' +
        '<p class="nw-excerpt">' + esc(plainExcerpt(item, 165)) + '</p>' +
        '<div class="nw-card-foot">' + minutes + ' min read' + (highlights ? ' · ' + highlights + ' key points' : '') +
        '<button class="nw-read" type="button" data-open="' + esc(id) + '">Read →</button>' +
        '</div></div></article>';
    }

    function articleHtml(item) {
      var img = imageOf(item);
      var highlights = (item.highlights || []).filter(Boolean).map(cleanHighlight);
      var shareUrl = 'https://mountainstatemiles.com/news#/article/' + encodeURIComponent(articleId(item));
      var shareTitle = item.title || 'Mountain State Miles';

      return '<div class="nw-article">' +
        '<button class="nw-back" type="button" data-back>← All news</button>' +
        '<div class="nw-meta">' +
        (item.category ? '<span class="nw-tag">' + esc(item.category) + '</span>' : '') +
        '<span>' + esc(fullDate(item.date)) + '</span>' +
        '<span>' + readingTime(item.content) + ' min read</span>' +
        '</div>' +
        '<h1>' + esc(item.title || 'Untitled') + '</h1>' +
        (img ? '<img class="nw-hero" src="' + esc(img) + '" alt="" loading="lazy" decoding="async">' : '') +
        '<div class="nw-prose">' + renderContent(item.content) + '</div>' +
        (highlights.length
          ? '<div class="nw-highlights"><h4>Key points</h4><ul>' + highlights.map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('') + '</ul></div>'
          : '') +
        '<div class="nw-share"><span>Share</span>' +
        '<button type="button" data-copy="' + esc(shareUrl) + '">🔗 Copy link</button>' +
        '<a href="https://twitter.com/intent/tweet?url=' + encodeURIComponent(shareUrl) + '&text=' + encodeURIComponent(shareTitle) + '" target="_blank" rel="noopener noreferrer">X</a>' +
        '<a href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl) + '" target="_blank" rel="noopener noreferrer">Facebook</a>' +
        '<a href="mailto:?subject=' + encodeURIComponent(shareTitle) + '&body=' + encodeURIComponent(shareUrl) + '">Email</a>' +
        '<button type="button" data-print>🖨 Print</button>' +
        '</div></div>';
    }

    function emptyHtml(message, hint) {
      return '<div class="nw-empty"><div class="nw-empty-ico">📭</div><h3>' + esc(message) + '</h3><p>' + esc(hint) + '</p></div>';
    }

    function listHtml() {
      var items = filtered();
      var cats = categories();

      var toolbar = '<div class="nw-toolbar">' +
        '<label class="nw-visually-hidden" for="nw-search">Search news</label>' +
        '<input class="nw-search" id="nw-search" type="search" placeholder="Search recaps, teams, athletes…" value="' + esc(state.query) + '">' +
        '<label class="nw-visually-hidden" for="nw-sort">Sort</label>' +
        '<select class="nw-select" id="nw-sort">' +
        '<option value="newest"' + (state.sort === 'newest' ? ' selected' : '') + '>Newest first</option>' +
        '<option value="oldest"' + (state.sort === 'oldest' ? ' selected' : '') + '>Oldest first</option>' +
        '<option value="az"' + (state.sort === 'az' ? ' selected' : '') + '>A–Z</option>' +
        '</select>' +
        '<span class="nw-count" id="nw-result-count">' + items.length + ' article' + (items.length === 1 ? '' : 's') + '</span>' +
        '</div>';

      var chips = '';
      if (cats.length > 1) {
        chips = '<div class="nw-chips">' +
          ['all'].concat(cats).map(function (cat) {
            var label = cat === 'all' ? 'All' : cat;
            return '<button class="nw-chip" type="button" data-category="' + esc(cat) + '" aria-pressed="' + (state.category === cat) + '">' + esc(label) + '</button>';
          }).join('') +
          '</div>';
      }

      var body;
      if (state.error) {
        body = '<div class="nw-empty nw-error"><div class="nw-empty-ico">⚠️</div><h3>We could not load the news</h3><p>' + esc(state.error) + '</p></div>';
      } else if (!state.articles.length) {
        body = emptyHtml('No news yet', 'Recaps are published after each meet weekend. Check back soon.');
      } else if (!items.length) {
        body = emptyHtml('Nothing matches that', 'Try a different search term or clear the category filter.');
      } else {
        var page = items.slice(0, state.shown);
        body = '<div class="nw-grid">' + page.map(cardHtml).join('') + '</div>';
        if (items.length > page.length) {
          body += '<button class="nw-more" type="button" data-more>Show ' + Math.min(PAGE_SIZE, items.length - page.length) + ' more</button>';
        }
      }

      return '<div class="nw-head"><h1>📰 News &amp; Recaps</h1>' +
        '<p>Meet recaps, weekly results and the numbers behind them — plus the Story of the Week from across West Virginia.</p></div>' +
        featuredHtml() + toolbar + chips + body;
    }

    /* ==================================================================
     *  Routing
     * ================================================================== */

    function parseHash() {
      var hash = String(window.location.hash || '').replace(/^#\/?/, '');
      var parts = hash.split('/').filter(Boolean);
      if (parts[0] === 'article' && parts[1]) return { name: 'article', id: decodeURIComponent(parts[1] + (parts[2] ? '/' + parts.slice(2).join('/') : '')) };
      return { name: 'list', id: null };
    }

    function findArticle(id) {
      return state.articles.filter(function (item) { return articleId(item) === id; })[0] || null;
    }

    function render() {
      if (!state.articles.length && !state.error && state.route.name === 'list') {
        view.innerHTML = '<div class="nw-head"><h1>📰 News &amp; Recaps</h1>' +
          '<p>Meet recaps, weekly results and the numbers behind them — plus the Story of the Week from across West Virginia.</p></div>' +
          skeletonGrid();
        return;
      }

      if (state.route.name === 'article') {
        var item = findArticle(state.route.id);
        if (!item) {
          view.innerHTML = '<div class="nw-article">' +
            '<button class="nw-back" type="button" data-back>← All news</button>' +
            emptyHtml('That article could not be found', 'It may have been removed or the link may be mistyped.') +
            '</div>';
          return;
        }
        view.innerHTML = articleHtml(item);
        document.title = (item.title || 'News') + ' — Mountain State Miles';
        return;
      }

      view.innerHTML = listHtml();
      document.title = 'News & Recaps — Mountain State Miles';
    }

    /* ==================================================================
     *  Events
     * ================================================================== */

    view.addEventListener('click', function (event) {
      var target = event.target;

      var open = target.closest('[data-open]');
      if (open) {
        // Let the anchor's own hash navigation do the work; this only makes the
        // button form behave identically.
        if (target.tagName !== 'A') {
          var id = open.getAttribute('data-open');
          window.location.hash = '#/article/' + encodeURIComponent(id);
        }
        return;
      }

      if (target.closest('[data-back]')) {
        window.location.hash = '';
        return;
      }

      var chip = target.closest('[data-category]');
      if (chip) {
        state.category = chip.getAttribute('data-category');
        state.shown = PAGE_SIZE;
        render();
        return;
      }

      if (target.closest('[data-more]')) {
        state.shown += PAGE_SIZE;
        render();
        return;
      }

      var copy = target.closest('[data-copy]');
      if (copy) {
        copyLink(copy.getAttribute('data-copy')).then(function (ok) {
          toast(ok ? 'Link copied' : 'Could not copy the link');
        });
        return;
      }

      if (target.closest('[data-print]')) {
        window.print();
      }
    });

    var searchTimer = null;
    view.addEventListener('input', function (event) {
      if (event.target.id !== 'nw-search') return;
      var value = event.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        state.query = value;
        state.shown = PAGE_SIZE;
        render();
        var box = document.getElementById('nw-search');
        if (box) {
          box.focus();
          // Keep the caret at the end after the list re-renders.
          box.setSelectionRange(box.value.length, box.value.length);
        }
      }, 220);
    });

    view.addEventListener('change', function (event) {
      if (event.target.id !== 'nw-sort') return;
      state.sort = event.target.value;
      state.shown = PAGE_SIZE;
      render();
    });

    window.addEventListener('hashchange', function () {
      state.route = parseHash();
      render();
      if (state.route.name === 'article') window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    /* ==================================================================
     *  Data
     * ================================================================== */

    /** Pull an image URL out of the many shapes the admin has used. */
    function normalizeArticle(id, value) {
      var item = Object.assign({}, value || {}, { id: id });
      if (!item.image && item.images) {
        if (Array.isArray(item.images)) item.image = item.images[0];
        else if (typeof item.images === 'object') item.image = Object.values(item.images)[0];
      }
      if (item.highlights && !Array.isArray(item.highlights)) item.highlights = Object.values(item.highlights);
      return item;
    }

    function injectStructuredData() {
      if (!state.articles.length) return;
      var data = {
        '@context': 'https://schema.org',
        '@type': 'ItemList',
        name: 'Mountain State Miles News & Recaps',
        itemListElement: state.articles.slice(0, 15).map(function (item, index) {
          return {
            '@type': 'ListItem',
            position: index + 1,
            name: item.title || 'Untitled',
            url: 'https://mountainstatemiles.com/news#/article/' + encodeURIComponent(articleId(item)),
          };
        }),
      };
      var script = document.getElementById('nw-structured-data');
      if (!script) {
        script = document.createElement('script');
        script.id = 'nw-structured-data';
        script.type = 'application/ld+json';
        document.head.appendChild(script);
      }
      script.textContent = JSON.stringify(data);
    }

    async function loadNews() {
      try {
        if (!db) throw new Error('Firebase did not initialize.');
        var results = await Promise.all([
          db.ref('news').once('value'),
          db.ref('featuredStory').once('value').catch(function () { return null; }),
        ]);

        var items = [];
        results[0].forEach(function (child) {
          items.push(normalizeArticle(child.key, child.val()));
        });

        items.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
        state.articles = items;
        state.featured = results[1] && results[1].exists() ? results[1].val() : null;
        state.route = parseHash();
        render();
        injectStructuredData();
      } catch (error) {
        console.error('Error loading news:', error);
        state.error = error.message || 'Please try again in a moment.';
        render();
      } finally {
        document.dispatchEvent(new Event('MSMDataLoaded'));
      }
    }

    /* The featured story is worth showing immediately, and its stats get
       upgraded in place once the hub finishes loading. */
    loadNews().then(function () {
      if (!window.MSMHub || typeof window.MSMHub.load !== 'function') return;
      return window.MSMHub.load()
        .then(function () {
          state.hubReady = true;
          if (state.route.name === 'list') render();
        })
        .catch(function (error) { console.warn('Live stats unavailable:', error); });
    });
  })();
  </script>
</body>
</html>
