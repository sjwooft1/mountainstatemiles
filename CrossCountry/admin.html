<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cross Country Admin Dashboard</title>
  <link rel="stylesheet" href="/assets/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/assets/theme-toggle.js" defer></script>
  <script src="/assets/components.js" defer></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.1/jspdf.plugin.autotable.min.js"></script>
  <script defer src="/assets/pdf-branding.js"></script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: radial-gradient(circle at top left, #101425 0%, #050712 35%, #020308 100%);
      --panel: rgba(8, 12, 26, 0.96);
      --card: rgba(18, 24, 44, 0.96);
      --accent: #ff7b2d;
      --accent-hover: #ff9a4f;
      --muted: #9fb4c8;
      --border: rgba(255,255,255,0.08);
      --hover: rgba(255,255,255,0.06);
      --success: #22c55e;
      --danger: #f97373;
      --warning: #eab308;
      --info: #38bdf8;
      --shadow-soft: 0 18px 45px rgba(0,0,0,0.55);
      --radius-lg: 18px;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #020308;
      background-image: var(--bg);
      color: #e6f0f7;
      -webkit-font-smoothing: antialiased;
    }

    body { overflow: hidden; }

    .app-wrapper {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, rgba(8,12,26,0.98) 0%, rgba(8,12,26,0.96) 40%, rgba(8,12,26,0.94) 100%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      gap: 20px;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 10px 25px rgba(0,0,0,0.55);
    }

    .sidebar-brand h1 {
      font-size: 1.05rem;
      margin: 0;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.03em;
    }

    .sidebar-brand .subtitle {
      font-size: 0.72rem;
      color: var(--accent);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
    }

    .nav-section { display: flex; flex-direction: column; gap: 4px; }

    .nav-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding: 8px 12px;
      font-weight: 700;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.18s ease-out;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      text-decoration: none;
    }

    .nav-btn:hover {
      background: var(--hover);
      color: #fff;
      border-color: var(--border);
      transform: translateX(2px);
    }

    .nav-btn.active {
      background: radial-gradient(circle at top left, var(--accent) 0%, var(--accent-hover) 45%, #ffd28c 140%);
      color: #17100a;
      box-shadow: 0 10px 26px rgba(255, 123, 45, 0.4);
      font-weight: 700;
    }

    .sidebar-spacer { flex: 1; }

    .logout-section { padding-top: 16px; border-top: 1px solid var(--border); }

    .logout-btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      background: var(--danger);
      color: white;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover { background: #d64545; transform: translateY(-2px); }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(90deg, rgba(12,18,40,0.98), rgba(18,27,54,0.98));
      border-bottom: 1px solid var(--border);
      gap: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      position: relative;
      z-index: 5;
      flex-wrap: wrap;
    }

    .topbar h2 { margin: 0; font-size: 1.3rem; font-weight: 700; }

    .topbar-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .topbar-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .topbar-links a:hover { color: #fff; border-color: var(--accent); }

    .topbar-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .topbar-pill {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.9);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .content { flex: 1; overflow: auto; padding: 24px; }

    /* Grid */
    .grid-container {
      background: radial-gradient(circle at top left, rgba(21, 32, 63, 0.95), rgba(11, 18, 34, 0.97));
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: var(--shadow-soft);
    }

    .grid-header {
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .grid-header h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }

    .grid-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--hover); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #e05555; transform: translateY(-1px); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #1ea855; }
    .btn-small { padding: 4px 10px; font-size: 0.8rem; }

    #grid-search, .form-input select, select.form-input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #e6f0f7;
      border-radius: 6px;
      min-width: 190px;
    }

    .grid-scroll { flex: 1; overflow: auto; position: relative; }

    .grid-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }

    .grid-table thead { position: sticky; top: 0; z-index: 10; background: var(--card); }

    .grid-table th {
      padding: 12px 14px;
      text-align: left;
      font-weight: 700;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
    }

    .grid-table th:hover { background: var(--hover); color: #fff; }

    .grid-table tbody tr { border-bottom: 1px solid var(--border); transition: all 0.15s; }
    .grid-table tbody tr:hover { background: var(--hover); }
    .grid-table td { padding: 10px 14px; border-right: 1px solid var(--border); vertical-align: top; }
    .grid-table td:last-child { border-right: none; white-space: nowrap; }

    .empty-state { padding: 50px 20px; text-align: center; color: var(--muted); }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; animation: fadeIn 0.2s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 620px;
      width: 92%;
      max-height: 90vh;
      overflow: auto;
      animation: slideUp 0.25s;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .modal-header {
      padding: 20px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { margin: 0; font-size: 1.25rem; }
    .modal-close {
      background: none; border: none; font-size: 1.4rem; color: var(--muted);
      cursor: pointer; width: 32px; height: 32px; border-radius: 6px;
    }
    .modal-close:hover { background: var(--hover); color: #fff; }
    .modal-body { padding: 22px 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; justify-content: flex-end; }

    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-weight: 600; color: var(--muted); font-size: 0.87rem; }
    .form-input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #e6f0f7;
      border-radius: 6px;
      font-size: 0.94rem;
      width: 100%;
      font-family: inherit;
    }
    .form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 123, 45, 0.15); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 16px; margin-bottom: 16px; }

    .checkbox-grid {
      display: flex; flex-wrap: wrap; gap: 10px; max-height: 220px; overflow: auto;
      padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    }
    .checkbox-grid .chk { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
    .stat-number { font-size: 2.3rem; font-weight: 700; color: var(--accent); margin: 0; }
    .stat-label { color: var(--muted); font-size: 0.88rem; margin: 8px 0 0; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .panel h3 { margin: 0 0 8px 0; }
    .panel h4 { margin: 16px 0 8px 0; font-size: 0.95rem; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

    .badge {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px;
      font-size: 0.76rem; font-weight: 700; white-space: nowrap;
    }
    .badge-success { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
    .badge-warning { background: rgba(234,179,8,0.15); color: #eab308; border: 1px solid rgba(234,179,8,0.4); }
    .badge-danger { background: rgba(249,115,115,0.15); color: #f97373; border: 1px solid rgba(249,115,115,0.4); }
    .badge-info { background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); }
    .badge-muted { background: rgba(159,180,200,0.12); color: var(--muted); border: 1px solid var(--border); }

    .alert { padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; margin-top: 10px; }
    .alert-success { background: rgba(34,197,94,0.12); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
    .alert-danger { background: rgba(249,115,115,0.12); color: #f97373; border: 1px solid rgba(249,115,115,0.4); }

    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .muted { color: var(--muted); }

    .mobile-menu-button {
      display: none; width: 44px; height: 44px; padding: 10px;
      background: transparent; border: none; color: #e6f0f7; font-size: 1.4rem; cursor: pointer;
    }
    .mobile-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; }
    .mobile-menu-overlay.active { display: block; }

    @media (max-width: 900px) {
      .app-wrapper { flex-direction: column; }
      .sidebar {
        position: fixed; left: 0; top: 0; width: 270px; height: 100vh; z-index: 999;
        transform: translateX(-100%); transition: transform 0.3s ease;
      }
      .sidebar.mobile-open { transform: translateX(0); }
      .mobile-menu-button { display: block; }
      .content { padding: 14px; }
      .topbar { padding: 12px 14px; }
      .topbar-info { display: none; }
      .topbar { flex-wrap: nowrap; justify-content: space-between; }
      .topbar h2 { flex: 1; text-align: center; }
      .mobile-refresh { width:42px; height:42px; align-items:center; justify-content:center; flex-shrink:0; }
      .form-grid { grid-template-columns: 1fr; }
    }

    /* Fast, spreadsheet-style data tools */
    .grid-container { min-height: min(720px, calc(100vh - 150px)); }
    .grid-header { align-items: flex-start; }
    .grid-actions { flex: 1; justify-content: flex-end; }
    #grid-search { min-width: min(360px, 100%); flex: 1 1 260px; max-width: 460px; }
    .search-hint { width: 100%; text-align: right; color: var(--muted); font-size: .73rem; }
    .grid-table { min-width: 720px; }
    .grid-table th { position: sticky; top: 0; }
    .grid-table td[ data-editable="true"] { cursor: cell; }
    .grid-table td[data-editable="true"]:hover { box-shadow: inset 0 0 0 1px var(--accent); }
    .grid-table td[data-editing="true"] { padding: 4px; }
    .cell-editor { min-width: 90px; width: 100%; padding: 7px; border: 1px solid var(--accent); border-radius: 4px; background: #101729; color: #fff; font: inherit; outline: 2px solid rgba(255,123,45,.2); }
    .grid-footer { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 16px; border-top:1px solid var(--border); color:var(--muted); font-size:.82rem; }
    .grid-footer-controls { display:flex; align-items:center; gap:8px; }
    .grid-footer select { min-width:70px!important; padding:5px 8px!important; }
    .bulk-toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .grid-table .row-check { width:40px; text-align:center; }
    .admin-kicker { color:var(--accent); font-size:.77rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .chart-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:18px; }
    .chart-card { min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; }
    .chart-card h3 { margin:0 0 4px; font-size:.98rem; }
    .chart-card p { margin:0; color:var(--muted); font-size:.78rem; }
    .chart-card svg { width:100%; height:auto; overflow:visible; margin-top:10px; }
    .chart-empty { padding:34px 10px; text-align:center; color:var(--muted); font-size:.85rem; }
    .chart-legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; color:var(--muted); font-size:.78rem; }
    .chart-legend span { display:flex; align-items:center; gap:6px; }
    .legend-dot { width:9px;height:9px;border-radius:50%;background:var(--accent); }
    .donut-wrap { display:flex; align-items:center; justify-content:center; gap:24px; min-height:180px; flex-wrap:wrap; }
    .donut-chart { width:142px;height:142px;border-radius:50%; display:grid;place-items:center;position:relative; }
    .donut-chart:after { content:""; position:absolute; inset:24px; background:var(--panel); border-radius:50%; }
    .donut-total { z-index:1;text-align:center;font-size:1.35rem;font-weight:800; }
    .donut-total small { display:block;font-size:.68rem;color:var(--muted);font-weight:500; }
    .bar-list { display:grid; gap:12px; margin-top:18px; }
    .bar-item { display:grid; grid-template-columns:minmax(75px,1fr) 3fr auto; gap:10px; align-items:center; font-size:.8rem; }
    .bar-track { height:9px; background:rgba(159,180,200,.13); border-radius:8px; overflow:hidden; }
    .bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),#ffd28c); border-radius:inherit; }
    .dashboard-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:0 0 18px; flex-wrap:wrap; }
    .dashboard-heading h3 { margin:4px 0 0; font-size:1.45rem; }
    .insight-list { display:grid; gap:9px; padding:0; list-style:none; margin:14px 0 0; }
    .insight-list li { display:flex; align-items:flex-start; gap:9px; color:var(--muted); font-size:.86rem; }
    .insight-list strong { color:#e6f0f7; }
    .loading-indicator { width:7px;height:7px;display:inline-block;background:var(--accent);border-radius:50%;animation:pulse 1s infinite alternate; }
    @keyframes pulse { to { opacity:.25; } }
    @media(max-width:760px) { .chart-grid { grid-template-columns:1fr; } .grid-actions { justify-content:flex-start; } .search-hint { text-align:left; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; } }

    .topbar .refresh-btn { color:var(--muted); background:transparent; border:1px solid var(--border); padding:7px 10px; border-radius:8px; cursor:pointer; }
    .topbar .refresh-btn:hover { color:#fff; border-color:var(--accent); }
    .mobile-refresh { display:none; }
    #admin-toast { position:fixed; z-index:2000; bottom:22px; right:22px; max-width:min(420px,calc(100vw - 32px)); padding:12px 16px; border:1px solid var(--border); border-radius:10px; background:var(--panel); color:#e6f0f7; box-shadow:var(--shadow-soft); }
    #admin-toast[data-kind="error"] { border-color:var(--danger); }
    #admin-toast[data-kind="success"] { border-color:var(--success); }
    #admin-toast[hidden] { display:none; }
    .sort-mark { color:var(--accent); }
    .grid-table input[type="checkbox"] { accent-color:var(--accent); }
    .btn:focus-visible, .nav-btn:focus-visible, .grid-table th:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    @media(max-width:900px) { .grid-container { min-height:calc(100vh - 112px); } .topbar h2 { font-size:1.05rem; } .mobile-refresh { display:inline-flex; } .mobile-menu-button { flex-shrink:0; } }

    /* State qualification (regionals → states) */
    .qual-hero-note { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px; background:rgba(56,189,248,.08); border:1px solid rgba(56,189,248,.25); font-size:.82rem; color:var(--muted); line-height:1.45; margin-bottom:18px; }
    .qual-fields-disabled { opacity:.45; pointer-events:none; }
    .qual-preview { display:grid; gap:10px; margin-top:12px; }
    .qual-preview-race { border:1px solid var(--border); border-radius:10px; padding:11px 13px; background:var(--card); }
    .qual-preview-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; font-size:.88rem; }
    .qual-preview-head span { color:var(--muted); font-size:.74rem; white-space:nowrap; }
    .qual-preview-line { margin-top:6px; font-size:.8rem; color:var(--muted); line-height:1.45; }
    .qual-preview-line strong { color:#e6f0f7; font-weight:600; }
    .qual-preview-tag { display:inline-block; min-width:82px; margin-right:6px; color:var(--accent); font-size:.66rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
    .qual-empty { padding:16px; text-align:center; border:1px dashed var(--border); border-radius:10px; color:var(--muted); font-size:.82rem; }
    .qual-stats { display:flex; gap:16px; flex-wrap:wrap; font-size:.78rem; color:var(--muted); }
    .qual-stats b { color:#e6f0f7; }
    .qual-check { display:flex; align-items:center; gap:8px; font-weight:600; color:#e6f0f7; font-size:.92rem; cursor:pointer; }

  </style>
</head>
<body>

  <div id="global-header"></div>

  <script src="/assets/msm-loader.js"></script>

  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="/assets/images/logo.svg" alt="logo">
        <div>
          <h1>Mountain State Miles</h1>
          <div class="subtitle">XC Admin</div>
        </div>
      </div>

      <nav>
        <div class="nav-section-title">Main</div>
        <div class="nav-section" id="main-nav">
          <button class="nav-btn active" data-section="dashboard">📊 Dashboard</button>

  <script>
    // ==========================================
    // Auth Gate (must match CrossCountry/login.html EXACTLY)
    // ==========================================
    if (localStorage.getItem("&#120; &#99; &#97; &#100; &#109; &#105; &#110;") !== "&#116; &#114; &#117; &#101;") {
      window.location.replace('login.html');
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem("&#120; &#99; &#97; &#100; &#109; &#105; &#110;");
      window.location.replace('login.html');
    });

    // ==========================================
    // Utilities
    // ==========================================
    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
    function escapeAttr(str) { return escapeHtml(str); }

    function slugify(str) {
      return String(str || '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    function formatSecondsToTime(seconds) {
      if (seconds === null || seconds === undefined || isNaN(seconds)) return '—';
      const total = Number(seconds);
      const mins = Math.floor(total / 60);
      const secs = total - mins * 60;
      return `${mins}:${secs.toFixed(2).padStart(5, '0')}`;
    }

    function formatCell(value) {
      if (value === null || value === undefined || value === '') return '—';
      if (Array.isArray(value)) return escapeHtml(value.join(', '));
      return escapeHtml(String(value));
    }

    async function waitForFirebase() {
      let attempts = 0;
      while (typeof window.firebaseDatabase === 'undefined' && attempts < 50) {
        await new Promise(resolve => setTimeout(resolve, 100));
        attempts++;
      }
    }

    function updateRecordCount(count) {
      const el = document.getElementById('record-count');
      if (el) el.textContent = `${count} records`;
    }

    const ADMIN_CACHE_TTL = 30000;
    const adminDataCache = new Map();
    const GRID_PAGE_DEFAULT = 100;

    function snapshotToRows(value) {
      if (!value || typeof value !== 'object') return [];
      return Object.entries(value).map(([id, row]) => ({ ...(row || {}), id }));
    }

    async function fetchNodeAsArray(path, options = {}) {
      const cached = adminDataCache.get(path);
      if (!options.force && cached && Date.now() - cached.time < ADMIN_CACHE_TTL) return cached.rows;
      const snap = await window.firebaseDatabase.ref(path).once('value');
      const rows = snapshotToRows(snap.val());
      adminDataCache.set(path, { time: Date.now(), rows });
      return rows;
    }

    function invalidateAdminCache(path) {
      if (path) adminDataCache.delete(path);
      else adminDataCache.clear();
    }

    function showAdminToast(message, kind = 'success') {
      let toast = document.getElementById('admin-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'admin-toast';
        toast.setAttribute('role', 'status');
        toast.setAttribute('aria-live', 'polite');
        document.body.appendChild(toast);
      }
      toast.dataset.kind = kind;
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(showAdminToast.timer);
      showAdminToast.timer = setTimeout(() => { toast.hidden = true; }, 3200);
    }

    async function refreshCurrentSection() {
      invalidateAdminCache();
      const button = document.querySelector('.refresh-btn');
      if (button) { button.disabled = true; button.classList.contains('mobile-refresh') ? button.textContent = '…' : button.textContent = '↻ Loading…'; }
      try { await loadSection(currentSection); }
      finally {
        document.querySelectorAll('.refresh-btn').forEach(el => { el.disabled = false; el.textContent = el.classList.contains('mobile-refresh') ? '↻' : '↻ Refresh'; });
      }
    }

    // ==========================================
    // Direct Firebase CRUD (no bulk-edit / logging layer)
    // ==========================================
    async function createRecord(path, data) {
      const ref = window.firebaseDatabase.ref(path).push();
      await ref.set(data);
      invalidateAdminCache(path);
      return ref.key;
    }
    async function updateRecord(path, updates) {
      await window.firebaseDatabase.ref(path).update(updates);
      invalidateAdminCache(path.split('/').slice(0, -1).join('/'));
    }
    async function deleteRecord(path) {
      await window.firebaseDatabase.ref(path).remove();
      invalidateAdminCache(path.split('/').slice(0, -1).join('/'));
    }

    // ==========================================
    // Athlete status (computed locally — see note at bottom of file
    // about the grade/grad_year field mismatch in firebase-helpers.js)
    // ==========================================
    function computeAthleteStatus(row) {
      const gradYear = parseInt(row.grade, 10);
      if (isNaN(gradYear)) return { label: 'Unknown', cls: 'badge-muted' };
      const now = new Date();
      const academicYear = now.getMonth() >= 7 ? now.getFullYear() + 1 : now.getFullYear();
      if (gradYear < academicYear) return { label: 'Graduated', cls: 'badge-muted' };
      if (gradYear === academicYear) return { label: 'Senior', cls: 'badge-warning' };
      const yearsOut = gradYear - academicYear;
      const label = ['Senior', 'Junior', 'Sophomore', 'Freshman'][yearsOut - 1] || 'Active';
      return { label, cls: 'badge-success' };
    }
    function renderAthleteStatusBadge(row) {
      const s = computeAthleteStatus(row);
      return `<span class="badge ${s.cls}">${s.label}</span>`;
    }

    // ==========================================
    // Navigation
    // ==========================================
    let currentSection = 'dashboard';

    function setActiveNav(section) {
      document.querySelectorAll('.nav-btn[data-section]').forEach(b => {
        b.classList.toggle('active', b.dataset.section === section);
      });
    }

    ['main-nav', 'tools-nav'].forEach(id => {
      document.getElementById(id).addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-section]');
        if (!btn) return;
        setActiveNav(btn.dataset.section);
        loadSection(btn.dataset.section);
        closeMobileMenu();
      });
    });

    const mobileBtn = document.getElementById('mobile-menu-btn');
    const mobileOverlay = document.getElementById('mobile-menu-overlay');
    mobileBtn.addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('mobile-open');
      mobileOverlay.classList.add('active');
    });
    mobileOverlay.addEventListener('click', closeMobileMenu);
    function closeMobileMenu() {
      document.getElementById('sidebar').classList.remove('mobile-open');
      mobileOverlay.classList.remove('active');
    }

    const SECTION_TITLES = {
      dashboard: 'Dashboard',
      meets: 'Meets',
      schools: 'Schools',
      athletes: 'Athletes',
      results: 'Results',
      'manual-entry': 'Manual Result Entry',
      seasons: 'Season Management',
      'email-tools': 'Email Tools'
    };

    async function loadSection(section) {
      currentSection = section;
      document.getElementById('page-title').textContent = SECTION_TITLES[section] || section;
      document.getElementById('content').innerHTML = `<div class="empty-state">Loading ${SECTION_TITLES[section] || section}…</div>`;
      try {
        switch (section) {
          case 'dashboard': await renderDashboard(); break;
          case 'meets': await renderMeets(); break;
          case 'schools': await renderSchools(); break;
          case 'athletes': await renderAthletes(); break;
          case 'results': await renderResults(); break;
          case 'manual-entry': await renderManualEntry(); break;
          case 'seasons': await renderSeasons(); break;
          case 'email-tools': await renderEmailTools(); break;
          default: await renderDashboard();
        }
      } catch (err) {
        console.error('Error loading section:', err);
        document.getElementById('content').innerHTML =
          `<div class="empty-state" style="color: var(--danger);">Error loading section: ${escapeHtml(err.message)}</div>`;
      }
    }

    // ==========================================
    // Generic Grid Engine (used by Meets / Schools / Athletes / Results)
    // ==========================================
    let grid = {};
    let editingId = null;

    function renderGridSection(cfg) {
      grid = Object.assign({ idKey: 'id', sortCol: null, sortDir: 'asc', searchTerm: '', page: 0, pageSize: GRID_PAGE_DEFAULT, selectedIds: new Set() }, cfg);
      grid.data = grid.data || [];
      grid.searchIndex = new Map(grid.data.map(row => [String(row[grid.idKey]), buildGridSearchText(row)]));
      grid.filtered = grid.data.slice();
      paintGrid();
    }

    function normalizeSearchText(value) {
      return String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function buildGridSearchText(row) {
      return normalizeSearchText(grid.columns.map(column => {
        const value = typeof column.searchValue === 'function' ? column.searchValue(row) : row[column.key];
        return Array.isArray(value) ? value.join(' ') : String(value ?? '');
      }).concat(Object.values(row).filter(value => ['string', 'number'].includes(typeof value)).map(String)).join(' '));
    }

    function gridSearchMatches(text, token) {
      if (text.includes(token)) return true;
      if (token.length < 5) return false;
      const words = text.split(/\s+/).filter(Boolean);
      return words.some(word => {
        if (Math.abs(word.length - token.length) > 1) return false;
        let i = 0, j = 0, edits = 0;
        while (i < word.length && j < token.length) {
          if (word[i] === token[j]) { i++; j++; continue; }
          if (++edits > 1) return false;
          if (word.length > token.length) i++;
          else if (token.length > word.length) j++;
          else if (word[i] === token[j + 1]) j++;
          else if (word[i + 1] === token[j]) i++;
          else { i++; j++; }
        }
        return edits + (i < word.length || j < token.length ? 1 : 0) <= 2;
      });
    }

    function rankGridRow(row, rawQuery) {
      const tokens = normalizeSearchText(rawQuery).trim().split(/\s+/).filter(Boolean);
      if (!tokens.length) return 0;
      const searchText = buildGridSearchText(row);
      let score = 0;
      for (const token of tokens) {
        const colon = token.indexOf(':');
        const field = colon > 0 ? token.slice(0, colon) : '';
        const value = colon > 0 ? token.slice(colon + 1) : token;
        const column = field && grid.columns.find(c => normalizeSearchText(c.key) === field || normalizeSearchText(c.label) === field || normalizeSearchText(c.key).startsWith(`${field}_`));
        if (field && !column) return -1;
        const values = column ? normalizeSearchText(typeof column.searchValue === 'function' ? column.searchValue(row) : row[column.key]) : searchText;
        if (!value || !gridSearchMatches(values, value)) return -1;
        score += values === value ? 100 : values.startsWith(value) ? 20 : values.includes(value) ? 10 : 1;
      }
      return score;
    }

    function paintGrid() {
      const pageCount = Math.max(1, Math.ceil(grid.filtered.length / grid.pageSize));
      grid.page = Math.min(grid.page, pageCount - 1);
      const pageRows = grid.filtered.slice(grid.page * grid.pageSize, (grid.page + 1) * grid.pageSize);
      const visibleIds = pageRows.map(row => String(row[grid.idKey]));
      const selectedOnPage = visibleIds.filter(id => grid.selectedIds.has(id)).length;
      const html = `
        <div class="grid-container">
          <div class="grid-header">
            <div><div class="admin-kicker">${escapeHtml(grid.title)} workspace</div><h3 id="grid-title-count">${grid.filtered.length.toLocaleString()} records</h3></div>
            <div class="grid-actions">
              ${grid.extraFiltersHTML || ''}
              <input type="search" id="grid-search" aria-label="Search ${escapeAttr(grid.title)}" placeholder="⌕  Search everything…  ( / or Ctrl+K )" value="${escapeAttr(grid.searchTerm || '')}" autocomplete="off" spellcheck="false">
              <span id="search-status" class="loading-indicator" role="status" aria-label="Searching" hidden></span>
              <button class="btn btn-primary" onclick="openGridAddModal()">+ Add</button>
              <button class="btn btn-secondary" onclick="exportGridCSV()">↓ Export CSV</button>
              <button class="btn btn-secondary" onclick="exportGridPDF()">↧ Export PDF</button>
              <span class="search-hint">Search across all columns · use school:field or gender:F · double-click any cell to edit</span>
            </div>
          </div>
          <div class="bulk-toolbar" id="bulk-toolbar" style="padding:0 16px;${grid.selectedIds.size ? '' : 'display:none;'}">
            <span id="selected-count">${grid.selectedIds.size} selected</span>
            <button class="btn btn-secondary btn-small" onclick="exportGridCSV(true)">Export selected</button>
            <button class="btn btn-secondary btn-small" onclick="exportGridPDF(true)">Export selected PDF</button>
            <button class="btn btn-danger btn-small" onclick="deleteSelectedGridRows()">Delete selected</button>
            <button class="btn btn-secondary btn-small" onclick="clearGridSelection()">Clear selection</button>
          </div>
          <div class="grid-scroll">
            <table class="grid-table">
              <thead><tr>
                <th class="row-check"><input type="checkbox" aria-label="Select visible rows" ${visibleIds.length && selectedOnPage === visibleIds.length ? 'checked' : ''} onchange="toggleVisibleGridRows(this.checked)"></th>
                ${grid.columns.map(c => `<th tabindex="0" onclick="sortGrid('${escapeAttr(c.key)}')" onkeydown="if(event.key==='Enter')sortGrid('${escapeAttr(c.key)}')" aria-sort="${grid.sortCol === c.key ? (grid.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}">${escapeHtml(c.label)}<span class="sort-mark" id="sort-ind-${escapeAttr(c.key)}">${grid.sortCol === c.key ? (grid.sortDir === 'asc' ? ' ↑' : ' ↓') : ''}</span></th>`).join('')}
                <th style="width:132px;cursor:default;">Actions</th>
              </tr></thead>
              <tbody id="grid-body">${renderGridBody(pageRows)}</tbody>
            </table>
          </div>
          <div class="grid-footer">
            <span>Showing ${grid.filtered.length ? (grid.page * grid.pageSize + 1).toLocaleString() : 0}–${Math.min((grid.page + 1) * grid.pageSize, grid.filtered.length).toLocaleString()} of ${grid.filtered.length.toLocaleString()}</span>
            <div class="grid-footer-controls">
              <label for="grid-page-size">Rows</label><select id="grid-page-size" class="form-input" aria-label="Rows per page">
                ${[50, 100, 250, 500].map(n => `<option value="${n}" ${grid.pageSize === n ? 'selected' : ''}>${n}</option>`).join('')}
              </select>
              <button class="btn btn-secondary btn-small" onclick="changeGridPage(-1)" ${grid.page === 0 ? 'disabled' : ''} aria-label="Previous page">←</button>
              <span>Page ${grid.page + 1} / ${pageCount}</span>
              <button class="btn btn-secondary btn-small" onclick="changeGridPage(1)" ${grid.page >= pageCount - 1 ? 'disabled' : ''} aria-label="Next page">→</button>
            </div>
          </div>
        </div>`;
      document.getElementById('content').innerHTML = html;
      const searchInput = document.getElementById('grid-search');
      searchInput?.addEventListener('input', (event) => {
        grid.searchTerm = event.target.value;
        clearTimeout(grid.searchTimer);
        const spinner = document.getElementById('search-status');
        if (spinner) spinner.hidden = !grid.searchTerm;
        grid.searchTimer = setTimeout(() => {
          applyGridFilter();
          if (spinner) spinner.hidden = true;
        }, 90);
      });
      document.getElementById('grid-page-size')?.addEventListener('change', event => {
        grid.pageSize = Number(event.target.value) || GRID_PAGE_DEFAULT;
        grid.page = 0;
        paintGrid();
      });
      document.getElementById('grid-body')?.addEventListener('dblclick', handleGridCellDoubleClick);
      document.getElementById('grid-body')?.addEventListener('keydown', handleGridCellKeydown);
      document.getElementById('grid-body')?.addEventListener('change', handleGridSelectionChange);
      if (grid.bindExtra) grid.bindExtra();
      updateRecordCount(grid.filtered.length);
    }

    function renderGridBody(rows = grid.filtered.slice(grid.page * grid.pageSize, (grid.page + 1) * grid.pageSize)) {
      if (!rows.length) return `<tr><td colspan="${grid.columns.length + 2}" class="empty-state">No records found. Try a different search or filter.</td></tr>`;
      return rows.map(row => {
        const id = String(row[grid.idKey]);
        return `<tr data-row-id="${escapeAttr(id)}">
          <td class="row-check"><input type="checkbox" data-select-id="${escapeAttr(id)}" aria-label="Select row" ${grid.selectedIds.has(id) ? 'checked' : ''}></td>
          ${grid.columns.map(column => {
            const raw = row[column.key];
            const value = column.render ? column.render(row) : formatCell(raw);
            const editable = column.editable !== false && !['textarea', 'multiselect'].includes(column.type) && !column.formExclude;
            return `<td data-cell-id="${escapeAttr(id)}" data-cell-key="${escapeAttr(column.key)}" data-editable="${editable ? 'true' : 'false'}" title="${editable ? 'Double-click to edit · press Enter to edit' : ''}">${value}</td>`;
          }).join('')}
          <td><button class="btn btn-secondary btn-small" onclick="openGridEditModal('${escapeAttr(id)}')" aria-label="Edit row">Edit</button> <button class="btn btn-danger btn-small" onclick="confirmGridDelete('${escapeAttr(id)}')" aria-label="Delete row">Delete</button></td>
        </tr>`;
      }).join('');
    }

    function refreshGridBody() {
      const body = document.getElementById('grid-body');
      if (body) body.innerHTML = renderGridBody();
      const heading = document.querySelector('#grid-title-count');
      if (heading) heading.textContent = `${grid.filtered.length.toLocaleString()} records`;
      updateRecordCount(grid.filtered.length);
      const range = document.querySelector('.grid-footer > span');
      if (range) range.textContent = `Showing ${grid.filtered.length ? (grid.page * grid.pageSize + 1).toLocaleString() : 0}–${Math.min((grid.page + 1) * grid.pageSize, grid.filtered.length).toLocaleString()} of ${grid.filtered.length.toLocaleString()}`;
      const pager = document.querySelector('.grid-footer-controls');
      if (pager) pager.innerHTML = `<label for="grid-page-size">Rows</label><select id="grid-page-size" class="form-input" aria-label="Rows per page">${[50, 100, 250, 500].map(n => `<option value="${n}" ${grid.pageSize === n ? 'selected' : ''}>${n}</option>`).join('')}</select><button class="btn btn-secondary btn-small" onclick="changeGridPage(-1)" ${grid.page === 0 ? 'disabled' : ''} aria-label="Previous page">←</button><span>Page ${grid.page + 1} / ${Math.max(1, Math.ceil(grid.filtered.length / grid.pageSize))}</span><button class="btn btn-secondary btn-small" onclick="changeGridPage(1)" ${grid.page >= Math.ceil(grid.filtered.length / grid.pageSize) - 1 ? 'disabled' : ''} aria-label="Next page">→</button>`;
      document.getElementById('grid-page-size')?.addEventListener('change', event => { grid.pageSize = Number(event.target.value) || GRID_PAGE_DEFAULT; grid.page = 0; paintGrid(); });
      updateBulkToolbar();
    }

    function applyGridFilter() {
      const matches = grid.data.filter(row => !grid.customFilter || grid.customFilter(row))
        .map((row, order) => ({ row, order, score: rankGridRow(row, grid.searchTerm) }))
        .filter(item => item.score >= 0);
      if (grid.searchTerm.trim()) matches.sort((a, b) => b.score - a.score || a.order - b.order);
      grid.searchIndex = new Map(grid.data.map(row => [String(row[grid.idKey]), buildGridSearchText(row)]));
      grid.filtered = matches.map(item => item.row);
      grid.page = 0;
      refreshGridBody();
    }

    function sortGrid(col) {
      if (grid.sortCol === col) grid.sortDir = grid.sortDir === 'asc' ? 'desc' : 'asc';
      else { grid.sortCol = col; grid.sortDir = 'asc'; }
      grid.data.sort((a, b) => {
        let av = a[col], bv = b[col];
        if (Array.isArray(av)) av = av.length;
        if (Array.isArray(bv)) bv = bv.length;
        av = av ?? ''; bv = bv ?? '';
        const an = parseFloat(av), bn = parseFloat(bv);
        const cmp = !isNaN(an) && !isNaN(bn) && String(av).trim() && String(bv).trim() ? an - bn : String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' });
        return grid.sortDir === 'asc' ? cmp : -cmp;
      });
      grid.filtered = grid.data.filter(row => (!grid.customFilter || grid.customFilter(row)) && rankGridRow(row, grid.searchTerm) >= 0);
      grid.page = 0;
      paintGrid();
    }

    function changeGridPage(delta) {
      grid.page = Math.max(0, Math.min(grid.page + delta, Math.ceil(grid.filtered.length / grid.pageSize) - 1));
      paintGrid();
    }

    function handleGridSelectionChange(event) {
      const checkbox = event.target.closest('[data-select-id]');
      if (!checkbox) return;
      const id = checkbox.dataset.selectId;
      if (checkbox.checked) grid.selectedIds.add(id); else grid.selectedIds.delete(id);
      updateBulkToolbar();
    }

    function updateBulkToolbar() {
      const toolbar = document.getElementById('bulk-toolbar');
      if (!toolbar) return;
      toolbar.style.display = grid.selectedIds.size ? 'flex' : 'none';
      const count = document.getElementById('selected-count');
      if (count) count.textContent = `${grid.selectedIds.size} selected`;
    }

    function toggleVisibleGridRows(checked) {
      const rows = grid.filtered.slice(grid.page * grid.pageSize, (grid.page + 1) * grid.pageSize);
      rows.forEach(row => { const id = String(row[grid.idKey]); if (checked) grid.selectedIds.add(id); else grid.selectedIds.delete(id); });

    async function deleteSelectedGridRows() {
      const ids = Array.from(grid.selectedIds);
      if (!ids.length || !confirm(`Permanently delete ${ids.length} selected ${singularize(grid.title).toLowerCase()} record(s)? This cannot be undone.`)) return;

        showAdminToast(`Deleted ${ids.length} records.`);

    function handleGridCellDoubleClick(event) {
      const cell = event.target.closest('td[data-editable="true"]');
      if (cell) beginGridCellEdit(cell);
    }

    function handleGridCellKeydown(event) {
      const cell = event.target.closest('td[data-editable="true"]');
      if (cell && (event.key === 'Enter' || event.key === 'F2')) { event.preventDefault(); beginGridCellEdit(cell); }
    }

    function beginGridCellEdit(cell) {
      if (!cell || cell.dataset.editing === 'true') return;
      const row = grid.data.find(item => String(item[grid.idKey]) === cell.dataset.cellId);
      const column = grid.columns.find(item => item.key === cell.dataset.cellKey);
      if (!row || !column || column.type === 'checkbox') return;
      const initial = row[column.key] ?? '';
      let editor;
      if (column.type === 'select') {
        editor = document.createElement('select');
        const choices = typeof column.options === 'function' ? column.options() : (column.options || []);
        editor.innerHTML = `<option value="">—</option>${choices.map(option => `<option value="${escapeAttr(option.value)}">${escapeHtml(option.label)}</option>`).join('')}`;
        editor.value = String(initial);
      } else {
        editor = document.createElement('input');
        editor.type = column.type === 'number' ? 'number' : (column.inputType === 'date' ? 'date' : 'text');
        if (editor.type === 'number') editor.step = 'any';
        editor.value = column.key === 'time' && initial !== '' ? formatSecondsToTime(Number(initial)) : String(initial);
      }
      editor.className = 'cell-editor';
      editor.setAttribute('aria-label', `Edit ${column.label}`);
      const originalHtml = cell.innerHTML;
      cell.dataset.editing = 'true';
      cell.replaceChildren(editor);
      let finished = false;
      const finish = async (save) => {
        if (finished) return;
        finished = true;
        if (!save) { cell.innerHTML = originalHtml; delete cell.dataset.editing; return; }
        const raw = editor.value.trim();
        let value = raw;
        try {
          if (raw === '') value = null;
          if (column.transform && raw !== '') value = column.transform(raw, row);
          else if (column.type === 'number' && raw !== '') value = Number(raw);
          if (value === undefined || (typeof value === 'number' && !Number.isFinite(value))) throw new Error('Enter a valid value.');
          const patch = value === null ? { [column.key]: null } : { [column.key]: value };
          if (column.key === 'name' && grid.title === 'Meets' && !row.slug) patch.slug = slugify(raw);
          await grid.onUpdate(row[grid.idKey], patch);
          Object.assign(row, patch);
          grid.searchIndex.set(String(row[grid.idKey]), buildGridSearchText(row));
          cell.removeAttribute('data-editing');
          showAdminToast(`${column.label} saved.`);
          applyGridFilter();
        } catch (error) {
          console.error('Inline edit failed', error);
          cell.innerHTML = originalHtml;
          delete cell.dataset.editing;
          showAdminToast(`Could not save: ${error.message}`, 'error');
        }
      };
      editor.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); event.stopPropagation(); editor.blur(); }
        if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); finish(false); }
        if (event.key === 'Tab') { event.preventDefault(); editor.blur(); }
      });
      editor.addEventListener('blur', () => finish(true));
      if (editor.tagName === 'SELECT') editor.addEventListener('change', () => editor.blur());
      editor.focus();
      if (editor.select && editor.type !== 'date') editor.select();
    }

    function exportGridCSV(selectedOnly = false) {
      const records = selectedOnly ? grid.filtered.filter(row => grid.selectedIds.has(String(row[grid.idKey]))) : grid.filtered;
      const csvCell = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
      const headers = grid.columns.map(column => csvCell(column.label)).join(',');
      const rows = records.map(row => grid.columns.map(column => csvCell(Array.isArray(row[column.key]) ? row[column.key].join('; ') : row[column.key])).join(','));
      const blob = new Blob(['\uFEFF', headers, '\r\n', rows.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `${grid.title.toLowerCase().replace(/\s+/g, '-')}-${selectedOnly ? 'selected-' : ''}${new Date().toISOString().slice(0, 10)}.csv`;
      anchor.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // PDF export of the current grid view (respects search + extra filters, or
    // just the selected rows). Uses the shared MSM PDF branding so admin exports
    // match the public meet/rankings PDFs.
    function htmlToPlainText(html) {
      try {
        const parsed = new DOMParser().parseFromString(String(html), 'text/html');
        return (parsed.body.textContent || '').replace(/\s+/g, ' ').trim();
      } catch (e) {
        return String(html).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      }
    }

    function gridCellExportText(column, row) {
      if (column.key === 'qualification') {
        const q = row.qualification || {};
        const on = q.enabled === true || q.enabled === 'true' || q.enabled === 1;
        if (!on) return 'Not set';
        const target = q.target_name || (meetsCache.find(m => m.slug === q.target_slug) || {}).name || q.target_slug || 'State';
        return `→ ${target} · ${q.team_spots ?? 3} teams / ${q.individual_spots ?? 5} individuals / ${q.wildcard_spots || 0} wildcards`;
      }
      if (column.render) {
        const text = htmlToPlainText(column.render(row));
        return text || '—';
      }
      const raw = row[column.key];
      if (Array.isArray(raw)) return raw.length ? raw.join('; ') : '—';
      if (raw === true) return 'Yes';
      if (raw === false) return '—';
      if (raw === null || raw === undefined || raw === '') return '—';
      return String(raw);
    }

    async function exportGridPDF(selectedOnly = false) {
      if (!selectedOnly) selectedOnly = false;
      const records = selectedOnly
        ? grid.filtered.filter(row => grid.selectedIds.has(String(row[grid.idKey])))
        : grid.filtered;
      if (!records.length) {
        showAdminToast('Nothing to export yet — adjust the search or filters.', 'error');
        return;
      }
      if (typeof MSMPdf === 'undefined') {
        showAdminToast('PDF library is still loading. Try again in a second.', 'error');
        return;
      }
      try {
        const jsPDF = await MSMPdf.ready();
        const doc = new jsPDF({ orientation: 'landscape' });
        const subtitleBits = [`${records.length.toLocaleString()} ${singularize(grid.title).toLowerCase()} record${records.length === 1 ? '' : 's'}`];
        if (selectedOnly) subtitleBits.push('selected rows');
        if (grid.searchTerm.trim()) subtitleBits.push(`search “${grid.searchTerm.trim()}”`);
        if (grid.filterMeet) subtitleBits.push(`meet: ${grid.filterMeet}`);
        if (grid.filterSchool) subtitleBits.push(`school: ${grid.filterSchool}`);
        subtitleBits.push(new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }));

        const drawHeader = await MSMPdf.brandHeader(doc, {
          title: `${grid.title} — Mountain State Miles`,
          subtitle: subtitleBits.join(' · ')
        });

        const head = [['#', ...grid.columns.map(column => column.label)]];
        const body = records.map((row, index) => [
          index + 1,
          ...grid.columns.map(column => gridCellExportText(column, row))
        ]);
        const base = MSMPdf.tableStyles();
        doc.autoTable({
          head,
          body,
          startY: 30,
          margin: { top: 30 },
          styles: { ...base.styles, fontSize: 7, cellPadding: 1.4, overflow: 'linebreak', valign: 'top' },
          headStyles: base.headStyles,
          alternateRowStyles: base.alternateRowStyles,
          didDrawPage: drawHeader
        });

        MSMPdf.finalize(doc);
        doc.save(`${slugify(grid.title)}-${selectedOnly ? 'selected-' : ''}${new Date().toISOString().slice(0, 10)}.pdf`);
        showAdminToast(`PDF exported (${records.length.toLocaleString()} row${records.length === 1 ? '' : 's'}).`);
      } catch (error) {
        console.error('PDF export failed', error);
        showAdminToast(`Could not build the PDF: ${error.message}`, 'error');
      }
    }

    function singularize(title) {
      if (title.endsWith('ies')) return title.slice(0, -3) + 'y';
      if (title.endsWith('s')) return title.slice(0, -1);
      return title;
    }

    function generateGridFormHTML(record) {
      return grid.columns.filter(c => !c.formExclude).map(c => {
        const raw = record[c.key];

        if (c.type === 'select') {
          const opts = typeof c.options === 'function' ? c.options() : (c.options || []);
          return `<div class="form-group"><label class="form-label">${escapeHtml(c.label)}</label>
            <select class="form-input" data-field="${c.key}">
              <option value="">-- Select --</option>
              ${opts.map(o => `<option value="${escapeAttr(o.value)}" ${String(raw ?? '') === String(o.value) ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}
            </select></div>`;
        }

        if (c.type === 'multiselect') {
          const opts = typeof c.options === 'function' ? c.options() : (c.options || []);
          const selected = Array.isArray(raw) ? raw : [];
          return `<div class="form-group"><label class="form-label">${escapeHtml(c.label)}</label>
            <div class="checkbox-grid" data-multiselect="${c.key}">
              ${opts.map(o => `<label class="chk"><input type="checkbox" value="${escapeAttr(o.value)}" ${selected.includes(o.value) ? 'checked' : ''}> ${escapeHtml(o.label)}</label>`).join('')}
            </div>
            ${c.hint ? `<p class="muted" style="font-size:0.78rem;margin:4px 0 0;">${escapeHtml(c.hint)}</p>` : ''}
          </div>`;
        }

        if (c.type === 'checkbox') {
          const checked = raw === true || raw === 'true' || raw === 'yes' || raw === 1;
          return `<div class="form-group">
            <label class="chk"><input type="checkbox" data-field="${c.key}" data-boolean="1" ${checked ? 'checked' : ''}> ${escapeHtml(c.label)}</label>
            ${c.hint ? `<p class="muted" style="font-size:0.78rem;margin:4px 0 0;">${escapeHtml(c.hint)}</p>` : ''}
          </div>`;
        }

        if (c.type === 'textarea') {
          return `<div class="form-group"><label class="form-label">${escapeHtml(c.label)}</label>
            <textarea class="form-input" data-field="${c.key}" rows="3" placeholder="${escapeAttr(c.placeholder || c.label)}">${escapeHtml(raw ?? '')}</textarea></div>`;
        }

        if (c.type === 'datalist') {
          const opts = typeof c.options === 'function' ? c.options() : (c.options || []);
          return `<div class="form-group"><label class="form-label">${escapeHtml(c.label)}</label>
            <input class="form-input" list="dl-${c.key}" data-field="${c.key}" value="${escapeAttr(raw ?? '')}" placeholder="${escapeAttr(c.placeholder || c.label)}">
            <datalist id="dl-${c.key}">${opts.map(o => `<option value="${escapeAttr(o.value)}">${escapeHtml(o.label)}</option>`).join('')}</datalist>
          </div>`;
        }

        const inputType = c.type === 'number' ? 'number' : (c.inputType || 'text');
        return `<div class="form-group"><label class="form-label">${escapeHtml(c.label)}</label>
          <input type="${inputType}" class="form-input" data-field="${c.key}" value="${escapeAttr(raw ?? '')}" placeholder="${escapeAttr(c.placeholder || c.label)}">
        </div>`;
      }).join('');
    }

    function openModal(title, body, submitText = 'Save') {
      const template = document.getElementById('modal-template');
      const clone = template.content.cloneNode(true);
      clone.querySelector('#modal-title').textContent = title;
      clone.querySelector('#modal-body').innerHTML = body;
      clone.querySelector('#modal-submit').textContent = submitText;
      const overlay = clone.querySelector('.modal-overlay');
      document.body.appendChild(overlay);
      window.currentModal = overlay;
    }

    function closeModal() {
      if (window.currentModal) {
        window.currentModal.remove();
        window.currentModal = null;
      }
    }

    async function handleGridModalSubmit() {
      const modal = window.currentModal;
      if (!modal) return;

      const formData = {};
      modal.querySelectorAll('[data-field]').forEach(el => { formData[el.dataset.field] = el.value; });
      modal.querySelectorAll('[data-boolean]').forEach(el => { formData[el.dataset.field] = el.checked; });
      modal.querySelectorAll('[data-multiselect]').forEach(div => {
        const key = div.dataset.multiselect;
        formData[key] = Array.from(div.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
      });

      // Strip empty/unset values
      Object.keys(formData).forEach(k => {
        if (formData[k] === '') delete formData[k];
        if (formData[k] === false) delete formData[k];
        if (Array.isArray(formData[k]) && formData[k].length === 0) delete formData[k];
      });

      // Column-level transforms (string -> number, time parsing, etc.)
      grid.columns.forEach(c => {
        if (c.transform && formData[c.key] !== undefined) {
          const val = c.transform(formData[c.key], formData);
          if (val === undefined || (typeof val === 'number' && isNaN(val))) delete formData[c.key];
          else formData[c.key] = val;
        }
      });

      if (grid.validate) {
        const err = grid.validate(formData);
        if (err) { alert(err); return; }
      }

      try {
        if (editingId) await grid.onUpdate(editingId, formData);
        else await grid.onCreate(formData);
        closeModal();
        await loadSection(currentSection);
      } catch (e) {
        console.error(e);
        alert('Error: ' + e.message);
      }
    }

    function renderResultsTrendChart(points) {
      if (!points.some(point => point.value)) return '<div class="chart-empty">No dated results to chart yet.</div>';
      const width = 560, height = 190, left = 36, right = 12, top = 14, bottom = 28;
      const max = Math.max(1, ...points.map(point => point.value));
      const step = (width - left - right) / (points.length - 1);
      const coords = points.map((point, index) => ({ x: left + index * step, y: height - bottom - point.value / max * (height - top - bottom), ...point }));
      const line = coords.map(point => `${point.x},${point.y}`).join(' ');
      const area = `${left},${height-bottom} ${line} ${coords.at(-1).x},${height-bottom}`;
      return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Results over time line chart"><defs><linearGradient id="admin-chart-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff7b2d" stop-opacity=".35"/><stop offset="1" stop-color="#ff7b2d" stop-opacity="0"/></linearGradient></defs>${[0,.5,1].map(ratio => { const y=top+ratio*(height-top-bottom); return `<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="rgba(159,180,200,.18)"/><text x="${left-7}" y="${y+4}" fill="#9fb4c8" font-size="10" text-anchor="end">${Math.round(max*(1-ratio))}</text>`; }).join('')}<polygon points="${area}" fill="url(#admin-chart-fill)"/><polyline points="${line}" fill="none" stroke="#ff7b2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${coords.map(point => `<circle cx="${point.x}" cy="${point.y}" r="3.4" fill="#ff9a4f"><title>${point.label}: ${point.value} results</title></circle>`).join('')}${coords.filter((_,i)=>i%2===0||i===coords.length-1).map(point=>`<text x="${point.x}" y="${height-7}" fill="#9fb4c8" font-size="10" text-anchor="middle">${point.label}</text>`).join('')}</svg>`;
    }

    function renderGenderDonut(counts) {
      const total = counts.M + counts.F + counts.Other;
      if (!total) return '<div class="chart-empty">No result gender data to chart yet.</div>';
      const male = counts.M / total * 100, female = counts.F / total * 100;
      return `<div class="donut-wrap"><div class="donut-chart" style="background:conic-gradient(#38bdf8 0% ${male}%,#ff7b2d ${male}% ${male+female}%,#64748b ${male+female}% 100%)" role="img" aria-label="${counts.M} boys, ${counts.F} girls and ${counts.Other} other results"><div class="donut-total">${total.toLocaleString()}<small>results</small></div></div><div class="chart-legend"><span><i class="legend-dot" style="background:#38bdf8"></i>Boys ${counts.M.toLocaleString()}</span><span><i class="legend-dot" style="background:#ff7b2d"></i>Girls ${counts.F.toLocaleString()}</span>${counts.Other ? `<span><i class="legend-dot" style="background:#64748b"></i>Other ${counts.Other}</span>` : ''}</div></div>`;

      return `<div class="bar-list" role="list">${items.map(item => `<div class="bar-item" role="listitem"><span title="${escapeAttr(item.label)}">${escapeHtml(item.label.length > 22 ? item.label.slice(0,21)+'…' : item.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, item.count/max*100)}%"></div></div><strong>${item.count.toLocaleString()}</strong></div>`).join('')}</div><p style="margin-top:14px">${totalGroups.toLocaleString()} total</p>`;
    }

    // ==========================================
    // State qualification rules (regionals → states)
    // ==========================================
    // Stored on the meet as meet.qualification. The public meet page reads the
    // same object through /assets/regional-qualifiers.js, so this editor is the
    // single place the rules are set.
    function stateMeetOptions(selectedSlug) {
      const isState = meet => meet.is_state_championship || /state/i.test(meet.name || '');
      const sorted = meetsCache.slice().sort((a, b) => {
        const stateA = isState(a) ? 0 : 1;
        const stateB = isState(b) ? 0 : 1;
        if (stateA !== stateB) return stateA - stateB;
        return String(b.date || '').localeCompare(String(a.date || ''));
      });
      return sorted.map(meet => {
        const date = meet.date
          ? new Date(meet.date + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
          : 'no date';
        const tag = isState(meet) ? ' · State' : '';
        return `<option value="${escapeAttr(meet.slug)}" ${selectedSlug === meet.slug ? 'selected' : ''}>${escapeHtml(meet.name || meet.slug)} (${escapeHtml(date)}${tag})</option>`;
      }).join('');
    }

    // A new regional usually feeds the next state meet. Prefer the closest
    // championship on or after the meet's date, then the closest one in time.
    function defaultQualificationTarget(meet) {
      const meetTime = Date.parse(meet && meet.date) || 0;
      const candidates = meetsCache.filter(m =>
        m.slug && m.slug !== (meet && meet.slug) && (m.is_state_championship || /state/i.test(m.name || ''))
      );
      if (!candidates.length) return '';
      const time = m => Date.parse(m.date) || 0;
      const upcoming = candidates.filter(m => time(m) >= meetTime).sort((a, b) => time(a) - time(b));
      if (upcoming.length) return upcoming[0].slug;
      return candidates.sort((a, b) => time(b) - time(a))[0].slug;
    }

    function qualificationFormHTML(meet, existing) {
      const q = existing || {};
      const defaults = (window.MSMQualifiers && window.MSMQualifiers.RAW_DEFAULTS) || { team_spots: 3, team_members: 7, individual_spots: 5, wildcard_spots: 0, race_scope: 'varsity' };
      const enabled = q.enabled === true || q.enabled === 'true' || q.enabled === 1;
      const fallbackState = defaultQualificationTarget(meet);
      const num = (value, fallback) => (value === undefined || value === null || value === '' ? fallback : value);
      const scope = q.race_scope === 'all' ? 'all' : 'varsity';
      return `
        <div class="qual-hero-note"><span aria-hidden="true">🏁</span><span>Set who advances from this meet to a championship. The meet page publishes these rules as a <strong>Road to States</strong> graphic, built from the meet's own results.</span></div>
        <div class="form-group">
          <label class="qual-check"><input type="checkbox" id="qual-enabled" ${enabled ? 'checked' : ''}> This meet is a regional qualifier</label>
          <p class="muted" style="font-size:.78rem;margin:0;">Turn this on for regional meets. Leave it off for invitationals, JV meets and the state meet itself.</p>
        </div>
        <div id="qual-fields" class="qual-fields${enabled ? '' : ' qual-fields-disabled'}">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Advancing to meet</label>
              <select class="form-input" id="qual-target">
                <option value="">— Not linked to a meet —</option>
                ${stateMeetOptions(q.target_slug || fallbackState)}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Label override (optional)</label>
              <input class="form-input" id="qual-target-name" value="${escapeAttr(q.target_name || '')}" placeholder="e.g. WV State Championship">
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Teams advancing per race</label>
              <input type="number" min="0" max="25" class="form-input" id="qual-team-spots" value="${escapeAttr(num(q.team_spots, defaults.team_spots))}">
            </div>
            <div class="form-group">
              <label class="form-label">Runners per advancing team</label>
              <input type="number" min="1" max="12" class="form-input" id="qual-team-members" value="${escapeAttr(num(q.team_members, defaults.team_members))}">
              <p class="muted" style="font-size:.78rem;margin:0;">Roster spots that travel with a qualifying team (usually 7).</p>
            </div>
            <div class="form-group">
              <label class="form-label">Additional individuals per race</label>
              <input type="number" min="0" max="60" class="form-input" id="qual-individual-spots" value="${escapeAttr(num(q.individual_spots, defaults.individual_spots))}">
              <p class="muted" style="font-size:.78rem;margin:0;">Best finishers not already going with a qualifying team.</p>
            </div>
            <div class="form-group">
              <label class="form-label">Wildcard spots per race</label>
              <input type="number" min="0" max="60" class="form-input" id="qual-wildcard-spots" value="${escapeAttr(num(q.wildcard_spots, defaults.wildcard_spots))}">
              <p class="muted" style="font-size:.78rem;margin:0;">Extra at-large spots, awarded by finish order after the individuals.</p>
            </div>
            <div class="form-group">
              <label class="form-label">Which races count</label>
              <select class="form-input" id="qual-race-scope">
                <option value="varsity" ${scope === 'varsity' ? 'selected' : ''}>Varsity races only</option>
                <option value="all" ${scope === 'all' ? 'selected' : ''}>Every race</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Public note (optional)</label>
              <input class="form-input" id="qual-note" value="${escapeAttr(q.note || '')}" placeholder="Shown under the qualifier graphic">
            </div>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 8px;">
            <button type="button" class="btn btn-secondary btn-small" id="qual-preview-btn">👀 Preview qualifiers</button>
            ${meet.slug ? `<a class="btn btn-secondary btn-small" href="meet.html?slug=${encodeURIComponent(meet.slug)}" target="_blank" rel="noopener">Open meet page ↗</a>` : ''}
            <span class="muted" style="font-size:.78rem;">Preview uses the meet's posted results and these unsaved rules.</span>
          </div>
          <div id="qual-preview" class="qual-preview" hidden></div>

    function toggleQualificationFields() {
      const enabled = !!document.getElementById('qual-enabled')?.checked;
      const fields = document.getElementById('qual-fields');
      if (!fields) return;
      fields.classList.toggle('qual-fields-disabled', !enabled);
      fields.querySelectorAll('input, select, button').forEach(el => { el.disabled = !enabled; });
    }

    function readQualificationForm() {
      const value = id => String(document.getElementById(id)?.value || '').trim();
      const number = (id, fallback) => {
        const n = parseInt(value(id), 10);
        return isNaN(n) ? fallback : n;
      };
      const defaults = (window.MSMQualifiers && window.MSMQualifiers.RAW_DEFAULTS) || { team_spots: 3, team_members: 7, individual_spots: 5, wildcard_spots: 0 };
      return {
        enabled: !!document.getElementById('qual-enabled')?.checked,
        target_slug: value('qual-target'),
        target_name: value('qual-target-name'),
        team_spots: number('qual-team-spots', defaults.team_spots),
        team_members: number('qual-team-members', defaults.team_members),
        individual_spots: number('qual-individual-spots', defaults.individual_spots),
        wildcard_spots: number('qual-wildcard-spots', defaults.wildcard_spots),
        race_scope: value('qual-race-scope') === 'all' ? 'all' : 'varsity',
        note: value('qual-note'),
        updated_at: new Date().toISOString(),
      };
    }

    function openQualificationModal(id) {
      const meet = meetsCache.find(m => String(m.id) === String(id));
      if (!meet) return;
      openModal(`State qualification — ${meet.name || meet.slug}`, qualificationFormHTML(meet, meet.qualification), 'Save rules');
      const submit = document.getElementById('modal-submit');
      if (submit) submit.onclick = () => saveQualificationRules(meet.id);
      const previewBtn = document.getElementById('qual-preview-btn');
      if (previewBtn) previewBtn.onclick = () => previewQualification(meet.id);
      const enabled = document.getElementById('qual-enabled');
      if (enabled) enabled.addEventListener('change', toggleQualificationFields);
      toggleQualificationFields();
    }

    async function saveQualificationRules(id) {
      const meet = meetsCache.find(m => String(m.id) === String(id));
      if (!meet) return;
      const rules = readQualificationForm();
      if (rules.enabled) {
        if (rules.team_spots + rules.individual_spots + rules.wildcard_spots <= 0) {
          alert('Set at least one way to advance: a team spot, an individual spot or a wildcard.');
          return;
        }
        if (rules.team_spots > 0 && rules.team_members < 5) {
          alert('A team needs at least five runners to post a score, so an advancing team must travel at least five.');
          return;
        }
      }
      try {
        await updateRecord(`crosscountry/meets/${id}`, { qualification: rules });
        closeModal();
        showAdminToast(rules.enabled ? 'Qualification rules saved.' : 'Qualification rules turned off.');
        await loadSection('meets');
      } catch (error) {
        console.error('Could not save qualification rules', error);
        alert('Could not save the rules: ' + error.message);
      }
    }

    async function previewQualification(id) {
      const meet = meetsCache.find(m => String(m.id) === String(id));
      const box = document.getElementById('qual-preview');
      if (!meet || !box || !window.MSMQualifiers) return;
      const formRules = readQualificationForm();
      const rules = window.MSMQualifiers.rulesFromMeet({ qualification: { ...formRules, enabled: true } });
      box.hidden = false;
      box.innerHTML = '<div class="qual-empty">Loading the meet\'s results…</div>';
      try {
        const [all, schools] = await Promise.all([
          fetchNodeAsArray('crosscountry/results'),
          fetchNodeAsArray('crosscountry/schools')
        ]);
        // Public imports often store only school_slug; meet.html resolves names
        // from the schools table, so do the same here or every team is "Unknown".
        const schoolNames = Object.fromEntries(schools.map(s => [s.slug, s.name]));
        const results = all
          .filter(r => r.meet_slug === meet.slug)
          .map(r => ({ ...r, school_name: r.school_name || r.school || schoolNames[r.school_slug] || r.school_slug }));
        if (!results.length) {
          box.innerHTML = `<div class="qual-empty">No results are posted for ${escapeHtml(meet.name || meet.slug)} yet, so there is nobody to qualify.</div>`;
          return;
        }
        const data = window.MSMQualifiers.computeQualifiers({ results, rules });
        if (!data.races.length) {
          box.innerHTML = '<div class="qual-empty">No races match this rule set. Try “Every race”, or check the meet\'s race labels.</div>';
          return;
        }
        const names = list => list.map(a => escapeHtml(a.name)).join(', ');
        box.innerHTML =
          `<div class="qual-stats"><span><b>${data.totals.athletes}</b> athletes</span><span><b>${data.totals.teams}</b> teams</span><span><b>${data.totals.races}</b> races</span></div>` +
          data.races.map(race => {
            const teams = race.teams.length
              ? race.teams.map(t => `<strong>${escapeHtml(t.school)}</strong>${t.score != null ? ` (${t.score})` : ''}`).join(', ')
              : '—';
            return `<div class="qual-preview-race">
              <div class="qual-preview-head"><strong>${race.gender === 'F' ? 'Girls' : 'Boys'} · ${escapeHtml(race.race)}</strong><span>${race.advanceCount} advancing</span></div>
              <div class="qual-preview-line"><span class="qual-preview-tag">Teams</span>${teams}</div>
              <div class="qual-preview-line"><span class="qual-preview-tag">Individuals</span>${race.individuals.length ? names(race.individuals) : '—'}</div>
              ${race.wildcards.length ? `<div class="qual-preview-line"><span class="qual-preview-tag">Wildcards</span>${names(race.wildcards)}</div>` : ''}
              ${race.bubble.length ? `<div class="qual-preview-line"><span class="qual-preview-tag">First out</span>${names(race.bubble)}</div>` : ''}
            </div>`;
          }).join('');
      } catch (error) {
        box.innerHTML = `<div class="qual-empty">Could not load results: ${escapeHtml(error.message)}</div>`;
      }
    }
