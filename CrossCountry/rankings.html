<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rankings – Mountain State Miles</title>
  <link rel="icon" type="image/png" href="assets/Favicon Generator/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/Favicon Generator/favicon.svg" />
  <link rel="shortcut icon" href="assets/Favicon Generator/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/Favicon Generator/apple-touch-icon.png" />
  <link rel="manifest" href="assets/Favicon Generator/site.webmanifest" />
  <link rel="stylesheet" href="/assets/main.css" />

  <script src="/assets/theme-toggle.js" defer></script>
  <script src="/assets/components.js" defer></script>

  <!-- Required for PDF Export (matches meet.html) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.1/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* --- Ranking-mode toggle --- */
    .rank-mode-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 8px;
      max-width: 420px;
    }
    .rank-mode-tab {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .rank-mode-tab.active {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }
    .rank-mode-note {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-tertiary);
      margin-bottom: 20px;
    }
    .rank-mode-note a { color: var(--xc-primary); font-weight: 600; }

    /* Score / prediction pill inside item-score column */
    .score-stack { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
    .score-rating { font-weight: 800; font-size: 1.15rem; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .score-predicted { font-size: 0.72rem; color: var(--text-tertiary); font-weight: 600; }

    .adj-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
      margin-left: 4px;
    }
    .adj-up   { background: rgba(34,197,94,0.15);  color: #16a34a; }
    .adj-down { background: rgba(239,68,68,0.15);  color: #dc2626; }

    .view-tabs {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 16px;
    }
    .view-tab {
      padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      background: var(--bg-secondary); color: var(--text-secondary);
      border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
    }
    .view-tab.active { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }

    .weather-status {
      text-align: center; font-size: 0.75rem; color: var(--text-tertiary); margin-bottom: 12px;
    }

    /* --- Filter Panel Redesign --- */
    #filter-control-panel {
        background: var(--bg-secondary, #f8fafc);
        border: 1px solid var(--border, #e2e8f0);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
    }
    .filter-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        align-items: end;
    }
    @media (min-width: 768px) {
        .filter-grid {
            grid-template-columns: repeat(4, 1fr);
        }
    }
    .filter-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .filter-item label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-secondary, #64748b);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .filter-item select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border, #cbd5e1);
        background-color: var(--bg-primary, #ffffff);
        color: var(--text-primary, #0f172a);
        font-size: 0.9rem;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
    }
    .filter-item select:focus {
        border-color: var(--xc-primary, #0284c7);
    }
    .gender-toggles {
        display: flex;
        background: var(--bg-primary, #ffffff);
        border: 1px solid var(--border, #cbd5e1);
        border-radius: 8px;
        overflow: hidden;
    }
    .gender-toggles button {
        flex: 1;
        padding: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        background: transparent;
        color: var(--text-secondary, #64748b);
        border: none;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .gender-toggles button.active {
        background: var(--xc-primary, #0284c7);
        color: #ffffff;
    }
    .export-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        justify-content: center;
        width: 100%;
    }
    .action-btn {
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.85rem;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .btn-csv { background: #10b981; color: #fff; }
    .btn-pdf { background: #ef4444; color: #fff; }
    .action-btn:hover { opacity: 0.9; }

  </style>
</head>
<body>

  <div id="global-header"></div>

  <main class="content-section">
    <div class="hero-section">
      <div class="hero-content">
        <img src="/assets/images/logo.svg" alt="Mountain State Miles Logo" class="hero-logo" />
        <h1 class="hero-title">State Rankings</h1>
        <p class="hero-subtitle">The fastest 50 times across Cross Country running in West Virginia.</p>
      </div>
    </div>

    <!-- Ranking Mode Toggle: Raw Time vs. MSM Rating -->
    <div class="rank-mode-tabs">
      <button id="mode-raw" class="rank-mode-tab active" onclick="setRankMode('raw')">Raw Time</button>
      <button id="mode-dynamic" class="rank-mode-tab" onclick="setRankMode('dynamic')">MSM Rating</button>
    </div>
    <div class="rank-mode-note" id="rank-mode-note">
      Fastest raw times, exactly as run. <a href="rankings-explained.html">How does MSM Rating work?</a>
    </div>

    <!-- View toggle: Individual vs. Team -->
    <div class="view-tabs">
      <button id="view-indiv" class="view-tab active" onclick="setViewMode('indiv')">Individual</button>
      <button id="view-teams" class="view-tab" onclick="setViewMode('teams')">Teams</button>
    </div>

    <!-- Redesigned Filter Control Panel -->
    <section id="filter-control-panel">
      <div class="filter-grid">

        <div class="filter-item">
            <label>Gender</label>
            <div class="gender-toggles">
                <button class="active" data-filter-type="gender" data-value="M" onclick="setFilter('gender', 'M', event)">Boys</button>
                <button data-filter-type="gender" data-value="F" onclick="setFilter('gender', 'F', event)">Girls</button>
            </div>
        </div>

        <div class="filter-item">
            <label>Season</label>
            <select id="season-filter" onchange="setFilter('season', this.value)"></select>
        </div>

        <div class="filter-item">
            <label>Meet Type</label>
            <select id="meet-type-filter" onchange="setFilter('meetType', this.value)">
                <option value="in_season">In-Season Only</option>
                <option value="out_of_season">Out-of-Season / Non-Comp</option>
                <option value="all">All Meets</option>
            </select>
        </div>

        <div class="filter-item">
            <label>Distance</label>
            <select id="distance-filter" onchange="setFilter('distance', this.value)">
                <option value="all">All Distances</option>
                <option value="5000">5K (5000m)</option>
                <option value="3200">3200m</option>
                <option value="3000">3K (3000m)</option>
                <option value="1600">1 Mile (1600m)</option>
                <option value="2000">2000m</option>
            </select>
        </div>

        <div class="filter-item">
            <label>Classification</label>
            <select id="classification-filter" onchange="setFilter('classification', this.value)">
                <option value="all">All Classes</option>
                <option value="AAAA">Class AAAA</option>
                <option value="AAA">Class AAA</option>
                <option value="AA">Class AA</option>
                <option value="A">Class A</option>
            </select>
        </div>

        <div class="filter-item">
            <label>Meet</label>
            <select id="meet-filter" onchange="setFilter('meet', this.value)">
                <option value="all">All Meets</option>
            </select>
        </div>

        <div class="filter-item">
            <label>Course</label>
            <select id="course-filter" onchange="setFilter('course', this.value)">
                <option value="all">All Courses</option>
            </select>
        </div>

        <div class="filter-item">
            <label>Display Count</label>
            <select id="limit-filter" onchange="setFilter('limit', this.value)">
                <option value="50">Top 50</option>
                <option value="100">Top 100</option>
                <option value="250">Top 250</option>
                <option value="500">Top 500</option>
                <option value="all">All</option>
            </select>
        </div>

      </div>

      <!-- Export Actions -->
      <div class="export-actions">
          <button onclick="exportCSV()" class="action-btn btn-csv">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
            Export CSV
          </button>
          <button onclick="exportPDF()" class="action-btn btn-pdf">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5.5 1.5v2a1 1 0 0 0 1 1h2l-3-3zM4.5 12a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-1zM4 10.5A1.5 1.5 0 0 1 5.5 9h1A1.5 1.5 0 0 1 8 10.5v3A1.5 1.5 0 0 1 6.5 15h-1A1.5 1.5 0 0 1 4 13.5v-3z"/></svg>
            Export PDF
          </button>
      </div>

    </section>

    <div class="weather-status" id="weather-status"></div>

    <!-- Male Rankings Container -->
    <section id="male-rankings" class="my-10">
      <h2 class="text-3xl font-semibold mb-6 text-xc-primary border-b-2 border-xc-primary pb-2">Boys Rankings</h2>
      <div id="male-results-box" class="results-box">
        <div class="loading-state text-center p-8 text-gray-500">Loading rankings...</div>
      </div>
    </section>

    <!-- Female Rankings Container -->
    <section id="female-rankings" class="my-10 hidden">
      <h2 class="text-3xl font-semibold mb-6 text-xc-primary border-b-2 border-xc-primary pb-2">Girls Rankings</h2>
      <div id="female-results-box" class="results-box">
        <div class="loading-state text-center p-8 text-gray-500">Loading rankings...</div>
      </div>
    </section>

    <section id="no-rankings-message" class="text-center my-10 hidden">
        <p class="text-xl text-red-500">No results found for the selected filters.</p>
    </section>

  </main>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-helpers.js"></script>
    <script src="/scripts/msm-rating.js"></script>

    <script>
      // Global variables
      let allResults = [];
      let schoolsMap = {};
      let meetsMap = {};
      let meetsData = {};
      let coursesData = {};
      let maleResults = [];
      let femaleResults = [];

      // Currently rendered data for export
      let activeExportData = [];

      // State
      let currentGender = 'M';
      let currentDistance = 'all';
      let currentMeetSlug = 'all';
      let currentCourseSlug = 'all';
      let currentSeason = new Date().getFullYear().toString();
      let currentMeetType = 'in_season';
      let currentLimit = 50;
      let coursesMap = {};

      let rankMode = 'raw';
      let viewMode = 'indiv';
      let currentClassification = 'all';

      // =========================================
      // WVSSAC CLASSIFICATION (AAAA / AAA / AA / A)
      // =========================================
      // Best-effort mapping of WV schools to their 2025-26 WVSSAC enrollment
      // classification, sourced from WVSSAC's public realignment release
      // (schools are classified the same way across sports; XC itself now
      // runs all four classes). Keys are matched against school names after
      // running BOTH sides through normalizeSchoolName() + lowercasing, so
      // "St. Albans High School", "st albans hs", and "St. Albans" all match
      // the same entry. If a school from your results isn't listed here it
      // will show up as "Unclassified" — just add it below.
      const WV_CLASSIFICATION = {
        // ---- Class AAAA ----
        'Wheeling Park': 'AAAA', 'Morgantown': 'AAAA', 'University': 'AAAA', 'Hedgesville': 'AAAA',
        'Martinsburg': 'AAAA', 'Spring Mills': 'AAAA', 'Jefferson': 'AAAA', 'Musselman': 'AAAA',
        'Washington': 'AAAA', 'George Washington': 'AAAA', 'Woodrow Wilson': 'AAAA', 'Cabell Midland': 'AAAA',
        'Huntington': 'AAAA', 'Hurricane': 'AAAA', 'Parkersburg': 'AAAA', 'Parkersburg South': 'AAAA',
        'Oak Hill': 'AAAA', 'Buckhannon-Upshur': 'AAAA', 'Preston': 'AAAA', 'Riverside': 'AAAA',

        // ---- Class AAA ----
        'Lewis County': 'AAA', 'Shady Spring': 'AAA', 'Greenbrier East': 'AAA', 'Princeton': 'AAA',
        'Herbert Hoover': 'AAA', 'Ripley': 'AAA', 'Nitro': 'AAA', 'North Marion': 'AAA',
        'John Marshall': 'AAA', 'Brooke': 'AAA', 'East Fairmont': 'AAA', 'Fairmont Senior': 'AAA',
        'Grafton': 'AAA', 'Elkins': 'AAA', 'Hampshire': 'AAA', 'Keyser': 'AAA',
        'Robert C. Byrd': 'AAA', 'Bridgeport': 'AAA', 'Point Pleasant': 'AAA', 'Winfield': 'AAA',
        'Lincoln County': 'AAA', 'Capital': 'AAA', 'St. Albans': 'AAA', 'South Charleston': 'AAA',
        'Spring Valley': 'AAA', 'Nicholas County': 'AAA', 'PikeView': 'AAA', 'Chapmanville Regional': 'AAA',

        // ---- Class AA ----
        'Oak Glen': 'AA', 'Williamstown': 'AA', 'Ravenswood': 'AA', 'Moorefield': 'AA',
        'Philip Barbour': 'AA', 'Braxton County': 'AA', 'South Harrison': 'AA', 'Doddridge County': 'AA',
        'Bluefield': 'AA', 'Mingo Central': 'AA', 'Westside': 'AA', 'Wyoming East': 'AA',
        'Liberty (Raleigh)': 'AA', 'Frankfort': 'AA', 'Midland Trail': 'AA', 'James Monroe': 'AA',
        'Buffalo': 'AA', 'Poca': 'AA', 'Roane County': 'AA', 'Clay County': 'AA',
        'Scott': 'AA', 'Logan': 'AA', 'Lincoln': 'AA', 'Sissonville': 'AA',
        'Independence': 'AA', 'Wayne': 'AA', 'Berkeley Springs': 'AA', 'Tyler Consolidated': 'AA',
        'Summers County': 'AA', 'River View': 'AA', 'Petersburg': 'AA', 'Weir': 'AA',

        // ---- Class A ----
        'Cameron': 'A', 'Madonna': 'A', 'Clay-Battelle': 'A', 'Valley': 'A',
        'Magnolia': 'A', 'East Hardy': 'A', 'Tucker County': 'A', 'Pendleton County': 'A',
        'Pocahontas County': 'A', 'Tygarts Valley': 'A', 'Montcalm': 'A', 'Mount View': 'A',
        'Greenbrier West': 'A', 'Meadow Bridge': 'A', 'Richwood': 'A', 'Webster County': 'A',
        'Man': 'A', 'Sherman': 'A', 'Tolsia': 'A', 'Tug Valley': 'A',
        'Van': 'A', 'Calhoun County': 'A', 'Gilmer County': 'A', 'Wahama': 'A',
        'Wirt County': 'A', 'Ritchie County': 'A', 'St. Marys': 'A', 'Wheeling Central Catholic': 'A',
        'Trinity Christian': 'A', 'Hannan': 'A', 'Charleston Catholic': 'A', 'Notre Dame': 'A',
        'Parkersburg Catholic': 'A', 'Greater Beckley Christian': 'A', 'Summit Christian': 'A',
        'Paw Paw': 'A', 'Union': 'A', 'Pickens': 'A', 'Harman': 'A',
      };
      // Pre-normalized (lowercased) lookup table, built once below via
      // normalizeSchoolName so classificationOf() matches loosely.
      let WV_CLASS_LOOKUP = null;
      function classificationOf(schoolName) {
        if (!WV_CLASS_LOOKUP) {
          WV_CLASS_LOOKUP = {};
          Object.keys(WV_CLASSIFICATION).forEach(k => {
            WV_CLASS_LOOKUP[normalizeSchoolName(k).toLowerCase()] = WV_CLASSIFICATION[k];
          });
        }
        if (!schoolName) return null;
        return WV_CLASS_LOOKUP[normalizeSchoolName(schoolName).toLowerCase()] || null;
      }

      // =========================================
      // HOME STATE (WV) FILTERING
      // =========================================
      const HOME_STATE = 'WV';
      function isInState(r) {
        const s = (r && r.state ? String(r.state) : HOME_STATE).toUpperCase();
        return s === HOME_STATE;
      }

      // =========================================
      // OUT OF SEASON / NON-COMPETITIVE CONFIG
      // =========================================
      const OUT_OF_SEASON_MEETS = [
        'chick-fil-a-5k',
        'st-marys-5k',
        'ymca-kennedy-center'
      ];

      function isNonCompetitive(meetSlug) {
        if (OUT_OF_SEASON_MEETS.includes(meetSlug)) return true;

        const meet = meetsData[meetSlug];
        if (meet && meet.date) {
            const dateString = String(meet.date).split('T')[0];
            const parts = dateString.split('-');

            if (parts.length >= 3) {
                const month = parseInt(parts[1], 10);
                const day = parseInt(parts[2], 10);

                if (month < 8 || (month === 8 && day < 22)) return true;
                if (month > 11 || (month === 11 && day > 1)) return true;
            }
        }

        return false;
      }

      // =========================================
      // HELPER FUNCTIONS (Formatting)
      // =========================================
      function formatTimeInSeconds(timeString) {
          if (typeof timeString === 'number' && !isNaN(timeString)) return timeString;
          if (!timeString || typeof timeString !== 'string') return null;
          if (timeString.includes(':')) {
              const parts = timeString.split(':').map(Number);
              let seconds = 0;
              if (parts.length === 3) { seconds += parts[0]*3600; seconds += parts[1]*60; seconds += parts[2]; }
              else if (parts.length === 2) { seconds += parts[0]*60; seconds += parts[1]; }
              return seconds > 0 ? seconds : null;
          } else {
              const numSeconds = parseFloat(timeString);
              return !isNaN(numSeconds) && numSeconds > 0 ? numSeconds : null;
          }
      }

      function formatTime(timeInput) {
          const time = (timeInput && timeInput.time_in_seconds !== undefined) ? timeInput.time_in_seconds : formatTimeInSeconds(timeInput);
          if (typeof time !== 'number' || isNaN(time) || time <= 0) return '';
          const totalSeconds = time;
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          const secondsPart = seconds.toFixed(2);
          let timeStr = `${minutes}:${secondsPart.padStart(5, '0')}`;
          if (minutes >= 60) {
              const hours = Math.floor(minutes / 60);
              const remainingMinutes = minutes % 60;
              timeStr = `${hours}:${String(remainingMinutes).padStart(2, '0')}:${secondsPart.padStart(5, '0')}`;
          }
          return timeStr;
      }

      // MSM Rating is a 1000-point score where HIGHER = faster/better.
      // Accepts either the _msm result object (with .points) or a raw
      // points number and renders it as an integer.
      function fmtRating(msmOrPoints) {
          const pts = (msmOrPoints && typeof msmOrPoints === 'object') ? msmOrPoints.points : msmOrPoints;
          if (typeof pts !== 'number' || !isFinite(pts)) return '';
          return Math.round(pts).toString();
      }
      // The neutral-course equivalent-5K time behind a rating (context only).
      function fmtProjected(msm) {
          const secs = msm && typeof msm === 'object' ? msm.equiv5Ksec : null;
          if (typeof secs !== 'number' || !isFinite(secs) || secs <= 0) return '';
          if (window.MSMRating && MSMRating.fmtTime) return MSMRating.fmtTime(secs);
          return formatTime(secs);
      }
      // Sortable numeric value for a rating (points). HIGHER is better, so
      // callers sort DESCENDING. Missing ratings sort to the back (-Infinity).
      function ratingPoints(r) {
          const v = r && r._msm ? r._msm.points : null;
          return (typeof v === 'number' && isFinite(v)) ? v : -Infinity;
      }
      function calculatePacePerMile(totalSeconds, distanceMeters = 5000) {
          if (!totalSeconds || totalSeconds <= 0 || !distanceMeters || distanceMeters <= 0) return '';
          const metersPerMile = 1609.34;
          const paceSeconds = (totalSeconds / distanceMeters) * metersPerMile;
          let minutes = Math.floor(paceSeconds / 60);
          let seconds = Math.round(paceSeconds % 60);
          if (seconds === 60) { seconds = 0; minutes += 1; }
          return `${minutes}:${String(seconds).padStart(2, '0')}`;
      }

      function formatGrade(gradYear) {
          if (!gradYear) return '';
          const currentYear = new Date().getFullYear();
          const currentMonth = new Date().getMonth();
          const grad = parseInt(gradYear, 10);
          const academicYearStart = currentMonth >= 7 ? currentYear + 1 : currentYear;
          const yearsUntilGraduation = grad - academicYearStart;
          if (yearsUntilGraduation === 0) return 'Sr';
          if (yearsUntilGraduation === 1) return 'Jr';
          if (yearsUntilGraduation === 2) return 'So';
          if (yearsUntilGraduation === 3) return 'Fr';
          return '';
      }

      function slugify(name) {
          if (!name) return '';
          return name.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
      }

      // =========================================
      // EXPORT TO CSV & PDF
      // =========================================
      function exportCSV() {
          if (!activeExportData || activeExportData.length === 0) {
              alert('No data available to export.');
              return;
          }

          let csvContent = '';
          const timestamp = new Date().toISOString().split('T')[0];

          if (viewMode === 'indiv') {
              const headers = rankMode === 'dynamic'
                  ? ['Rank', 'Athlete', 'School', 'Year', 'Meet', 'Date', 'Time', 'Pace', 'MSM Rating', 'Proj 5K']
                  : ['Rank', 'Athlete', 'School', 'Year', 'Meet', 'Date', 'Time', 'Pace'];

              csvContent += headers.join(',') + '\n';

              activeExportData.forEach((r, idx) => {
                  const dist = r.distance ? parseInt(r.distance, 10) : 5000;
                  const row = [
                      idx + 1,
                      `"${r.athlete_name || ''}"`,
                      `"${r.school_name || ''}"`,
                      `"${formatGrade(r.grad_year)}"`,
                      `"${r.meet_name || ''}"`,
                      `"${r.date ? String(r.date).split('T')[0] : ''}"`,
                      `"${formatTime(r.time_in_seconds)}"`,
                      `"${calculatePacePerMile(r.time_in_seconds, dist)}"`
                  ];

                  if (rankMode === 'dynamic' && r._msm) {
                      row.push(fmtRating(r._msm));
                      row.push(`"${fmtProjected(r._msm)}"`);
                  }

                  csvContent += row.join(',') + '\n';
              });
          } else {
              const headers = rankMode === 'dynamic'
                  ? ['Rank', 'School', 'Class', 'MSM Team Rating', 'NFHS Score', 'Complete', 'Scorers']
                  : ['Rank', 'School', 'Class', 'NFHS Score', 'Complete', 'Scorers'];
              csvContent += headers.join(',') + '\n';
              activeExportData.forEach((t, idx) => {
                  const scorersStr = t.top5.map(r => `${r.athlete_name} (${rankMode === 'dynamic' ? fmtRating(r._msm) : formatTime(r.time_in_seconds)})`).join('; ');
                  const cls = classificationOf(t.school) || '';
                  const row = rankMode === 'dynamic'
                      ? [idx + 1, `"${t.school}"`, cls, t.complete ? fmtRating({ points: t.metric }) : '', t.complete ? t.nfhsScore : '', t.complete ? 'Yes' : 'No', `"${scorersStr}"`]
                      : [idx + 1, `"${t.school}"`, cls, t.complete ? t.metric : '', t.complete ? 'Yes' : 'No', `"${scorersStr}"`];
                  csvContent += row.join(',') + '\n';
              });
          }

          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', `msm_rankings_${currentGender}_${rankMode}_${viewMode}_${timestamp}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
      }

      function normalizeSchoolName(schoolName) {
          if (!schoolName) return 'Unknown';
          let n = schoolName.toLowerCase().trim();
          n = n.replace(/\s+(high\s+)?school\s*$/i, '').replace(/\s+hs\s*$/i, '').trim();
          return n.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
      }

      // True NFHS cross country scoring: rank every scored athlete 1..N
      // across the whole field (best time/rating = 1st), then a team's score
      // is the sum of its top-5 finishers' places -- lowest total wins. A
      // team needs 5 scorers to post a score; the 6th and 7th runners are
      // not added in but serve as tiebreakers if two teams tie exactly.
      function computeNFHSScore(top5, sorted, placeOf) {
          if (top5.length < 5) return { score: null, sixth: 999, seventh: 999 };
          const score = top5.reduce((s, r) => s + (placeOf.get(r) || 999), 0);
          const sixth = sorted[5] ? (placeOf.get(sorted[5]) || 999) : 999;
          const seventh = sorted[6] ? (placeOf.get(sorted[6]) || 999) : 999;
          return { score, sixth, seventh };
      }

      function renderTeamRankings(containerId, results) {
          const resultsBox = document.getElementById(containerId);

          const scoringResults = dedupeBestPerAthlete(results);

          // Field order (1 result per athlete) used to assign NFHS places --
          // by MSM rating (higher = better) in Dynamic mode, by raw time in
          // Raw Time mode (lower = better).
          const fieldSorted = scoringResults.slice().sort((a, b) => {
              if (rankMode === 'dynamic') return ratingPoints(b) - ratingPoints(a);
              return a.time_in_seconds - b.time_in_seconds;
          });
          const placeOf = new Map();
          fieldSorted.forEach((r, i) => placeOf.set(r, i + 1));

          const teams = {};
          scoringResults.forEach(r => {
              const school = normalizeSchoolName(r.school_name || r.school_slug || 'Unknown');
              if (!teams[school]) teams[school] = { school, slug: r.school_slug || slugify(school), runners: [] };
              teams[school].runners.push(r);
          });

          const scored = Object.values(teams).map(t => {
              // Order each team's own runners by their place in the field.
              const sorted = t.runners.slice().sort((a, b) => (placeOf.get(a) || 999) - (placeOf.get(b) || 999));
              const top5 = sorted.slice(0, 5);
              const complete = top5.length === 5;
              const nfhs = computeNFHSScore(top5, sorted, placeOf);

              // Headline metric teams are ranked by: average MSM Rating of the
              // top 5 in Dynamic mode (higher = better team), NFHS score in Raw
              // mode (lower = better placings). Both need 5 complete scorers.
              const metric = rankMode === 'dynamic'
                  ? (complete ? Math.round(top5.reduce((s, r) => s + ratingPoints(r), 0)) : -Infinity)
                  : nfhs.score;

              return { ...t, top5, sorted, metric, nfhsScore: nfhs.score, sixth: nfhs.sixth, seventh: nfhs.seventh, complete };
          }).filter(t => t.top5.length > 0);

          // Complete (5-scorer) teams first, ranked by the headline metric,
          // then the NFHS 6th/7th-runner tiebreaker if scores are tied.
          // Incomplete teams (fewer than 5 counters) can't officially score
          // and sort to the bottom.
          scored.sort((a, b) => {
              if (a.complete !== b.complete) return a.complete ? -1 : 1;
              if (!a.complete) return 0;
              // Dynamic: higher team rating first. Raw: lower NFHS score first.
              if (a.metric !== b.metric) {
                  return rankMode === 'dynamic' ? b.metric - a.metric : a.metric - b.metric;
              }
              if (a.sixth !== b.sixth) return a.sixth - b.sixth;
              return a.seventh - b.seventh;
          });

          const teamsToShow = (currentLimit === Infinity) ? scored : scored.slice(0, currentLimit);
          activeExportData = teamsToShow;

          const header = rankMode === 'dynamic'
              ? 'Team Standings — MSM Rating (avg of top-5 ratings, higher is better) · NFHS score shown alongside'
              : 'Team Standings — NFHS Score (sum of top-5 places, lower wins)';
          let html = `<div class="app-list"><div class="list-header">${header}</div>`;
          teamsToShow.forEach((t, i) => {
              const logoUrl = `/assets/team logos/${t.slug}.png`;
              const cls = classificationOf(t.school);
              const classBadge = cls ? `<span class="scorer-badge" style="font-weight:800;">${cls}</span> ` : '';

              let metricDisplay;
              if (!t.complete) {
                  metricDisplay = `<div class="score-stack"><span class="score-rating">—</span><span class="score-predicted">needs 5 scorers</span></div>`;
              } else if (rankMode === 'dynamic') {
                  metricDisplay = `<div class="score-stack">
                        <span class="score-rating">${fmtRating({ points: t.metric })}</span>
                        <span class="score-predicted">avg rating · NFHS: ${t.nfhsScore} pts</span>
                    </div>`;
              } else {
                  metricDisplay = `<div class="score-stack">
                        <span class="score-rating">${t.metric} pts</span>
                        <span class="score-predicted">NFHS score</span>
                    </div>`;
              }

              const detail = t.top5.map(r => {
                  const v = rankMode === 'dynamic' ? fmtRating(r._msm) : formatTime(r.time_in_seconds);
                  const place = placeOf.get(r) || '?';
                  return `<span class="scorer-badge">#${place} ${(r.athlete_name||'').split(' ').slice(-1)[0]} ${v}</span>`;
              }).join(' ');
              html += `
                  <div class="list-item">
                      <div class="item-place">${i+1}</div>
                      <div class="item-avatar"><img src="${logoUrl}" alt="${t.school}" onerror="this.src='/assets/images/logob.svg'" /></div>
                      <div class="item-details">
                          <a href="school.html?slug=${t.slug}" class="item-name">${classBadge}${t.school}${t.complete?'':' <span style="font-size:0.7rem;color:var(--text-tertiary)">(incomplete)</span>'}</a>
                          <div class="item-meta">${detail}</div>
                      </div>
                      <div class="item-score">${metricDisplay}</div>
                  </div>`;
          });
          html += `</div>`;
          resultsBox.innerHTML = html;
      }

      function setFilter(type, value, event = null) {
          if (type === 'gender') currentGender = value;
          if (type === 'distance') currentDistance = value;
          if (type === 'season') currentSeason = value;
          if (type === 'meetType') currentMeetType = value;
          if (type === 'meet') currentMeetSlug = value;
          if (type === 'course') currentCourseSlug = value;
          if (type === 'classification') currentClassification = value;
          if (type === 'limit') currentLimit = (value === 'all') ? Infinity : parseInt(value, 10);
          if (type === 'gender' && event && event.currentTarget) {
              document.querySelectorAll(`[data-filter-type="gender"]`).forEach(btn => btn.classList.remove('active'));
              event.currentTarget.classList.add('active');

          filterAndRender();

      function populateFilters() {
          const seasonSelect = document.getElementById('season-filter');
          const uniqueYears = [...new Set(allResults.map(r => r.date ? new Date(r.date).getFullYear() : null))]
              .filter(y => y !== null && !isNaN(y))
              .sort((a,b) => b - a);

          let seasonHtml = `<option value="all">All-Time</option>`;
          uniqueYears.forEach(year => {
              const selected = year.toString() === currentSeason ? 'selected' : '';
              seasonHtml += `<option value="${year}" ${selected}>${year} Season</option>`;
          });

          if (!uniqueYears.includes(parseInt(currentSeason))) {
              seasonHtml = `<option value="${currentSeason}" selected>${currentSeason} Season</option>` + seasonHtml;
          }
          seasonSelect.innerHTML = seasonHtml;
          seasonSelect.value = currentSeason;

          const meetSelect = document.getElementById('meet-filter');
          meetSelect.innerHTML = '<option value="all">All Meets</option>';
          const sortedMeets = Object.keys(meetsMap).map(slug => ({ slug, name: meetsMap[slug] })).sort((a,b)=>a.name.localeCompare(b.name));
          sortedMeets.forEach(meet => {
              const option = document.createElement('option');
              option.value = meet.slug; option.textContent = meet.name; meetSelect.appendChild(option);
          });

          const courseSelect = document.getElementById('course-filter');
          courseSelect.innerHTML = '<option value="all">All Courses</option>';
          const sortedCourses = Object.keys(coursesMap).map(slug => ({ slug, name: coursesMap[slug] })).sort((a,b)=>a.name.localeCompare(b.name));
          sortedCourses.forEach(course => {
              const option = document.createElement('option');
              option.value = course.slug; option.textContent = course.name; courseSelect.appendChild(option);
          });
      }

      // =========================================
      // DATA FETCHING & FILTERING
      // =========================================
      async function loadInitialData() {
        try {
          const schools = await getAllSchools();
          schools.forEach(school => { schoolsMap[school.slug] = school.name; });

          const meets = await getMeets();
          meets.forEach(meet => { meetsMap[meet.slug] = meet.name; meetsData[meet.slug] = meet; });

          try {
            const coursesSnapshot = await firebaseDatabase.ref('crosscountry/courses').once('value');
            const coursesArray = snapshotToArray(coursesSnapshot);
            coursesArray.forEach(course => { coursesMap[course.slug] = course.name; coursesData[course.slug] = course; });
          } catch (e) { console.warn("Courses not available:", e); }

          await loadRankingsData();
        } catch (error) {
          console.error("Error loading initial data:", error);
        } finally {
          document.dispatchEvent(new Event("MSMDataLoaded"));
        }
      }

      async function loadRankingsData() {
            try {
              const snapshot = await firebaseDatabase.ref('crosscountry/results').once('value');
              const allResultsArray = snapshotToArray(snapshot);
              allResults = []; maleResults = []; femaleResults = [];

              if (allResultsArray.length === 0) {
                   document.getElementById('male-results-box').innerHTML = `<p class="text-center p-8 text-red-500">No results found in the database.</p>`;
                   document.getElementById('female-results-box').innerHTML = `<p class="text-center p-8 text-red-500">No results found in the database.</p>`;
                   return;
              }

              allResultsArray.forEach(result => {
                  const timeInSeconds = formatTimeInSeconds(result.time);
                  if (!result.gender || timeInSeconds === null) return;
                  const meet = meetsData[result.meet_slug];

                  const resultWithExtras = {
                      ...result,
                      time_in_seconds: timeInSeconds,
                      school_name: schoolsMap[result.school_slug] || result.school_slug,
                      meet_name: meetsMap[result.meet_slug] || result.meet_slug,
                      course_slug: result.course_slug || (meet && meet.course_slug) || '',
                      date: result.date || (meet && meet.date) || null,
                      state: result.state || HOME_STATE,
                      grade_string: formatGrade(result.grad_year)
                  };

                  allResults.push(resultWithExtras);
                  if (result.gender === 'M') maleResults.push(resultWithExtras);
                  else if (result.gender === 'F') femaleResults.push(resultWithExtras);
              });

              // NOTE: MSMRating.buildModel() is called lazily, scoped to the
              // selected season, from ensureModelForSeason() inside
              // filterAndRender(). Building it here from the full multi-year
              // `allResults` would let old seasons (2024, 2025, ...) contaminate
              // this season's learned course-difficulty factors.

              populateFilters();
              maleResults.sort((a,b)=>a.time_in_seconds-b.time_in_seconds);
              femaleResults.sort((a,b)=>a.time_in_seconds-b.time_in_seconds);

              filterAndRender();
            } catch (error) {
              console.error("Critical Error:", error);
              document.getElementById('male-results-box').innerHTML = `<p class="text-center p-8 text-red-500">Failed to load rankings: ${error.message}</p>`;
              document.getElementById('female-results-box').innerHTML = `<p class="text-center p-8 text-red-500">Failed to load rankings: ${error.message}</p>`;
            }
          }

      // Tracks which season the MSMRating engine's course-difficulty/ability
      // model currently reflects, so it can be rebuilt whenever the season
      // filter changes rather than staying calibrated on stale data.
      let modelBuiltForSeason = undefined;

      async function ensureModelForSeason() {
          if (modelBuiltForSeason === currentSeason) return;
          // Scope calibration data to the selected season only -- mixing in
          // prior seasons (2024, 2025, ...) would let old, unrelated races
          // chronologically interleave with this season's replay.
          const seasonScoped = currentSeason === 'all'
              ? allResults
              : allResults.filter(r => r.date && new Date(r.date).getFullYear().toString() === currentSeason);
          await MSMRating.buildModel(seasonScoped, { meetsMap: meetsData, coursesMap: coursesData });
          modelBuiltForSeason = currentSeason;
      }

      async function filterAndRender() {
          const isMale = currentGender === 'M';
          const rawResults = isMale ? maleResults : femaleResults;
          const targetSectionId = isMale ? 'male-rankings' : 'female-rankings';
          const targetBoxId = isMale ? 'male-results-box' : 'female-results-box';

          document.getElementById(isMale ? 'female-rankings' : 'male-rankings').classList.add('hidden');
          document.getElementById(targetSectionId).classList.remove('hidden');
          document.getElementById('no-rankings-message').classList.add('hidden');

          if (rankMode === 'dynamic') await ensureModelForSeason();

          let filteredResults = rawResults;

          if (currentSeason !== 'all') {
              filteredResults = filteredResults.filter(r => {
                  if (!r.date) return false;
                  return new Date(r.date).getFullYear().toString() === currentSeason;
              });
          }

          if (currentMeetType === 'in_season') {
              filteredResults = filteredResults.filter(r => !isNonCompetitive(r.meet_slug));
          } else if (currentMeetType === 'out_of_season') {
              filteredResults = filteredResults.filter(r => isNonCompetitive(r.meet_slug));
          }

          if (currentDistance !== 'all') {
              const distanceNum = parseInt(currentDistance, 10);
              filteredResults = filteredResults.filter(r => (r.distance ? parseInt(r.distance,10):0) === distanceNum);
          }
          if (currentMeetSlug !== 'all') filteredResults = filteredResults.filter(r => r.meet_slug === currentMeetSlug);
          if (currentCourseSlug !== 'all') filteredResults = filteredResults.filter(r => r.course_slug === currentCourseSlug);
          if (currentClassification !== 'all') {
              filteredResults = filteredResults.filter(r => classificationOf(r.school_name) === currentClassification);
          }

          const wxStatus = document.getElementById('weather-status');

          if (filteredResults.length === 0) {
              document.getElementById(targetBoxId).innerHTML = `<p class="text-center p-8 text-gray-500">No rankings found for the selected filters.</p>`;
              if (wxStatus) wxStatus.textContent = '';
              activeExportData = [];
              return;
          }

          const displayLimit = (viewMode === 'teams' || currentLimit === Infinity)
              ? filteredResults.length
              : currentLimit;

          if (rankMode === 'dynamic') {
              const scoringSet = filteredResults.filter(isInState);

              if (wxStatus) wxStatus.innerHTML = 'MSM Rating active &middot; each result adjusted for course difficulty, field isolation, and race-day weather.';

              // Each result row gets the rating of THAT specific performance
              // (course + field + weather adjusted). The best of an athlete's
              // performances is their overall standing; dedupe below keeps it.
              scoringSet.forEach(r => { r._msm = MSMRating.ratingForResult(r); });

              let withRatings = scoringSet.filter(r => r._msm);
              // Higher points = better, so sort DESCENDING.
              withRatings.sort((a,b) => ratingPoints(b) - ratingPoints(a));

              if (viewMode === 'teams') {
                  renderRankings(currentGender, targetBoxId, withRatings);
              } else {
                  const deduped = dedupeBestPerAthlete(withRatings);
                  deduped.sort((a,b) => ratingPoints(b) - ratingPoints(a));
                  renderRankings(currentGender, targetBoxId, deduped.slice(0, displayLimit));
              }
          } else {
              if (wxStatus) wxStatus.textContent = '';
              const inStateResults = filteredResults.filter(isInState);
              if (viewMode === 'teams') {
                  renderRankings(currentGender, targetBoxId, inStateResults);
              } else {
                  const deduped = dedupeBestPerAthlete(inStateResults);
                  renderRankings(currentGender, targetBoxId, deduped.slice(0, displayLimit));
              }
          }
      }

      function dedupeBestPerAthlete(results) {
          const bestMap = new Map();
          results.forEach(r => {
              const name = (r.athlete_name || '').toLowerCase().trim();
              if (!name) return;
              const athleteKey = `${(r.school_slug || '').toLowerCase().trim()}|${name}`;
              if (!bestMap.has(athleteKey)) {
                  bestMap.set(athleteKey, r);
              } else {
                  const existing = bestMap.get(athleteKey);
                  if (rankMode === 'dynamic') {
                      // Keep the athlete's BEST-rated performance (highest points).
                      if (ratingPoints(r) > ratingPoints(existing)) {
                          bestMap.set(athleteKey, r);
                      }
                  } else {
                      if (r.time_in_seconds < existing.time_in_seconds) bestMap.set(athleteKey, r);
                  }
              }
          });
          const deduped = Array.from(bestMap.values());
          if (rankMode === 'dynamic') deduped.sort((a,b) => ratingPoints(b) - ratingPoints(a));
          else deduped.sort((a,b) => a.time_in_seconds - b.time_in_seconds);
          return deduped;
      }

      window.onload = loadInitialData;
    </script>

<div id="global-footer"></div>
