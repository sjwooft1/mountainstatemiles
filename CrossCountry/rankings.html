<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rankings – Mountain State Miles</title>
  <link rel="icon" type="image/png" href="assets/Favicon Generator/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/Favicon Generator/favicon.svg" />

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* --- Ranking-mode toggle --- */
    .rank-mode-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 8px;
      max-width: 420px;
    }
    .rank-mode-tab {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .rank-mode-tab.active {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }
    .rank-mode-note {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-tertiary);
      margin-bottom: 20px;
    }
    .rank-mode-note a { color: var(--xc-primary); font-weight: 600; }

    /* Score / prediction pill inside item-score column */
    .score-stack { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
    .score-rating { font-weight: 800; font-size: 1.15rem; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .score-predicted { font-size: 0.72rem; color: var(--text-tertiary); font-weight: 600; }

    .adj-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
      margin-left: 4px;
    }
    .adj-up   { background: rgba(34,197,94,0.15);  color: #16a34a; }
    .adj-down { background: rgba(239,68,68,0.15);  color: #dc2626; }

    .view-tabs {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 16px;
    }
    .view-tab {
      padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      background: var(--bg-secondary); color: var(--text-secondary);
      border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
    }
    .view-tab.active { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }

    .weather-status {
      text-align: center; font-size: 0.75rem; color: var(--text-tertiary); margin-bottom: 12px;
    }

    /* --- Filter Panel Redesign --- */
    #filter-control-panel {
        background: var(--bg-secondary, #f8fafc);
        border: 1px solid var(--border, #e2e8f0);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
    }
    .filter-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        align-items: end;
    }
    @media (min-width: 768px) {
        .filter-grid {
            grid-template-columns: repeat(4, 1fr);
        }
    }
    .filter-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .filter-item label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-secondary, #64748b);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .filter-item select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border, #cbd5e1);
        background-color: var(--bg-primary, #ffffff);
        color: var(--text-primary, #0f172a);
        font-size: 0.9rem;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s;
    }
    .filter-item select:focus {
        border-color: var(--xc-primary, #0284c7);
    }
    .gender-toggles {
        display: flex;
        background: var(--bg-primary, #ffffff);
        border: 1px solid var(--border, #cbd5e1);
        border-radius: 8px;
        overflow: hidden;
    }
    .gender-toggles button {
        flex: 1;
        padding: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        background: transparent;
        color: var(--text-secondary, #64748b);
        border: none;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .gender-toggles button.active {
        background: var(--xc-primary, #0284c7);
        color: #ffffff;
    }
    .export-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        justify-content: center;
        width: 100%;
    }
    .action-btn {
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.85rem;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .btn-csv { background: #10b981; color: #fff; }
    .btn-pdf { background: #ef4444; color: #fff; }
    .action-btn:hover { opacity: 0.9; }

  </style>
</head>
<body>

  <div id="global-header"></div>

  <main class="content-section">
<script src="/assets/msm-loader.js"></script>
<div class="hero-section">
    <div class="hero-content">
      <img src="/assets/images/logo.svg" alt="Mountain State Miles Logo" class="hero-logo" />
      <h1 class="hero-title">State Rankings</h1>
      <p class="hero-subtitle">The fastest 50 times across Cross Country running in West Virginia.</p>
    </div>
  </div>

    <!-- Ranking Mode Toggle: Raw Time vs. Dynamic MSM Rating -->
    <div class="rank-mode-tabs">
      <button id="mode-raw" class="rank-mode-tab active" onclick="setRankMode('raw')">Raw Time</button>
      <button id="mode-dynamic" class="rank-mode-tab" onclick="setRankMode('dynamic')">MSM Rating</button>
    </div>
    <div class="rank-mode-note" id="rank-mode-note">
      Fastest raw times, exactly as run. <a href="rankings-explained.html">How does MSM Rating work?</a>
    </div>

    <!-- View toggle: Individual vs. Team -->
    <div class="view-tabs">
      <button id="view-indiv" class="view-tab active" onclick="setViewMode('indiv')">Individual</button>
      <button id="view-teams" class="view-tab" onclick="setViewMode('teams')">Teams</button>
    </div>

    <!-- Redesigned Filter Control Panel -->
    <section id="filter-control-panel">
      <div class="filter-grid">

        <div class="filter-item">
            <label>Gender</label>
            <div class="gender-toggles">
                <button class="active" data-filter-type="gender" data-value="M" onclick="setFilter('gender', 'M', event)">Boys</button>
                <button data-filter-type="gender" data-value="F" onclick="setFilter('gender', 'F', event)">Girls</button>
            </div>
        </div>

        <div class="filter-item">
            <label>Season</label>
            <select id="season-filter" onchange="setFilter('season', this.value)"></select>
        </div>

        <div class="filter-item">
            <label>Meet Type</label>
            <select id="meet-type-filter" onchange="setFilter('meetType', this.value)">
                <option value="in_season">In-Season Only</option>
                <option value="out_of_season">Out-of-Season / Non-Comp</option>
                <option value="all">All Meets</option>
            </select>
        </div>

        <div class="filter-item">
            <label>Distance</label>
            <select id="distance-filter" onchange="setFilter('distance', this.value)">
                <option value="all">All Distances</option>
                <option value="5000">5K (5000m)</option>
                <option value="3200">3200m</option>
                <option value="3000">3K (3000m)</option>
                <option value="1600">1 Mile (1600m)</option>
                <option value="2000">2000m</option>

        </div>

        <div class="filter-item">
            <label>Meet</label>
            <select id="meet-filter" onchange="setFilter('meet', this.value)">
                <option value="all">All Meets</option>

        <div class="filter-item">
            <label>Course</label>

        <div class="filter-item">
            <label>Display Count</label>
            <select id="limit-filter" onchange="setFilter('limit', this.value)">
                <option value="50">Top 50</option>
                <option value="100">Top 100</option>
                <option value="250">Top 250</option>

      </div>

      <!-- Export Actions -->
      <div class="export-actions">
          <button onclick="exportCSV()" class="action-btn btn-csv">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
            Export CSV
          </button>
          <button onclick="exportPDF()" class="action-btn btn-pdf">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5.5 1.5v2a1 1 0 0 0 1 1h2l-3-3zM4.5 12a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-1zM4 10.5A1.5 1.5 0 0 1 5.5 9h1A1.5 1.5 0 0 1 8 10.5v3A1.5 1.5 0 0 1 6.5 15h-1A1.5 1.5 0 0 1 4 13.5v-3z"/></svg>
            Export PDF

    </section>

    <div class="weather-status" id="weather-status"></div>

    <!-- Male Rankings Container -->
    <section id="male-rankings" class="my-10">
      <h2 class="text-3xl font-semibold mb-6 text-xc-primary border-b-2 border-xc-primary pb-2">Boys Rankings</h2>
      <div id="male-results-box" class="results-box">
        <div class="loading-state text-center p-8 text-gray-500">Loading rankings...</div>
      </div>
    </section>

    <!-- Female Rankings Container -->
    <section id="female-rankings" class="my-10 hidden">
      <h2 class="text-3xl font-semibold mb-6 text-xc-primary border-b-2 border-xc-primary pb-2">Girls Rankings</h2>
      <div id="female-results-box" class="results-box">
        <div class="loading-state text-center p-8 text-gray-500">Loading rankings...</div>
      </div>

    <section id="no-rankings-message" class="text-center my-10 hidden">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="/scripts/results-filter.js"></script>
<script src="firebase-helpers.js"></script>
  <script src="results-cutoff.js"></script>

  <script>
    // Global variables
    let allResults = [];
    let schoolsMap = {};
    let meetsMap = {};
    let meetsData = {};
    let coursesData = {};
    let maleResults = [];
    let femaleResults = [];

    // Currently rendered data for export
    let activeExportData = [];

    // State
    let currentGender = 'M';
    let currentDistance = 'all';
    let currentMeetSlug = 'all';
    let currentCourseSlug = 'all';
    let currentSeason = new Date().getFullYear().toString(); // Default to current year
    let currentMeetType = 'in_season';
    let currentLimit = 50;
    let coursesMap = {};

    let rankMode = 'raw';
    let viewMode = 'indiv';

    // =========================================
    // OUT OF SEASON / NON-COMPETITIVE CONFIG
    // =========================================
    // Add slugs here for meets that have unusually slow average times
    // due to being out of season, fun-runs, alumni races, etc.
    const OUT_OF_SEASON_MEETS = [
      'chick-fil-a-5k',
      'st-marys-5k',
      'ymca-kennedy-center'
      // Add other non-competitive meet slugs here
    ];

    function isNonCompetitive(meetSlug) {
      if (OUT_OF_SEASON_MEETS.includes(meetSlug)) return true;

      const meet = meetsData[meetSlug];
      if (meet && meet.date) {
          const dateString = String(meet.date).split('T')[0];
          const parts = dateString.split('-');

          if (parts.length >= 3) {
              const month = parseInt(parts[1], 10);
              const day = parseInt(parts[2], 10);

              if (month < 8 || (month === 8 && day < 22)) return true;
              if (month > 11 || (month === 11 && day > 1)) return true;
          }
      }

      return false;
    }

    // =========================================
    // COURSE COORDINATES
    // =========================================
    const COURSE_COORDS = {
      'holmdel-park':        { lat: 40.3418, lon: -74.1735 },
      'cabell-midland':      { lat: 38.4126, lon: -82.2543 },
      'glen-oak':            { lat: 39.4390, lon: -80.1420 },
      'pipestem-state-park': { lat: 37.5382, lon: -80.9865 },
      'meadowood-park':      { lat: 39.6295, lon: -79.9559 },
      'preston-high':        { lat: 39.4767, lon: -79.6640 },
      'south-harrison':      { lat: 39.2065, lon: -80.6390 },
      'st-marys-5k':         { lat: 39.3906, lon: -81.2043 },
      'chick-fil-a-5k':      { lat: 38.3498, lon: -81.6326 },
      'frankfort-5k':        { lat: 39.5001, lon: -78.9600 },
      'ymca-kennedy-center': { lat: 38.3400, lon: -81.7300 }
    };
    const WV_DEFAULT_COORDS = { lat: 38.6409, lon: -80.6227 };

    // =========================================
    // HELPER FUNCTIONS (Formatting)
    // =========================================
    function formatTimeInSeconds(timeString) {
        if (typeof timeString === 'number' && !isNaN(timeString)) return timeString;
        if (!timeString || typeof timeString !== 'string') return null;
        if (timeString.includes(':')) {
            const parts = timeString.split(':').map(Number);
            let seconds = 0;
            if (parts.length === 3) { seconds += parts[0]*3600; seconds += parts[1]*60; seconds += parts[2]; }
            else if (parts.length === 2) { seconds += parts[0]*60; seconds += parts[1]; }
            return seconds > 0 ? seconds : null;
        } else {
            const numSeconds = parseFloat(timeString);
            return !isNaN(numSeconds) && numSeconds > 0 ? numSeconds : null;
        }
    }

    function formatTime(timeInput) {
        const time = (timeInput && timeInput.time_in_seconds !== undefined) ? timeInput.time_in_seconds : formatTimeInSeconds(timeInput);
        if (typeof time !== 'number' || isNaN(time) || time <= 0) return '';
        const totalSeconds = time;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const secondsPart = seconds.toFixed(2);
        let timeStr = `${minutes}:${secondsPart.padStart(5, '0')}`;
        if (minutes >= 60) {
            const hours = Math.floor(minutes / 60);
            const remainingMinutes = minutes % 60;
            timeStr = `${hours}:${String(remainingMinutes).padStart(2, '0')}:${secondsPart.padStart(5, '0')}`;
        }
        return timeStr;
    }

    function calculatePacePerMile(totalSeconds, distanceMeters = 5000) {
        if (!totalSeconds || totalSeconds <= 0 || !distanceMeters || distanceMeters <= 0) return '';
        const metersPerMile = 1609.34;
        const paceSeconds = (totalSeconds / distanceMeters) * metersPerMile;
        const minutes = Math.floor(paceSeconds / 60);
        const seconds = Math.round(paceSeconds % 60);
        return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function formatGrade(gradYear) {
        if (!gradYear) return '';
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth();
        const grad = parseInt(gradYear, 10);
        const academicYearStart = currentMonth >= 7 ? currentYear + 1 : currentYear;
        const yearsUntilGraduation = grad - academicYearStart;
        if (yearsUntilGraduation === 0) return 'Sr';
        if (yearsUntilGraduation === 1) return 'Jr';
        if (yearsUntilGraduation === 2) return 'So';
        if (yearsUntilGraduation === 3) return 'Fr';
        return '';
    }

    function slugify(name) {
        if (!name) return '';
        return name.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    }

    // =========================================
    // DYNAMIC MODEL — MSM RATING
    // =========================================
    const RATING_REF = {
      M: (16 * 60) / 5000,
      F: (18.5 * 60) / 5000
    };
    const RATING_SPREAD = 350;

    // ---- Weather scoring ----
    function weatherDifficultyFactor(wx) {
      if (!wx) return 1.0;
      let f = 1.0;
      if (typeof wx.tempMaxC === 'number' && wx.tempMaxC > 18) {
        f += Math.min((wx.tempMaxC - 18) * 0.006, 0.09);
      }
      if (typeof wx.tempMaxC === 'number' && wx.tempMaxC < -5) {
        f += Math.min((-5 - wx.tempMaxC) * 0.004, 0.04);
      }
      if (typeof wx.windMaxKmh === 'number' && wx.windMaxKmh > 15) {
        f += Math.min((wx.windMaxKmh - 15) * 0.0025, 0.05);
      }
      if (typeof wx.precipMm === 'number' && wx.precipMm > 1) {
        f += Math.min(wx.precipMm * 0.004, 0.06);
      }
      return f;
    }

    const weatherCache = {};

    function meetCoords(meet) {
      if (!meet) return WV_DEFAULT_COORDS;
      if (typeof meet.lat === 'number' && typeof meet.lon === 'number') return { lat: meet.lat, lon: meet.lon };
      const cSlug = meet.course_slug || meet.course || '';
      if (cSlug && COURSE_COORDS[cSlug]) return COURSE_COORDS[cSlug];
      return WV_DEFAULT_COORDS;
    }

    function meetDateISO(meet) {
      if (!meet || !meet.date) return null;
      const d = String(meet.date).split('T')[0];
      return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : null;
    }

    async function fetchWeatherForMeet(meetSlug) {
      if (meetSlug in weatherCache) return weatherCache[meetSlug];

      const ssKey = `msm_wx_${meetSlug}`;
      const cached = sessionStorage.getItem(ssKey);
      if (cached !== null) {
        weatherCache[meetSlug] = JSON.parse(cached);
        return weatherCache[meetSlug];
      }

      const meet = meetsData[meetSlug];
      const iso = meetDateISO(meet);
      if (!iso) { weatherCache[meetSlug] = null; sessionStorage.setItem(ssKey, 'null'); return null; }

      const { lat, lon } = meetCoords(meet);
      const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}`
                + `&start_date=${iso}&end_date=${iso}`
                + `&daily=temperature_2m_max,wind_speed_10m_max,precipitation_sum`
                + `&temperature_unit=celsius&wind_speed_unit=kmh&timezone=America%2FNew_York`;
      try {
        const res = await fetch(url);
        const json = await res.json();
        const daily = json && json.daily;
        const wx = daily ? {
          tempMaxC:   Array.isArray(daily.temperature_2m_max)  ? daily.temperature_2m_max[0]  : null,
          windMaxKmh: Array.isArray(daily.wind_speed_10m_max)  ? daily.wind_speed_10m_max[0]  : null,
          precipMm:   Array.isArray(daily.precipitation_sum)   ? daily.precipitation_sum[0]   : null
        } : null;
        weatherCache[meetSlug] = wx;
        sessionStorage.setItem(ssKey, JSON.stringify(wx));
        return wx;
      } catch (e) {
        console.warn('Open-Meteo fetch failed for', meetSlug, e);
        weatherCache[meetSlug] = null;
        sessionStorage.setItem(ssKey, 'null');
        return null;
      }
    }

    // ---- Course difficulty ----
    let courseFactor = {};
    let globalMedianPace = { M: null, F: null };

    function median(arr) {
      if (!arr.length) return null;
      const s = arr.slice().sort((a,b)=>a-b);
      const mid = Math.floor(s.length/2);
      return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
    }

    function buildDerivedFactors() {
      courseFactor = {};
      const pacesByGender = { M: [], F: [] };
      const pacesByCourse = {};

      allResults.forEach(r => {
        const dist = r.distance ? parseInt(r.distance,10) : 5000;
        if (!dist || !r.time_in_seconds) return;
        const pace = r.time_in_seconds / dist;
        const g = r.gender;
        if (g !== 'M' && g !== 'F') return;

        // Out-of-season races are excluded from BOTH the global baseline and the
        // per-course medians, so a summer fun-run can't make its course look "fast"
        // (which was inflating out-of-season ratings). Terrain difficulty for such
        // courses comes from the GPX hill factor instead.
        const oos = isNonCompetitive(r.meet_slug);
        if (oos) return;
        pacesByGender[g].push(pace);

        const cs = r.course_slug || (meetsData[r.meet_slug] && meetsData[r.meet_slug].course_slug) || 'unknown';
        if (!pacesByCourse[cs]) pacesByCourse[cs] = { M: [], F: [] };
        pacesByCourse[cs][g].push(pace);
      });

      globalMedianPace.M = median(pacesByGender.M);
      globalMedianPace.F = median(pacesByGender.F);

      Object.keys(pacesByCourse).forEach(cs => {
        const parts = [];
        ['M','F'].forEach(g => {
          const cm = median(pacesByCourse[cs][g]);
          if (cm && globalMedianPace[g]) parts.push(cm / globalMedianPace[g]);
        });
        let f = parts.length ? parts.reduce((a,b)=>a+b,0)/parts.length : 1.0;
        f = Math.max(0.90, Math.min(1.12, f));
        courseFactor[cs] = f;
      });
    }

    // ---- Field strength ----
    let fieldFactor = {};
    function buildFieldFactors() {
      fieldFactor = {};
      const groups = {};
      allResults.forEach(r => {
        const dist = r.distance ? parseInt(r.distance,10) : 5000;
        if (!dist || !r.time_in_seconds) return;
        const key = `${r.meet_slug}|${r.gender}|${dist}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(r.time_in_seconds / dist);
      });

      Object.keys(groups).forEach(key => {
        const paces = groups[key];
        const g = key.split('|')[1];
        const gm = globalMedianPace[g];
        if (!gm || paces.length === 0) { fieldFactor[key] = 1.0; return; }
        const fieldMed = median(paces);

        const speedRatio = gm / fieldMed;
        const depth = Math.min(paces.length / 40, 1);
        let f = 1 + (speedRatio - 1) * 0.5 * (0.5 + 0.5*depth);
        f = Math.max(0.96, Math.min(1.08, f));
        fieldFactor[key] = f;
      });
    }

    function fieldFactorFor(r) {
      const dist = r.distance ? parseInt(r.distance,10) : 5000;
      return fieldFactor[`${r.meet_slug}|${r.gender}|${dist}`] || 1.0;
    }

    // ---- Terrain (hill) difficulty from CrossCountry/courses GPX tracks ----
    // courseHillFactor[courseSlug] is a >1 multiplier for hilly courses, <1 for flat/fast ones.
    let courseHillFactor = {};

    // Haversine distance in meters between two lat/lon points.
    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // Parse a GPX string -> total climb (m) and horizontal distance (m).
    function parseGpxClimb(gpxText) {
      try {
        const doc = new DOMParser().parseFromString(gpxText, 'application/xml');
        const pts = Array.from(doc.getElementsByTagName('trkpt'));
        if (pts.length < 2) return null;
        let climb = 0, dist = 0, prevEle = null, prevLat = null, prevLon = null;
        pts.forEach(pt => {
          const lat = parseFloat(pt.getAttribute('lat'));
          const lon = parseFloat(pt.getAttribute('lon'));
          const eleNode = pt.getElementsByTagName('ele')[0];
          const ele = eleNode ? parseFloat(eleNode.textContent) : null;
          if (prevEle !== null && ele !== null) {
            const d = ele - prevEle;
            if (d > 0.3) climb += d; // ignore GPS jitter under 0.3 m
          }
          if (prevLat !== null) dist += haversineMeters(prevLat, prevLon, lat, lon);
          if (ele !== null) prevEle = ele;
          prevLat = lat; prevLon = lon;
        });
        return { climb, dist };
      } catch (e) {
        console.warn('GPX parse failed', e);
        return null;
      }
    }

    // Convert climb-per-km (m gain / km) into a course multiplier.
    // ~15 m/km is treated as neutral WV terrain; steeper climbs push the factor up.
    function climbToFactor(mPerKm) {
      const NEUTRAL = 15;
      const f = 1 + (mPerKm - NEUTRAL) * 0.004; // ~ +/-0.4% per m/km off neutral
      return Math.max(0.94, Math.min(1.14, f));
    }

    // Fallback multiplier from the admin-set difficulty label when no GPX exists.
    function difficultyLabelFactor(label) {
      switch ((label || '').toLowerCase()) {
        case 'hard':   return 1.06;
        case 'medium': return 1.00;
        case 'easy':   return 0.96;
        default:       return 1.00;
      }
    }

    async function buildHillFactors() {
      courseHillFactor = {};
      const slugs = Object.keys(coursesData || {});
      await Promise.all(slugs.map(async (slug) => {
        const course = coursesData[slug];
        if (!course) return;

        // 1) Try GPX-derived climb (cached in sessionStorage across visits).
        if (course.gpx_url) {
          const ssKey = `msm_hill_${slug}`;
          const cached = sessionStorage.getItem(ssKey);
          if (cached !== null) {
            courseHillFactor[slug] = parseFloat(cached);
            return;
          }
          try {
            const res = await fetch(course.gpx_url);
            if (res.ok) {
              const text = await res.text();
              const parsed = parseGpxClimb(text);
              if (parsed && parsed.dist > 100) {
                const mPerKm = parsed.climb / (parsed.dist / 1000);
                const f = climbToFactor(mPerKm);
                courseHillFactor[slug] = f;
                sessionStorage.setItem(ssKey, String(f));
                return;
              }
            }
          } catch (e) {
            console.warn('GPX fetch failed for', slug, e);
          }
        }

        // 2) Fall back to the admin difficulty label.
        courseHillFactor[slug] = difficultyLabelFactor(course.difficulty);
      }));
    }

    function courseFactorFor(r) {
      const cs = r.course_slug || (meetsData[r.meet_slug] && meetsData[r.meet_slug].course_slug) || 'unknown';
      const dataF = courseFactor[cs];          // median-derived (may be undefined)
      const hillF = courseHillFactor[cs];      // terrain-derived (may be undefined)

      // Blend 50/50 when both exist; otherwise use whichever is available.
      let f;
      if (typeof dataF === 'number' && typeof hillF === 'number') {
        f = 0.5 * dataF + 0.5 * hillF;
      } else if (typeof hillF === 'number') {
        f = hillF;
      } else if (typeof dataF === 'number') {
        f = dataF;
      } else {
        f = 1.0;
      }
      return Math.max(0.90, Math.min(1.14, f));
    }

    function paceToRating(adjPaceSecPerM, gender) {
      const ref = RATING_REF[gender] || RATING_REF.M;
      const pctFaster = (ref - adjPaceSecPerM) / ref;
      const rating = 1000 + pctFaster * (RATING_SPREAD * 10);
      return Math.max(0, Math.round(rating));
    }

    function ratingToPredicted5K(rating, gender) {
      const ref = RATING_REF[gender] || RATING_REF.M;
      const pctFaster = (rating - 1000) / (RATING_SPREAD * 10);
      const neutralPace = ref * (1 - pctFaster);
      return Math.max(1, neutralPace * 5000);
    }

    function computeRating(r, weatherFactorOverride) {
      const dist = r.distance ? parseInt(r.distance,10) : 5000;
      if (!dist || !r.time_in_seconds) return null;
      const rawPace = r.time_in_seconds / dist;

      const cF = courseFactorFor(r);
      const fF = fieldFactorFor(r);
      const wF = (typeof weatherFactorOverride === 'number')
                    ? weatherFactorOverride
                    : weatherDifficultyFactor(weatherCache[r.meet_slug]);

      const adjPace = rawPace / (cF * fF * wF);
      const rating = paceToRating(adjPace, r.gender);
      return { rating, cF, fF, wF, adjPace };
    }

    function exportCSV() {

                const dist = r.distance ? parseInt(r.distance, 10) : 5000;

                    `"${r.school_name || ''}"`,

                    row.push(`"${formatTime(ratingToPredicted5K(r._msm.rating, r.gender))}"`);
                }

                csvContent += row.join(',') + '\n';
            });

                ? ['Rank', 'School', 'MSM Team Rating', 'Scorers']
                : ['Rank', 'School', 'Place Score', 'Scorers'];
            csvContent += headers.join(',') + '\n';
            activeExportData.forEach((t, idx) => {
                const scorersStr = t.top5.map(r => `${r.athlete_name} (${rankMode === 'dynamic' ? r._msm?.rating : formatTime(r.time_in_seconds)})`).join('; ');
                const row = [idx + 1, `"${t.school}"`, t.metric, `"${scorersStr}"`];

        link.setAttribute('href', url);
        link.setAttribute('download', `msm_rankings_${currentGender}_${rankMode}_${viewMode}_${timestamp}.csv`);

        link.click();
        document.body.removeChild(link);

                const c = getBrandColorRgbArray();
                if (Array.isArray(c) && c.length === 3) return c;

            alert('No data available to export.');
            return;

        const bc = getBrandColorRgbArrayLocal();

        // Build the detailed context title
        const genderText = currentGender === 'M' ? 'Boys' : 'Girls';

        const subtitle = subParts.join('  •  ');

        // Safely load the site logo (fetch -> base64 to bypass canvas CORS)
        const getBase64Image = async (url) => {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                console.warn('Could not load logo for PDF:', e);
                return null;
            }
        };
        const logoBase64 = await getBase64Image('assets/images/logo.png');

        // Custom PDF header with logo + titles
        const drawHeader = () => {
            doc.setFillColor(bc[0], bc[1], bc[2]);
            doc.rect(0, 0, doc.internal.pageSize.getWidth(), 24, 'F');

            let textX = 14;
            if (logoBase64) {
                try {
                    doc.addImage(logoBase64, 'PNG', 14, 4, 16, 16);
                    textX = 36;
                } catch (e) {
                    console.warn('Failed to draw image to PDF', e);
                }
            }

            doc.setFontSize(15);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(255, 255, 255);
            doc.text(mainTitle, textX, subtitle ? 11 : 14);

            if (subtitle) {
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(220, 220, 220);
                doc.text(subtitle, textX, 18);
            }
        };

        const startY = 30;

        if (viewMode === 'indiv') {
            const head = rankMode === 'dynamic'
                ? [['Rank', 'Athlete', 'Yr', 'School', 'Meet', 'Time', 'Pace', 'Rating', 'Proj 5K']]
                : [['Rank', 'Athlete', 'Yr', 'School', 'Meet', 'Time', 'Pace']];

            const body = activeExportData.map((r, idx) => {
                const dist = r.distance ? parseInt(r.distance, 10) : 5000;
                const row = [
                    idx + 1,
                    r.athlete_name || '',
                    formatGrade(r.grad_year) || '',
                    r.school_name || '',
                    r.meet_name || r.meet_slug || '',
                    formatTime(r.time_in_seconds),
                    calculatePacePerMile(r.time_in_seconds, dist)
                ];
                if (rankMode === 'dynamic' && r._msm) {
                    row.push(r._msm.rating);
                    row.push(formatTime(ratingToPredicted5K(r._msm.rating, r.gender)));
                }
                return row;
            });

            doc.autoTable({
                head, body, startY,
                margin: { top: 30 },
                styles: { fontSize: 8 },
                headStyles: { fillColor: bc, textColor: [255, 255, 255] },
                didDrawPage: drawHeader
            });
        } else {
            const head = rankMode === 'dynamic'
                ? [['Rank', 'School', 'Team Rating', 'Scoring Top 5']]
                : [['Rank', 'School', 'Place Score', 'Scoring Top 5']];

            const body = activeExportData.map((t, idx) => {
                const scorersStr = t.top5.map(r => `${(r.athlete_name || '').split(' ').slice(-1)[0]} (${rankMode === 'dynamic' ? (r._msm?.rating ?? '') : formatTime(r.time_in_seconds)})`).join(', ');
                return [idx + 1, t.school, t.metric, scorersStr];
            });

            doc.autoTable({
                head, body, startY,
                margin: { top: 30 },
                styles: { fontSize: 8 },
                headStyles: { fillColor: bc, textColor: [255, 255, 255] },
                didDrawPage: drawHeader
            });
        }

        doc.save(`${slugify(mainTitle)}_${rankMode}_${currentSeason}.pdf`);
    }

    // =========================================
    // RENDERING
    // =========================================
    function renderRankings(gender, containerId, results) {
        const resultsBox = document.getElementById(containerId);
        if (!resultsBox) return;

        activeExportData = results;

        if (results.length === 0) {
            resultsBox.innerHTML = `<p class="text-center p-8 text-gray-500">No rankings available for the selected filters.</p>`;
            return;
        }
        if (viewMode === 'teams') { renderTeamRankings(containerId, results); return; }

        const distanceMeters = currentDistance !== 'all' ? parseInt(currentDistance, 10) : (results[0]?.distance ? parseInt(results[0].distance, 10) : 5000);

        const tableHTML = `
            <div class="app-list">
                <div class="list-header">${rankMode === 'dynamic' ? 'Individual — MSM Rating' : 'Individual Rankings'}</div>
                ${results.map((runner, index) => {
                    const timeInSeconds = runner.time_in_seconds;
                    const resultYear = runner.date ? new Date(runner.date).getFullYear() : 'N/A';
                    const grade = formatGrade(runner.grad_year);
                    const pace = calculatePacePerMile(timeInSeconds, distanceMeters);
                    const athleteName = runner.athlete_name || '';
                    const schoolName = runner.school_name || runner.school_slug || '';
                    const schoolSlug = runner.school_slug || '';
                    const logoUrl = `/assets/team logos/${schoolSlug}.png`;

                    let metaParts = [];
                    if (grade) metaParts.push(`Yr: ${grade}`);
                    metaParts.push(`<a href="meet.html?slug=${runner.meet_slug}" style="color:inherit; text-decoration:none;">${runner.meet_name || runner.meet_slug || ''} (${resultYear})</a>`);
                    if (pace) metaParts.push(`Pace: ${pace}`);

                    let scoreCell;
                    if (rankMode === 'dynamic' && runner._msm) {
                      const predicted = formatTime(ratingToPredicted5K(runner._msm.rating, runner.gender));
                      const boost = runner._msm.cF * runner._msm.fF * runner._msm.wF;
                      const pct = Math.round((boost - 1) * 100);
                      const badge = pct !== 0
                        ? `<span class="adj-badge ${pct>0?'adj-up':'adj-down'}">${pct>0?'+':''}${pct}%</span>`
                        : '';
                      metaParts.push(`Raw: ${formatTime(timeInSeconds)}`);
                      scoreCell = `<div class="score-stack">
                            <span class="score-rating">${runner._msm.rating}${badge}</span>
                            <span class="score-predicted">proj 5K ${predicted}</span>
                        </div>`;
                    } else {
                      scoreCell = `<span class="score-rating">${formatTime(timeInSeconds) || ''}</span>`;
                    }

                    return `
                        <div class="list-item">
                            <div class="item-place">${index + 1}</div>
                            <div class="item-avatar">
                                <img src="${logoUrl}" alt="${schoolName}" onerror="this.src='/assets/images/logob.svg'" />
                            </div>
                            <div class="item-details">
                                <a href="athlete.html?name=${encodeURIComponent(athleteName)}&school=${encodeURIComponent(schoolSlug)}" class="item-name">${athleteName}</a>
                                <a href="school.html?slug=${schoolSlug}" class="item-school">${schoolName}</a>
                                <div class="item-meta">${metaParts.join(' • ')}</div>
                            </div>
                            <div class="item-score">${scoreCell}</div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
        resultsBox.innerHTML = tableHTML;
    }

    function normalizeSchoolName(schoolName) {
        if (!schoolName) return 'Unknown';
        let n = schoolName.toLowerCase().trim();
        n = n.replace(/\s+(high\s+)?school\s*$/i, '').replace(/\s+hs\s*$/i, '').trim();
        return n.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function renderTeamRankings(containerId, results) {
        const resultsBox = document.getElementById(containerId);
        const teams = {};
        results.forEach(r => {
            const school = normalizeSchoolName(r.school_name || r.school_slug || 'Unknown');
            if (!teams[school]) teams[school] = { school, slug: r.school_slug || slugify(school), runners: [] };
            teams[school].runners.push(r);
        });

        const scored = Object.values(teams).map(t => {
            const sorted = t.runners.slice().sort((a,b) => {
                if (rankMode === 'dynamic') return (b._msm?.rating||0) - (a._msm?.rating||0);
                return a.time_in_seconds - b.time_in_seconds;
            });
            const top5 = sorted.slice(0,5);
            if (rankMode === 'dynamic') {
                const teamRating = top5.reduce((s,r)=>s+(r._msm?.rating||0),0);
                return { ...t, top5, metric: teamRating, complete: top5.length===5 };
            } else {
                return { ...t, top5, metric: null, complete: top5.length===5 };
            }
        }).filter(t => t.top5.length > 0);

        if (rankMode !== 'dynamic') {
            const scoringField = results.slice().sort((a,b)=>a.time_in_seconds-b.time_in_seconds);
            const placeOf = new Map();
            let p = 1; scoringField.forEach(r => { placeOf.set(r, p++); });
            scored.forEach(t => {
                t.metric = t.top5.reduce((s,r)=> s + (placeOf.get(r)||999), 0);
            });
        }

        scored.sort((a,b) => rankMode === 'dynamic' ? b.metric - a.metric : a.metric - b.metric);

        const teamsToShow = (currentLimit === Infinity) ? scored : scored.slice(0, currentLimit);
        activeExportData = teamsToShow;

        const header = rankMode === 'dynamic' ? 'Team Standings — MSM Rating (Top-5 sum)' : 'Team Standings — Raw Place Score';
        let html = `<div class="app-list"><div class="list-header">${header}</div>`;
        teamsToShow.forEach((t, i) => {
            const logoUrl = `/assets/team logos/${t.slug}.png`;
            const metricDisplay = `<span class="score-rating">${t.metric}</span>`;
            const detail = t.top5.map(r => {
                const v = rankMode === 'dynamic' ? (r._msm?.rating||'') : formatTime(r.time_in_seconds);
                return `<span class="scorer-badge">${(r.athlete_name||'').split(' ').slice(-1)[0]} ${v}</span>`;
            }).join(' ');
            html += `
                <div class="list-item">
                    <div class="item-place">${i+1}</div>
                    <div class="item-avatar"><img src="${logoUrl}" alt="${t.school}" onerror="this.src='/assets/images/logob.svg'" /></div>
                    <div class="item-details">
                        <a href="school.html?slug=${t.slug}" class="item-name">${t.school}${t.complete?'':' <span style="font-size:0.7rem;color:var(--text-tertiary)">(incomplete)</span>'}</a>
                        <div class="item-meta">${detail}</div>
                    </div>
                    <div class="item-score">${metricDisplay}</div>
                </div>`;
        });
        html += `</div>`;
        resultsBox.innerHTML = html;
    }

    // FILTER SETTERS AND POPULATORS
    // =========================================
    function setFilter(type, value, event = null) {
        if (type === 'gender') currentGender = value;
        if (type === 'distance') currentDistance = value;
        if (type === 'season') currentSeason = value;
        if (type === 'meetType') currentMeetType = value;
        if (type === 'meet') currentMeetSlug = value;
        if (type === 'course') currentCourseSlug = value;
        if (type === 'limit') currentLimit = (value === 'all') ? Infinity : parseInt(value, 10);
        if (type === 'gender' && event && event.currentTarget) {
            document.querySelectorAll(`[data-filter-type="gender"]`).forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
        filterAndRender();

    // =========================================
    // DATA FETCHING & FILTERING
    // =========================================
    async function loadInitialData() {
      try {
        const schools = await getAllSchools();
        schools.forEach(school => { schoolsMap[school.slug] = school.name; });

        const meets = await getMeets();
        meets.forEach(meet => { meetsMap[meet.slug] = meet.name; meetsData[meet.slug] = meet; });

        try {
          const coursesSnapshot = await firebaseDatabase.ref('crosscountry/courses').once('value');
          const coursesArray = snapshotToArray(coursesSnapshot);
          coursesArray.forEach(course => { coursesMap[course.slug] = course.name; coursesData[course.slug] = course; });
        } catch (e) { console.warn("Courses not available:", e); }

        // Derive per-course hill difficulty from the GPX tracks (with admin-label fallback).
        try {
          await buildHillFactors();
        } catch (e) { console.warn("Hill factors unavailable:", e); }

        await loadRankingsData();
      } catch (error) {
        console.error("Error loading initial data:", error);
      } finally {
        document.dispatchEvent(new Event("MSMDataLoaded"));
      }
    }

    async function loadRankingsData() {
          try {
            const snapshot = await firebaseDatabase.ref('crosscountry/results').once('value');
            const allResultsArray = snapshotToArray(snapshot);
            allResults = []; maleResults = []; femaleResults = [];

            if (allResultsArray.length === 0) {
                 document.getElementById('male-results-box').innerHTML = `<p class="text-center p-8 text-red-500">No results found in the database.</p>`;
                 document.getElementById('female-results-box').innerHTML = `<p class="text-center p-8 text-red-500">No results found in the database.</p>`;
                 return;
            }

            allResultsArray.forEach(result => {
                const timeInSeconds = formatTimeInSeconds(result.time);
                if (!result.gender || timeInSeconds === null) return;
                const meet = meetsData[result.meet_slug];

                const resultWithExtras = {
                    ...result,
                    time_in_seconds: timeInSeconds,
                    school_name: schoolsMap[result.school_slug] || result.school_slug,
                    meet_name: meetsMap[result.meet_slug] || result.meet_slug,
                    course_slug: result.course_slug || (meet && meet.course_slug) || '',
                    // FIX: Inherit the date from the meet if it's not on the result
                    date: result.date || (meet && meet.date) || null,
                    grade_string: formatGrade(result.grad_year)
                };

                allResults.push(resultWithExtras);
                if (result.gender === 'M') maleResults.push(resultWithExtras);
                else if (result.gender === 'F') femaleResults.push(resultWithExtras);
            });

            buildDerivedFactors();
            buildFieldFactors();

            populateFilters();
            maleResults.sort((a,b)=>a.time_in_seconds-b.time_in_seconds);
            femaleResults.sort((a,b)=>a.time_in_seconds-b.time_in_seconds);

            filterAndRender();
          } catch (error) {
            console.error("Critical Error:", error);
            document.getElementById('male-results-box').innerHTML = `<p class="text-center p-8 text-red-500">Failed to load rankings: ${error.message}</p>`;
            document.getElementById('female-results-box').innerHTML = `<p class="text-center p-8 text-red-500">Failed to load rankings: ${error.message}</p>`;
          }
        }

    async function filterAndRender() {
        const isMale = currentGender === 'M';
        const rawResults = isMale ? maleResults : femaleResults;
        const targetSectionId = isMale ? 'male-rankings' : 'female-rankings';
        const targetBoxId = isMale ? 'male-results-box' : 'female-results-box';

        document.getElementById(isMale ? 'female-rankings' : 'male-rankings').classList.add('hidden');
        document.getElementById(targetSectionId).classList.remove('hidden');
        document.getElementById('no-rankings-message').classList.add('hidden');

        let filteredResults = rawResults;

        // 1. Season Cutoff Filter
        if (currentSeason !== 'all') {
            filteredResults = filteredResults.filter(r => {
                if (!r.date) return false;
                return new Date(r.date).getFullYear().toString() === currentSeason;
            });
        }

        // 2. Meet Type Filter (In-Season / Out-of-Season / All)
        if (currentMeetType === 'in_season') {
            filteredResults = filteredResults.filter(r => !isNonCompetitive(r.meet_slug));
        } else if (currentMeetType === 'out_of_season') {
            filteredResults = filteredResults.filter(r => isNonCompetitive(r.meet_slug));
        }

        if (currentDistance !== 'all') {
            const distanceNum = parseInt(currentDistance, 10);
            filteredResults = filteredResults.filter(r => (r.distance ? parseInt(r.distance,10):0) === distanceNum);
        }
        if (currentMeetSlug !== 'all') filteredResults = filteredResults.filter(r => r.meet_slug === currentMeetSlug);
        if (currentCourseSlug !== 'all') filteredResults = filteredResults.filter(r => r.course_slug === currentCourseSlug);

        const wxStatus = document.getElementById('weather-status');

        if (filteredResults.length === 0) {
            document.getElementById(targetBoxId).innerHTML = `<p class="text-center p-8 text-gray-500">No rankings found for the selected filters.</p>`;
            wxStatus.textContent = '';
            activeExportData = [];
            return;
        }

        const displayLimit = (viewMode === 'teams' || currentLimit === Infinity)
            ? filteredResults.length
            : currentLimit;

        if (rankMode === 'dynamic') {
            const scoringSet = filteredResults.slice();

            const uniqueMeets = [...new Set(scoringSet.map(r => r.meet_slug))];
            wxStatus.textContent = `Fetching race-day weather for ${uniqueMeets.length} meet(s)…`;

            await Promise.all(uniqueMeets.map(slug => fetchWeatherForMeet(slug)));

            scoringSet.forEach(r => { r._msm = computeRating(r); });
            let withRatings = scoringSet.filter(r => r._msm);
            withRatings.sort((a,b) => b._msm.rating - a._msm.rating);

            const weatheredCount = uniqueMeets.filter(s => weatherCache[s]).length;
            wxStatus.innerHTML = `MSM Rating active · weather applied to ${weatheredCount}/${uniqueMeets.length} meets · course & field-strength always applied.`;

            if (viewMode === 'teams') {
                renderRankings(currentGender, targetBoxId, withRatings);
            } else {
                withRatings = dedupeBestPerAthlete(withRatings);
                renderRankings(currentGender, targetBoxId, withRatings.slice(0, displayLimit));
            }
        } else {
            wxStatus.textContent = '';
            if (viewMode === 'teams') {
                renderRankings(currentGender, targetBoxId, filteredResults);
            } else {
                const deduped = dedupeBestPerAthlete(filteredResults);
                renderRankings(currentGender, targetBoxId, deduped.slice(0, displayLimit));
            }
        }
    }

    // Keep only each athlete's single best result (by rating in dynamic mode, else fastest time)
    function dedupeBestPerAthlete(results) {
        const bestMap = new Map();
        results.forEach(r => {
            const athleteKey = (r.athlete_name || '').toLowerCase().trim();
            if (!athleteKey) return;
            if (!bestMap.has(athleteKey)) {
                bestMap.set(athleteKey, r);
            } else {
                const existing = bestMap.get(athleteKey);
                if (rankMode === 'dynamic') {
                    if ((r._msm?.rating||0) > (existing._msm?.rating||0)) bestMap.set(athleteKey, r);
                } else {
                    if (r.time_in_seconds < existing.time_in_seconds) bestMap.set(athleteKey, r);
                }
            }
        });
        const deduped = Array.from(bestMap.values());
        if (rankMode === 'dynamic') deduped.sort((a,b) => (b._msm?.rating||0) - (a._msm?.rating||0));
        else deduped.sort((a,b) => a.time_in_seconds - b.time_in_seconds);
        return deduped;
    }

    window.onload = loadInitialData;
  </script>
