<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | Mountain State Miles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<!--
  The shared /assets/main.css is loaded BEFORE the page styles below on purpose.
  It defines generic .card / .btn / .hero rules; loading it first lets this page's
  own rules win on equal specificity so the layout here is deterministic instead
  of depending on which sheet happened to load last.
-->
<link rel="stylesheet" href="/assets/main.css" />
<style>
  :root{
    --bg:#0b0e13;
    --bg-elevated:#11151c;
    --card:#151a22;
    --card-border:#232b36;
    --ridge:#1c2430;
    --text:#eef1f5;
    --text-dim:#9aa5b3;
    --text-faint:#5f6b7a;
    --trail:#2fd0a3;
    --trail-dim:#1a5f4c;
    --summit:#f2a65a;
    --creek:#4f8bf0;
    --danger:#e8654f;
    --up:#e8654f;
    --down:#4fb0e0;
    --radius:14px;
    --maxw:1180px;
  }
  html[data-theme="light"]{
    --bg:#f5f3ee;
    --bg-elevated:#ffffff;
    --card:#ffffff;
    --card-border:#e3ded3;
    --ridge:#eae5da;
    --text:#1c2128;
    --text-dim:#5b6270;
    --text-faint:#8a90a0;
    --trail:#1f9e7d;
    --trail-dim:#c9f0e3;
    --up:#d1533c;
    --down:#2f7dd6;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button, select, input{font-family:inherit;}
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-1;
    background-image:
      repeating-linear-gradient(180deg, transparent 0 78px, var(--ridge) 78px 79px),
      radial-gradient(1200px 600px at 15% -10%, rgba(47,208,163,0.08), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(242,166,90,0.06), transparent 55%);
    opacity:.6;
    pointer-events:none;
  }

  /* ---------- breadcrumb ---------- */
  .breadcrumb{
    max-width:var(--maxw); margin:22px auto 0; padding:0 20px;
    font-size:12.5px; color:var(--text-faint); display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .breadcrumb a:hover{color:var(--trail);}
  .breadcrumb .sep{opacity:.5;}

  /* ---------- hero ---------- */
  .hero{
    max-width:var(--maxw); margin:0 auto; padding:18px 20px 6px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;
    text-align:left; /* reset the shared sheet's centred .hero */
  }
  .hero-title-block{display:flex; flex-direction:column; gap:10px; min-width:0;}
  .eyebrow{
    display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--summit);
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--summit);}
  h1.course-title{
    font-family:'Oswald',sans-serif; font-size:44px; line-height:1.02; font-weight:600;
    margin:0; letter-spacing:.2px;
  }
  .course-sub{color:var(--text-dim); font-size:14.5px; margin:0; max-width:560px; opacity:1;}

  .stat-strip{display:flex; gap:12px; flex-wrap:wrap;}
  .stat{
    display:flex; flex-direction:column; gap:2px; min-width:96px;
    padding:10px 16px; border-radius:10px; background:var(--card);
    border:1px solid var(--card-border);
  }
  .stat .val{font-family:'Oswald',sans-serif; font-size:21px; font-weight:600;}
  .stat .lab{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.8px;}

  /* ---------- layout ---------- */
  .page{max-width:var(--maxw); margin:0 auto; padding:28px 20px 80px; display:flex; flex-direction:column; gap:22px;}
  .grid-2{display:grid; grid-template-columns:1.2fr 1fr; gap:22px; align-items:start;}
  .grid-2.even{grid-template-columns:1fr 1fr;}
  @media (max-width:950px){ .grid-2, .grid-2.even{grid-template-columns:1fr;} }

  .card{
    background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
    overflow:hidden; position:relative; display:flex; flex-direction:column; min-width:0;
    /* Explicitly neutralise the shared sheet's padded/shadowed .card chrome. */
    padding:0; box-shadow:none; transition:none;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 18px 12px; border-bottom:1px solid var(--card-border); flex-wrap:wrap;
  }
  .card-head h2{
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; margin:0;
    letter-spacing:.4px; text-transform:uppercase; color:var(--text);
    display:flex; align-items:center; gap:9px;
  }
  .card-head h2 .swatch{width:9px;height:9px;border-radius:3px;flex:none;}
  .card-head .tag{
    font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono',monospace;
    max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-body{position:relative; flex-grow:1; min-width:0;}

  /* ---------- course grid ---------- */
  .course-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
    gap:22px; max-width:var(--maxw); margin:20px auto 60px; padding:0 20px;
  }
  .course-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
    padding:20px; cursor:pointer; display:flex; flex-direction:column; gap:12px;
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease; text-align:left;
  }
  .course-card:hover{ transform:translateY(-4px); border-color:var(--trail); box-shadow:0 10px 24px -12px rgba(47,208,163,.28); }
  .course-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .course-card-title{font-family:'Oswald',sans-serif; font-size:23px; font-weight:600; margin:0; letter-spacing:.3px;}
  .course-card-loc{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .spark{width:100%; height:44px; display:block; overflow:visible;}
  .spark-empty{height:44px; display:flex; align-items:center; font-size:11.5px; color:var(--text-faint);}
  .card-facts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-top:1px solid var(--card-border); padding-top:12px;}
  .card-fact .v{font-family:'Oswald',sans-serif; font-size:17px; font-weight:600;}
  .card-fact .l{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.6px;}
  .course-card-footer{
    margin-top:auto; font-size:13px; color:var(--trail); font-weight:600;
    display:flex; align-items:center; justify-content:space-between; gap:6px; padding-top:8px;
  }
  .course-card-footer .measuring{color:var(--text-faint); font-weight:500; font-size:12px;}

  /* ---------- pills / badges ---------- */
  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; white-space:nowrap;}
  .pill.rolling{background:rgba(154,165,179,.16); color:var(--text-dim);}
  .pill.moderate{background:rgba(242,166,90,.16); color:var(--summit);}
  .pill.major{background:rgba(232,101,79,.16); color:var(--danger);}
  .pill.fast{background:rgba(47,208,163,.14); color:var(--trail);}
  .pill.tough{background:rgba(232,101,79,.16); color:var(--danger);}
  .stars{color:var(--summit); letter-spacing:2px; font-size:13px;}

  /* ---------- map ---------- */
  #course-map{height:460px; width:100%; background:var(--bg-elevated); z-index:1;}
  .leaflet-container{background:var(--bg-elevated) !important; font-family:'Inter',sans-serif;}
  .leaflet-control-layers{background:var(--card)!important; border:1px solid var(--card-border)!important; color:var(--text)!important; border-radius:8px!important;}
  .leaflet-control-layers-toggle{background-color:var(--card)!important; border-radius:8px;}
  .map-legend{display:flex; gap:14px; padding:12px 18px; font-size:12px; color:var(--text-dim); flex-wrap:wrap; border-top:1px solid var(--card-border);}
  .map-legend .item{display:flex; align-items:center; gap:6px;}
  .legend-swatch{width:18px;height:4px;border-radius:2px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--card);}
  .mile-marker{
    background:var(--card); border:1px solid var(--trail-dim); color:var(--text);
    font-size:10px; font-weight:700; padding:1px 5px; border-radius:6px; white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .hill-marker{
    background:var(--danger); color:#fff; font-size:10px; font-weight:800;
    width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,.85); box-shadow:0 2px 6px rgba(0,0,0,.4);
  }

  /* ---------- chart ---------- */
  .profile-wrap{padding:18px 18px 6px; width:100%; height:300px; position:relative;}
  .climb-strip{position:relative; height:26px; margin:2px 18px 0; border-radius:6px; background:var(--bg-elevated); border:1px solid var(--card-border);}
  .climb-band{position:absolute; top:3px; bottom:3px; border-radius:4px; background:rgba(232,101,79,.35); border:1px solid rgba(232,101,79,.6);}
  .climb-band span{position:absolute; left:4px; top:1px; font-size:9.5px; font-weight:700; color:var(--text); white-space:nowrap;}
  .mini-stats{display:flex; border-top:1px solid var(--card-border); flex-wrap:wrap;}
  .mini-stat{flex:1; min-width:120px; padding:12px 14px; text-align:center; border-right:1px solid var(--card-border);}
  .mini-stat:last-child{border-right:none;}
  @media (max-width:520px){ .mini-stat{border-right:none; border-bottom:1px solid var(--card-border); flex:1 0 45%;} .mini-stat:last-child{border-bottom:none;} }
  .mini-stat .v{font-family:'Oswald',sans-serif; font-size:17px; font-weight:600;}
  .mini-stat .l{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.6px; margin-top:2px;}

  /* ---------- race plan ---------- */
  .plan-body{padding:16px 18px; display:flex; flex-direction:column; gap:14px;}
  .field-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:12px;}
  .field label{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); font-weight:700; margin-bottom:5px;}
  .field .inputs{display:flex; gap:6px; align-items:center;}
  .inp{
    width:100%; background:var(--bg); border:1px solid var(--card-border); color:var(--text);
    padding:8px 10px; border-radius:8px; font-size:14px; outline:none; transition:border-color .15s;
  }
  .inp:focus{border-color:var(--trail);}
  .inp-sep{color:var(--text-faint); font-weight:700;}
  .slider-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){ .slider-row{grid-template-columns:1fr;} }
  input[type="range"]{width:100%; accent-color:var(--trail);}
  .range-val{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--trail);}
  .pred-box{
    background:var(--bg-elevated); border:1px solid var(--card-border); border-radius:12px;
    padding:16px; text-align:center; box-shadow:inset 0 2px 10px rgba(0,0,0,.22);
  }
  .pred-box .pred-time{font-family:'Oswald',sans-serif; font-size:40px; color:var(--trail); font-weight:700; letter-spacing:.5px; line-height:1;}
  .pred-box .pred-lab{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; margin-top:6px; letter-spacing:.7px;}
  .pred-box .pred-delta{font-size:12.5px; color:var(--text-dim); margin-top:8px;}
  .pred-notes{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px;}
  .chip{font-size:11px; padding:4px 9px; border-radius:999px; background:var(--bg); border:1px solid var(--card-border); color:var(--text-dim);}
  .split-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .split-table th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--text-faint); padding:6px 4px; border-bottom:1px solid var(--card-border);
  }
  .split-table td{padding:7px 4px; border-bottom:1px solid var(--ridge); vertical-align:top;}
  .split-table td.num{font-family:'JetBrains Mono',monospace; text-align:right; white-space:nowrap;}
  .split-table td.terr{color:var(--text-dim); font-size:11.5px; white-space:nowrap;}
  .split-table tr.total td{font-weight:700; color:var(--trail); border-bottom:none; border-top:1px solid var(--card-border);}
  .strategy-list{margin:0; padding-left:16px; display:flex; flex-direction:column; gap:7px; font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .strategy-list li::marker{color:var(--trail);}
  .strategy-list b{color:var(--text);}

  /* ---------- hill sheet ---------- */
  .hill-list{padding:14px 18px; display:flex; flex-direction:column; gap:10px;}
  .hill{
    border:1px solid var(--card-border); border-radius:11px; padding:12px 14px;
    background:var(--bg-elevated); display:flex; flex-direction:column; gap:8px;
  }
  .hill-top{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .hill-name{font-family:'Oswald',sans-serif; font-size:15px; font-weight:600;}
  .hill-where{font-size:11.5px; color:var(--text-faint);}
  .hill-facts{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  @media (max-width:520px){ .hill-facts{grid-template-columns:repeat(2,1fr);} }
  .hill-fact .v{font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:600;}
  .hill-fact .l{font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px;}
  .hill-tip{font-size:12px; color:var(--text-dim); line-height:1.45;}
  .empty-note{padding:16px 18px; font-size:13px; color:var(--text-dim); line-height:1.55;}

  /* ---------- surface ---------- */
  .surface-container{padding:16px 18px;}
  .surface-label-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:12.5px; gap:10px; flex-wrap:wrap;}
  .surface-title{font-weight:600;}
  .surface-bar{display:flex; width:100%; height:10px; border-radius:999px; overflow:hidden; background:var(--ridge);}
  .surface-segment{height:100%;}
  .surface-legend{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}
  .surface-legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim);}
  .surface-legend-color{width:10px; height:10px; border-radius:3px;}

  /* ---------- media ---------- */
  .video-wrap{position:relative; background:#000; aspect-ratio:16/9;}
  .video-wrap video{width:100%;height:100%;display:block;object-fit:cover;background:#000;}
  .media-msg{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:var(--text-faint); font-size:13px; text-align:center; padding:20px; background:var(--bg-elevated); z-index:10;
  }
  .media-msg.show{display:flex;}
  #canvas3d-wrap{height:400px; width:100%; position:relative; cursor:grab;}
  #canvas3d-wrap:active{cursor:grabbing;}
  .media-placeholder{padding:34px 18px; text-align:center; color:var(--text-faint); font-size:13px;}

  /* ---------- notes / buttons ---------- */
  .notes{display:flex; flex-direction:column; gap:10px; padding:16px 18px;}
  .notes p{margin:0; color:var(--text-dim); font-size:13.5px; line-height:1.6;}
  .btn-row{display:flex; gap:10px; padding:0 18px 18px; flex-wrap:wrap; align-items:center;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:9px;
    font-size:13px; font-weight:600; border:1px solid var(--card-border); cursor:pointer;
    background:var(--bg-elevated); color:var(--text);
  }
  .btn.primary{background:var(--trail); color:#062018; border-color:transparent;}
  .btn:hover{filter:brightness(1.06);}

  /* ---------- records ---------- */
  .records-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px 18px;}
  @media (max-width:700px){ .records-grid{grid-template-columns:1fr;} }
  .record-col{display:flex; flex-direction:column; gap:8px; min-width:0;}
  .record-col-title{font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; color:var(--text-dim);}
  .record-highlight{background:var(--bg-elevated); border:1px solid var(--card-border); border-radius:10px; padding:12px 14px;}
  .record-highlight .rh-time{font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; color:var(--trail);}
  .record-highlight .rh-name{font-size:13.5px; font-weight:600;}
  .record-highlight .rh-meta{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .record-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .record-table td{padding:5px 4px; border-bottom:1px solid var(--card-border); color:var(--text-dim);}
  .record-table td.rt-rank{color:var(--text-faint); width:22px;}
  .record-table td.rt-time{color:var(--trail); font-family:'JetBrains Mono',monospace; text-align:right;}
  .record-empty{color:var(--text-faint); font-size:12.5px; padding:4px 0;}
  .upcoming-list{display:flex; flex-direction:column; gap:8px; padding:14px 18px;}
  .upcoming-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--bg-elevated); border:1px solid var(--card-border); border-radius:9px; padding:10px 14px;
  }
  .upcoming-item:hover{border-color:var(--trail);}
  .upcoming-item .um-name{font-size:13.5px; font-weight:600;}
  .upcoming-item .um-date{font-size:12px; color:var(--text-dim); white-space:nowrap;}

  .notice{
    display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:10px;
    background:rgba(242,166,90,.09); border:1px solid rgba(242,166,90,.35);
    color:var(--text-dim); font-size:12.5px; line-height:1.5; margin:16px 18px;
  }
  .empty-state{max-width:var(--maxw); margin:60px auto; padding:0 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px;}
  .empty-state h2{font-family:'Oswald',sans-serif; font-size:24px; margin:0;}
  .empty-state p{color:var(--text-dim); font-size:14px; max-width:460px; margin:0;}
  .loading{padding:40px 18px; text-align:center; color:var(--text-dim); font-size:14px;}

  /* ---------- print: a coach/runner course card ---------- */
  @media print{
    body::before{display:none;}
    #global-header, #global-footer, .breadcrumb, .no-print, .hero .stat-strip{display:none !important;}
    body{background:#fff; color:#000;}
    .card{border:1px solid #ccc; break-inside:avoid; box-shadow:none;}
    .card-head{border-bottom:1px solid #ccc;}
    .page{display:block; padding:0; max-width:none;}
    .grid-2, .grid-2.even{display:block;}
    .card{margin-bottom:14px;}
    .course-title{font-size:26px;}
    .pred-box .pred-time{color:#000;}
    .print-only{display:block !important;}
  }
  .print-only{display:none;}
</style>
<script src="/assets/theme-toggle.js" defer></script>
<script src="/assets/components.js" defer></script>
</head>
<body>

<div id="global-header"></div>

<main class="content-section">
  <div class="breadcrumb no-print">
    <a href="../xc.html">Cross Country</a>
    <span class="sep">/</span>
    <a href="course viewer.html">Courses</a>
    <span class="sep">/</span>
    <span id="breadcrumb-course" style="color:var(--text-dim)">…</span>
  </div>
  <div id="page-content"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../firebase-helpers.js"></script>
<script src="course-engine.js"></script>
<script src="courses-data.js"></script>
<script>
(function () {
  'use strict';

  var E = window.CourseEngine;

  // ---------------------------------------------------------------- state
  var COURSES = [];
  var analysisCache = new Map();   // slug -> analysis (or {error})
  var activeRequestId = 0;
  var map = null;
  var mapHoverMarker = null;
  var elevationChart = null;
  var activeSamples = [];
  var threeRefs = null;
  var currentPlan = null;

  // ---------------------------------------------------------------- helpers
  function assetUrl(p) {
    if (!p) return '';
    if (/^(https?:)?\/\//.test(p) || p.charAt(0) === '/') return p;
    return p.split('/').map(encodeURIComponent).join('/');
  }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtFt(n) { return n === null || n === undefined || !isFinite(n) ? '—' : Math.round(n).toLocaleString(); }
  function fmtMi(n) { return n === null || n === undefined || !isFinite(n) ? '—' : n.toFixed(2); }
  function starsHtml(stars) {
    var full = Math.round(E.clamp(stars, 1, 5));
    return '<span class="stars">' + '★'.repeat(full) + '☆'.repeat(5 - full) + '</span>';
  }
  function difficultyPill(rating) {
    var cls = rating.costPct < 1.5 ? 'fast' : rating.costPct < 3 ? 'moderate' : 'tough';
    return '<span class="pill ' + cls + '">' + esc(rating.label) + '</span>';
  }
  function slugify(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }
  function signedPct(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%'; }
  function gpxKey(p) { return p ? String(p).split('/').pop().trim().toLowerCase() : ''; }

  // ---------------------------------------------------------------- data
  async function loadManifest() {
    var local = (window.XC_COURSE_MANIFEST || []).map(function (c) {
      return Object.assign({}, c, { source: 'local' });
    });
    var bySlug = {}, byName = {};
    local.forEach(function (c) { bySlug[c.slug] = c; byName[slugify(c.name)] = c; });

    var fbCourses = [];
    try {
      if (typeof window.getAllCourses === 'function') fbCourses = await window.getAllCourses();
    } catch (e) { console.warn('Course viewer: Firebase courses unavailable', e); }

    var consumed = {};
    var merged = (fbCourses || []).map(function (fb) {
      var slug = fb.slug || slugify(fb.name || '');
      var fallback = bySlug[slug] || byName[slugify(fb.name || '')] || null;
      if (fallback) consumed[fallback.slug] = true;
      return {
        slug: slug,
        name: fb.name || (fallback && fallback.name) || 'Unnamed Course',
        gpx: fb.gpx_url || (fallback && fallback.gpx) || '',
        video: fb.video_url || (fallback && fallback.video) || '',
        location: fb.location || (fallback && fallback.location) || '',
        surfaces: (Array.isArray(fb.surfaces) && fb.surfaces.length)
          ? fb.surfaces
          : ((fallback && fallback.surfaces) || []),
        notes: fb.notes || (fallback && fallback.notes) || fb.description || '',
        source: 'firebase'
      };
    }).filter(function (c) { return c.slug; });

    // A course can only appear once. Match local fallbacks by slug, and — if a
    // slug has drifted — by GPX filename, so the same track never renders twice.
    var usedGpx = {};
    merged.forEach(function (c) { var k = gpxKey(c.gpx); if (k) usedGpx[k] = true; });
    local.forEach(function (c) {
      if (consumed[c.slug]) return;
      var k = gpxKey(c.gpx);
      if (k && usedGpx[k]) return;
      merged.push(c);
    });
    merged.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });
    COURSES = merged;
  }

  function getCourse(slug) {
    return COURSES.find(function (c) { return c.slug === slug; }) || null;
  }

  function analyzeCourse(course) {
    if (!course || !course.gpx) return Promise.resolve(null);
    if (analysisCache.has(course.slug)) return Promise.resolve(analysisCache.get(course.slug));
    var url = assetUrl(course.gpx);
    var p = fetch(url)
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
      .then(function (text) {
        var a = E.analyze(text);
        if (!a.points.length) throw new Error('no track points');
        analysisCache.set(course.slug, a);
        return a;
      })
      .catch(function (err) {
        console.warn('Course viewer: could not analyze ' + course.slug, err);
        var fail = { error: String(err && err.message || err), points: [], metrics: null, climbs: [], hasElevation: false };
        analysisCache.set(course.slug, fail);
        return fail;
      });
    analysisCache.set(course.slug, p); // cache the promise so parallel calls dedupe
    return p;
  }

  // Auto-written terrain summary, derived only from measured data.
  function terrainSummary(a) {
    var m = a.metrics;
    if (!m) return '';
    var parts = ['Measured ' + fmtMi(m.distanceMi) + ' mi'];
    if (m.hasElevation) {
      parts.push('+' + fmtFt(m.gainFt) + ' ft / −' + fmtFt(m.lossFt) + ' ft');
      parts.push(a.climbs.length
        ? a.climbs.length + (a.climbs.length === 1 ? ' climb' : ' climbs') + ' detected'
        : 'no sustained climbs');
      parts.push((m.costPct >= 0 ? '+' : '') + m.costPct.toFixed(1) + '% vs flat equivalent');
    } else {
      parts.push('elevation data unavailable');
    }
    return parts.join(' · ');
  }

  // ---------------------------------------------------------------- list view
  function sparklineSvg(a) {
    if (!a || !a.hasElevation || a.points.length < 3) return '';
    var pts = E.resample(a.points, 90);
    var w = 300, h = 44, pad = 3;
    var min = Infinity, max = -Infinity;
    pts.forEach(function (p) { if (p.eleSmooth < min) min = p.eleSmooth; if (p.eleSmooth > max) max = p.eleSmooth; });
    var span = (max - min) || 1;
    var total = pts[pts.length - 1].distMi || 1;
    var lines = [];
    for (var i = 1; i < pts.length; i++) {
      var x1 = (pts[i - 1].distMi / total) * w;
      var x2 = (pts[i].distMi / total) * w;
      var y1 = h - pad - ((pts[i - 1].eleSmooth - min) / span) * (h - pad * 2);
      var y2 = h - pad - ((pts[i].eleSmooth - min) / span) * (h - pad * 2);
      var color = E.gradeColor((pts[i].grade + pts[i - 1].grade) / 2);
      lines.push('<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
        '" stroke="' + color + '" stroke-width="2" stroke-linecap="round"/>');
    }
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' + lines.join('') + '</svg>';
  }

  function renderList() {
    document.title = 'Courses | Mountain State Miles';
    document.getElementById('breadcrumb-course').textContent = 'All Courses';
    teardownCourseView();

    var cards = COURSES.map(function (c) {
      return '<button type="button" class="course-card" data-slug="' + esc(c.slug) + '">' +
        '<div class="course-card-top">' +
          '<div>' +
            '<h3 class="course-card-title">' + esc(c.name) + '</h3>' +
            (c.location ? '<div class="course-card-loc">' + esc(c.location) + '</div>' : '') +
          '</div>' +
          '<span class="rating-slot"></span>' +
        '</div>' +
        '<div class="spark-slot"><div class="spark-empty">Profiling course…</div></div>' +
        '<div class="card-facts">' +
          '<div class="card-fact"><div class="v fact-dist">—</div><div class="l">Miles</div></div>' +
          '<div class="card-fact"><div class="v fact-gain">—</div><div class="l">Ft Climb</div></div>' +
          '<div class="card-fact"><div class="v fact-hills">—</div><div class="l">Climbs</div></div>' +
        '</div>' +
        '<div class="course-card-footer"><span>Open course profile &rarr;</span><span class="measuring">measuring…</span></div>' +
      '</button>';
    }).join('');

    document.getElementById('page-content').innerHTML =
      '<section class="hero">' +
        '<div class="hero-title-block">' +
          '<div class="eyebrow"><span class="dot"></span> Course Directory</div>' +
          '<h1 class="course-title">Courses</h1>' +
          '<p class="course-sub">Every course below is measured from its GPX track — smoothed elevation, detected climbs, and a grade-adjusted pace model. Open one for a hill sheet and a pacing plan built around your PR.</p>' +
        '</div>' +
      '</section>' +
      '<div class="course-grid">' + cards + '</div>';

    document.getElementById('page-content').querySelectorAll('.course-card').forEach(function (btn) {
      btn.addEventListener('click', function () { route(btn.dataset.slug, true); });
    });

    hydrateCards();
  }

  function hydrateCards() {
    // Small concurrency pool keeps 14 GPX fetches from stampeding mobile links.
    var queue = COURSES.slice();
    var running = 0, MAX = 4;
    function next() {
      if (!queue.length) return;
      if (running >= MAX) return;
      var course = queue.shift();
      running++;
      analyzeCourse(course).then(function (a) {
        running--;
        fillCard(course, a);
        next();
      });
    }
    for (var i = 0; i < MAX; i++) next();
  }

  function fillCard(course, a) {
    var card = document.querySelector('.course-card[data-slug="' + course.slug + '"]');
    if (!card) return;
    var slot = card.querySelector('.spark-slot');
    var ratingSlot = card.querySelector('.rating-slot');
    var measuring = card.querySelector('.measuring');

    if (!a || a.error || !a.metrics) {
      slot.innerHTML = '<div class="spark-empty">Track file unavailable</div>';
      ratingSlot.innerHTML = '<span class="pill rolling">No track file</span>';
      measuring.textContent = 'not measured';
      return;
    }
    var m = a.metrics;
    slot.innerHTML = a.hasElevation ? sparklineSvg(a) : '<div class="spark-empty">No elevation data in track file</div>';
    card.querySelector('.fact-dist').textContent = fmtMi(m.distanceMi);
    card.querySelector('.fact-gain').textContent = a.hasElevation ? fmtFt(m.gainFt) : '—';
    card.querySelector('.fact-hills').textContent = a.hasElevation ? String(a.climbs.length) : '—';
    // Never rate a course we cannot measure — calling it "Fast" would be a claim
    // the track data does not support.
    ratingSlot.innerHTML = a.hasElevation
      ? difficultyPill(a.rating) + '<div style="margin-top:6px">' + starsHtml(a.rating.stars) + '</div>'
      : '<span class="pill rolling">Unrated</span>';
    measuring.textContent = a.hasElevation ? signedPct(m.costPct) + ' vs flat' : 'distance only';
  }

  // ---------------------------------------------------------------- course view
  function teardownCourseView() {
    if (map) { map.remove(); map = null; }
    mapHoverMarker = null;
    if (elevationChart) { elevationChart.destroy(); elevationChart = null; }
    activeSamples = [];
    if (threeRefs && threeRefs.renderer) {
      threeRefs.disposed = true;
      try { threeRefs.renderer.dispose(); } catch (e) {}
    }
    threeRefs = null;
    currentPlan = null;
  }

  function renderCourseShell(course, a) {
    var m = a && a.metrics;
    var hasElev = !!(a && a.hasElevation);
    var statStrip = m
      ? '<div class="stat-strip">' +
          '<div class="stat"><span class="val">' + fmtMi(m.distanceMi) + '</span><span class="lab">Miles</span></div>' +
          '<div class="stat"><span class="val">' + (hasElev ? fmtFt(m.gainFt) : '—') + '</span><span class="lab">Ft Climb</span></div>' +
          '<div class="stat"><span class="val">' + (hasElev ? fmtFt(m.maxFt) + '′' : '—') + '</span><span class="lab">High Point</span></div>' +
          '<div class="stat"><span class="val">' + (hasElev ? signedPct(m.costPct) : '—') + '</span><span class="lab">Vs Flat</span></div>' +
        '</div>'
      : '';

    return '' +
      '<div class="no-print" style="max-width:var(--maxw); margin:0 auto; padding:0 20px;">' +
        '<button class="btn" id="back-to-list">&larr; All Courses</button>' +
      '</div>' +
      '<section class="hero">' +
        '<div class="hero-title-block">' +
          '<div class="eyebrow"><span class="dot"></span> Course Profile</div>' +
          '<h1 class="course-title">' + esc(course.name) + '</h1>' +
          '<p class="course-sub" id="course-sub">' + esc(course.location || 'Measured from the official course track file.') + '</p>' +
        '</div>' +
        statStrip +
      '</section>' +
      '<div class="page" id="course-body"></div>';
  }

  function renderCourse(course, a) {
    var body = document.getElementById('course-body');
    if (!body) return;
    if (!a || a.error || !a.metrics) {
      var msg = course.gpx
        ? 'This course\'s track file could not be loaded, so nothing can be measured yet. Expected <span class="mono">' +
          esc(course.gpx) + '</span> to be reachable — ' + esc((a && a.error) ? a.error : 'unknown error') + '.'
        : 'No track file is configured for this course yet, so it cannot be measured. ' +
          'Upload a GPX in the course admin to unlock the map, hill sheet, and pacing plan.';
      body.innerHTML = '<div class="card"><div class="empty-note">' + msg + '</div></div>';
      return;
    }

    var m = a.metrics;
    body.innerHTML =
      planCardHtml(course, a) +
      hillsCardHtml(a) +
      mapCardHtml(course, a) +
      profileCardHtml(course, a) +
      terrainCardHtml(course, a) +
      mediaRowHtml(course) +
      recordsRowHtml() +
      notesCardHtml(course, a);

    document.getElementById('back-to-list').addEventListener('click', function () { route(null, true); });

    renderMap(course, a);
    renderProfile(course, a);
    if (a.hasElevation) render3D(a);
    renderRacePlan(course, a);
    bindPlanInputs(course, a);
    bindVideoFallback();
    loadRecordsAndUpcoming(course);

    var subEl = document.getElementById('course-sub');
    if (subEl) subEl.textContent = [course.location, terrainSummary(a)].filter(Boolean).join(' · ');
  }

  // ---------- race plan ----------
  function planCardHtml(course, a) {
    return '' +
    '<div class="card">' +
      '<div class="card-head">' +
        '<h2><span class="swatch" style="background:var(--trail)"></span>Race Plan</h2>' +
        '<span class="tag no-print">Grade-adjusted from your PR</span>' +
      '</div>' +
      '<div class="plan-body">' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label for="ref-dist">Reference PR distance</label>' +
            '<select id="ref-dist" class="inp">' +
              '<option value="3.10686">5,000m (5K)</option>' +
              '<option value="1">1 mile</option>' +
              '<option value="2">2 mile / 3,200m</option>' +
              '<option value="4.97097">8,000m (8K)</option>' +
              '<option value="6.21371">10,000m (10K)</option>' +
            '</select>' +
          '</div>' +
          '<div class="field">' +
            '<label>Your PR on that distance (flat course)</label>' +
            '<div class="inputs">' +
              '<input type="number" id="ref-min" class="inp" min="3" max="90" value="18" aria-label="PR minutes">' +
              '<span class="inp-sep">:</span>' +
              '<input type="number" id="ref-sec" class="inp" min="0" max="59" value="0" aria-label="PR seconds">' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="slider-row">' +
          '<div class="field">' +
            '<label for="temp">Race-day temp <span class="range-val" id="temp-val">55°F</span></label>' +
            '<input type="range" id="temp" min="30" max="100" step="1" value="55">' +
          '</div>' +
          '<div class="field">' +
            '<label for="humidity">Humidity <span class="range-val" id="humidity-val">50%</span></label>' +
            '<input type="range" id="humidity" min="10" max="100" step="5" value="50">' +
          '</div>' +
        '</div>' +
        '<div class="pred-box">' +
          '<div class="pred-time" id="pred-time">—</div>' +
          '<div class="pred-lab">Predicted finish</div>' +
          '<div class="pred-delta" id="pred-delta"></div>' +
          '<div class="pred-notes" id="pred-notes"></div>' +
        '</div>' +
        '<div>' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:6px;">Mile-by-mile plan</div>' +
          '<table class="split-table"><thead><tr>' +
            '<th>Segment</th><th>Terrain</th><th style="text-align:right">Target</th><th style="text-align:right">Running</th>' +
          '</tr></thead><tbody id="split-body"></tbody></table>' +
        '</div>' +
        '<div>' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:8px;">Race strategy</div>' +
          '<ul class="strategy-list" id="strategy-list"></ul>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function bindPlanInputs(course, a) {
    ['ref-dist', 'ref-min', 'ref-sec', 'temp', 'humidity'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', function () { renderRacePlan(course, a); });
    });
  }

  function readPlanInputs() {
    var refMi = parseFloat((document.getElementById('ref-dist') || {}).value) || 3.10686;
    var mins = parseInt((document.getElementById('ref-min') || {}).value, 10);
    var secs = parseInt((document.getElementById('ref-sec') || {}).value, 10);
    if (!isFinite(mins)) mins = 18;
    if (!isFinite(secs)) secs = 0;
    mins = E.clamp(mins, 0, 180);
    secs = E.clamp(secs, 0, 59);
    var tempF = parseFloat((document.getElementById('temp') || {}).value);
    var humidity = parseFloat((document.getElementById('humidity') || {}).value);
    return {
      refMi: refMi,
      refSeconds: mins * 60 + secs,
      tempF: isFinite(tempF) ? tempF : 55,
      humidityPct: isFinite(humidity) ? humidity : 50
    };
  }

  function renderRacePlan(course, a) {
    var m = a.metrics;
    var i = readPlanInputs();

    var tempLab = document.getElementById('temp-val');
    var humLab = document.getElementById('humidity-val');
    if (tempLab) tempLab.textContent = Math.round(i.tempF) + '°F';
    if (humLab) humLab.textContent = Math.round(i.humidityPct) + '%';

    if (!i.refSeconds) {
      document.getElementById('pred-time').textContent = '—';
      return;
    }

    var pred = E.predictTime({
      refMi: i.refMi,
      refSeconds: i.refSeconds,
      flatEquivMi: m.flatEquivMi,
      distanceMi: m.distanceMi,
      surfaces: course.surfaces,
      tempF: i.tempF,
      humidityPct: i.humidityPct
    });
    var plan = E.buildRacePlan(a.points, pred.seconds, {
      totalGainFt: m.gainFt,
      totalLossFt: m.lossFt
    });
    currentPlan = { course: course, inputs: i, pred: pred, plan: plan };

    document.getElementById('pred-time').textContent = E.fmtTime(pred.seconds);

    var delta = pred.secondsOverFlat;
    document.getElementById('pred-delta').innerHTML =
      'On this course vs. a flat ' + fmtMi(m.distanceMi) + '-mile run at the same fitness: ' +
      '<b style="color:' + (delta >= 0 ? 'var(--up)' : 'var(--trail)') + '">' +
      (delta >= 0 ? '+' : '−') + E.fmtTime(Math.abs(delta)) + '</b>';

    var notes = [];
    notes.push('<span class="chip">Terrain ×' + pred.gradeMultiplier.toFixed(3) + '</span>');
    notes.push('<span class="chip">Footing ×' + pred.surfaceMultiplier.toFixed(3) + '</span>');
    notes.push('<span class="chip">Conditions ×' + pred.weatherMultiplier.toFixed(3) + '</span>');
    notes.push('<span class="chip">Flat-equiv ' + fmtMi(m.flatEquivMi) + ' mi</span>');
    document.getElementById('pred-notes').innerHTML = notes.join('');

    var rows = plan.splits.map(function (s) {
      var terr = '<span style="color:var(--up)">↑' + Math.round(s.gainFt) + '</span> / ' +
        '<span style="color:var(--down)">↓' + Math.round(s.lossFt) + '</span>' +
        (a.hasElevation ? ' <span style="color:var(--text-faint)">' + (s.avgGradePct >= 0 ? '+' : '') + s.avgGradePct.toFixed(1) + '%</span>' : '');
      return '<tr>' +
        '<td>' + esc(s.label) + (s.partial ? ' <span style="color:var(--text-faint)">(' + fmtMi(s.distanceMi) + ' mi)</span>' : '') +
          '<div style="margin-top:3px"><span class="pill ' + pillForEffort(effortForSegment(s)) + '">' + esc(effortForSegment(s)) + '</span></div></td>' +
        '<td class="terr">' + terr + '</td>' +
        '<td class="num">' + E.fmtTime(s.timeSeconds) + '<div style="color:var(--text-faint);font-size:10.5px">' + E.fmtPace(s.paceSecPerMi) + '</div></td>' +
        '<td class="num" style="color:var(--text-dim)">' + E.fmtTime(s.cumulativeSeconds) + '</td>' +
      '</tr>';
    }).join('');

    rows += '<tr class="total"><td>Finish</td><td class="terr">' + fmtMi(m.distanceMi) + ' mi</td>' +
      '<td class="num">' + E.fmtTime(pred.seconds) + '</td><td class="num">' + E.fmtTime(pred.seconds) + '</td></tr>';
    document.getElementById('split-body').innerHTML = rows;

    document.getElementById('strategy-list').innerHTML = plan.splits.map(function (s) {
      return '<li><b>' + esc(s.label) + ' — ' + esc(effortForSegment(s)) + ':</b> ' + esc(s.guidance) + '</li>';
    }).join('') + '<li><b>Overall:</b> ' + esc(overallStrategy(a, pred)) + '</li>';
  }

  function pillForEffort(label) {
    if (label === 'Climb') return 'major';
    if (label === 'Rising') return 'moderate';
    if (label === 'Level') return 'fast';
    return 'rolling';
  }

  // Mirrors segmentEffortLabel in the engine so the badge and the guidance text
  // can never contradict each other.
  function effortForSegment(s) {
    var g = s.avgGradePct || 0;
    if (g >= 2.5) return 'Climb';
    if (g >= 0.8) return 'Rising';
    if (g <= -2.5) return 'Descent';
    if (g <= -0.8) return 'Falling';
    if ((s.gainFt || 0) > 25 && (s.lossFt || 0) > 25) return 'Rolling';
    return 'Level';
  }

  function overallStrategy(a, pred) {
    var bits = [];

    if (a.hasElevation && a.climbs.length) {
      var hardest = a.climbs.slice().sort(function (x, y) { return y.score - x.score; })[0];
      if (hardest.category === 'rolling') {
        bits.push('No single decisive climb: every climb here is a roller under ' + fmtFt(hardest.gainFt) +
          ' ft, so surges and rhythm matter far more than the terrain.');
      } else {
        bits.push('The race is decided on ' + hardest.name + ' (' + fmtFt(hardest.gainFt) + ' ft over ' +
          hardest.lengthMi.toFixed(2) + ' mi at ' + hardest.avgGradePct.toFixed(1) + '%), starting at mile ' +
          hardest.startDistMi.toFixed(2) + '. Get there in control — a blow-up there costs more than any flat split.');
      }
    } else if (a.hasElevation) {
      bits.push('No sustained climbs: this is a rhythm course. Settle into goal pace early and hold it.');
    } else {
      bits.push('Elevation data is missing for this track, so the pacing plan uses distance and footing only — treat the split times as approximate.');
    }

    // Keep the COURSE (terrain + footing) separate from TODAY'S weather. Folding
    // them together would tell a runner their course is slow when it was really
    // just a hot day.
    var coursePct = (pred.gradeMultiplier * pred.surfaceMultiplier - 1) * 100;
    if (coursePct >= 2) {
      bits.push('The course itself is worth about ' + coursePct.toFixed(1) +
        '% over a flat, firm route of the same length, so do not read the finish time as a road or track mark.');
    } else if (coursePct <= 0.5) {
      bits.push('The course itself is within ' + Math.abs(coursePct).toFixed(1) +
        '% of a flat, firm route, so the stopwatch should translate well.');
    } else {
      bits.push('The course itself is about ' + coursePct.toFixed(1) + '% slower than a flat, firm route.');
    }

    var condPct = (pred.weatherMultiplier - 1) * 100;
    if (condPct >= 1) {
      bits.push('Race-day conditions add about ' + condPct.toFixed(1) + '% on top of that — adjust expectations, not the plan.');
    }

    bits.push(a.hasElevation && a.climbs.length
      ? 'Aim to run the second half at or faster than the first; the splits already price in the climbing.'
      : 'Run even splits: arrive at the last mile with something left, then commit.');
    return bits.join(' ');
  }

  // ---------- hills ----------
  function hillsCardHtml(a) {
    if (!a.hasElevation) {
      return '<div class="card"><div class="card-head"><h2><span class="swatch" style="background:var(--danger)"></span>Hill Sheet</h2></div>' +
        '<div class="empty-note">This track file has no elevation data, so climbs cannot be detected. Upload an elevation-enabled GPX to unlock the hill sheet and grade model.</div></div>';
    }
    if (!a.climbs.length) {
      return '<div class="card"><div class="card-head"><h2><span class="swatch" style="background:var(--danger)"></span>Hill Sheet</h2>' +
        '<span class="tag">No sustained climbs</span></div>' +
        '<div class="empty-note">No sustained climbs were detected — the track never holds a climb long enough to bank one. Treat this as a rhythm course and focus on even pacing.</div></div>';
    }
    var items = a.climbs.map(function (c) {
      return '<div class="hill">' +
        '<div class="hill-top">' +
          '<div><span class="hill-name">' + esc(c.name) + '</span> ' +
            '<span class="pill ' + c.category + '">' + c.category + '</span>' +
            '<div class="hill-where">Mile ' + c.startDistMi.toFixed(2) + ' to ' + c.endDistMi.toFixed(2) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="hill-facts">' +
          '<div class="hill-fact"><div class="v">' + fmtFt(c.gainFt) + ' ft</div><div class="l">Gain</div></div>' +
          '<div class="hill-fact"><div class="v">' + Math.round(c.lengthM) + ' m</div><div class="l">Length</div></div>' +
          '<div class="hill-fact"><div class="v">' + c.avgGradePct.toFixed(1) + '%</div><div class="l">Avg Grade</div></div>' +
          '<div class="hill-fact"><div class="v">' + c.maxGradePct.toFixed(1) + '%</div><div class="l">Max Grade</div></div>' +
        '</div>' +
        '<div class="hill-tip">' + esc(hillTip(c)) + '</div>' +
      '</div>';
    }).join('');
    var title = a.climbs.length + (a.climbs.length === 1 ? ' climb' : ' climbs');
    return '<div class="card"><div class="card-head"><h2><span class="swatch" style="background:var(--danger)"></span>Hill Sheet</h2>' +
      '<span class="tag">' + title + ' · +' + fmtFt(a.metrics.totalClimbFt) + ' ft</span></div>' +
      '<div class="hill-list">' + items + '</div></div>';
  }

  function hillTip(c) {
    if (c.category === 'major') {
      return 'The decisive one. Start it slightly within yourself, hold form through the steepest section, and only press once the grade eases near the top.';
    }
    if (c.category === 'moderate') {
      return 'Short enough to attack, long enough to punish a rushed start. Keep cadence up and breathe rhythmically; pass people going over the top, not up the middle.';
    }
    return 'A roller, not a hill. Don\'t brake and don\'t surge — carry momentum and let the terrain pass under you.';
  }

  // ---------- map ----------
  function mapCardHtml(course, a) {
    var bands = E.GRADE_BANDS.map(function (b) {
      return '<div class="item"><span class="legend-swatch" style="background:' + b.color + '"></span>' + esc(b.label) + '</div>';
    }).join('');
    return '<div class="card no-print">' +
      '<div class="card-head">' +
        '<h2><span class="swatch" style="background:var(--summit)"></span>Course Map</h2>' +
        '<span class="tag">' + esc(course.gpx || '') + '</span>' +
      '</div>' +
      '<div class="card-body"><div id="course-map"></div></div>' +
      '<div class="map-legend">' + bands +
        '<div class="item"><span class="legend-dot" style="background:#2fd0a3"></span>Start</div>' +
        '<div class="item"><span class="legend-dot" style="background:#e8654f"></span>Finish</div>' +
        '<div class="item"><span class="legend-dot" style="background:#f2a65a"></span>Mile mark</div>' +
      '</div>' +
    '</div>';
  }

  function renderMap(course, a) {
    var el = document.getElementById('course-map');
    if (!el) return;
    var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Tiles &copy; Esri'
    });
    var dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO'
    });
    var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17, attribution: '&copy; OpenTopoMap'
    });

    map = L.map(el, { scrollWheelZoom: false, layers: [satellite] });
    L.control.layers({ 'Satellite': satellite, 'Dark map': dark, 'Topographic': topo }, null, { position: 'topright' }).addTo(map);

    var pts = a.points;
    if (!pts.length) { map.setView([39.19, -81.46], 12); return; }

    var bounds = L.latLngBounds(pts.map(function (p) { return [p.lat, p.lon]; }));

    // A faint casing drawn FIRST keeps the track visible over bright satellite
    // imagery — drawn first so it sits under the grade colours without relying
    // on Leaflet's bringToBack().
    L.polyline(pts.map(function (p) { return [p.lat, p.lon]; }), {
      color: '#0b0e13', weight: 8, opacity: 0.22, lineJoin: 'round', lineCap: 'round'
    }).addTo(map);

    // Grade-coloured track: one polyline per contiguous grade band.
    E.coloredSegments(pts, 30).forEach(function (seg) {
      if (seg.latlngs.length < 2) return;
      L.polyline(seg.latlngs, { color: seg.color, weight: 5, opacity: 0.98, lineJoin: 'round', lineCap: 'round' }).addTo(map);
    });

    L.circleMarker([pts[0].lat, pts[0].lon], { radius: 8, color: '#0b0e13', weight: 2, fillColor: '#2fd0a3', fillOpacity: 1 })
      .addTo(map).bindPopup('Start');
    var last = pts[pts.length - 1];
    L.circleMarker([last.lat, last.lon], { radius: 8, color: '#0b0e13', weight: 2, fillColor: '#e8654f', fillOpacity: 1 })
      .addTo(map).bindPopup('Finish');

    // Mile marks, positioned by measured distance.
    [1, 2, 3, 4, 5, 6].forEach(function (mi) {
      var p = pointAtDistance(pts, mi * E.M_PER_MILE);
      if (!p) return;
      L.marker([p.lat, p.lon], {
        icon: L.divIcon({ className: '', html: '<div class="mile-marker">MILE ' + mi + '</div>', iconSize: [0, 0] }),
        interactive: false
      }).addTo(map);
    });

    a.climbs.forEach(function (c) {
      var p = pointAtDistance(pts, c.startDistMi * E.M_PER_MILE);
      if (!p) return;
      L.marker([p.lat, p.lon], {
        icon: L.divIcon({ className: '', html: '<div class="hill-marker">' + c.index + '</div>', iconSize: [19, 19] })
      }).addTo(map).bindPopup('<b>' + esc(c.name) + '</b><br>' + fmtFt(c.gainFt) + ' ft over ' +
        c.lengthMi.toFixed(2) + ' mi · avg ' + c.avgGradePct.toFixed(1) + '%');
    });

    map.fitBounds(bounds, { padding: [26, 26] });

    mapHoverMarker = L.circleMarker([pts[0].lat, pts[0].lon], {
      radius: 7, color: '#ffffff', weight: 2, fillColor: '#4f8bf0', fillOpacity: 1, zIndexOffset: 1000
    });
  }

  function pointAtDistance(pts, targetM) {
    if (!pts.length) return null;
    if (targetM <= 0) return pts[0];
    if (targetM >= pts[pts.length - 1].distM) return null; // don't stack all markers on the finish
    var lo = 0, hi = pts.length - 1;
    while (lo < hi - 1) {
      var mid = (lo + hi) >> 1;
      if (pts[mid].distM < targetM) lo = mid; else hi = mid;
    }
    return pts[hi];
  }

  // ---------- profile chart ----------
  function profileCardHtml(course, a) {
    if (!a.hasElevation) {
      return '<div class="card no-print"><div class="card-head"><h2><span class="swatch" style="background:var(--creek)"></span>Elevation Profile</h2></div>' +
        '<div class="empty-note">No elevation samples in this track file. Distance is measured, but terrain analysis is unavailable.</div></div>';
    }
    return '<div class="card no-print">' +
      '<div class="card-head">' +
        '<h2><span class="swatch" style="background:var(--creek)"></span>Elevation Profile</h2>' +
        '<span class="tag">Hover the chart to locate that point on the map</span>' +
      '</div>' +
      '<div class="profile-wrap"><canvas id="elevation-chart"></canvas></div>' +
      '<div class="climb-strip" id="climb-strip"></div>' +
      '<div class="mini-stats" id="mini-stats"></div>' +
    '</div>';
  }

  function renderProfile(course, a) {
    var canvas = document.getElementById('elevation-chart');
    if (!canvas) return;
    var m = a.metrics;
    activeSamples = E.resample(a.points, 320);

    var labels = activeSamples.map(function (p) { return p.distMi.toFixed(2); });
    var values = activeSamples.map(function (p) { return p.eleSmooth * E.FT_PER_M; });
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    var gridColor = light ? '#eae5da' : '#232b36';
    var textColor = light ? '#1c2128' : '#9aa5b3';

    if (elevationChart) elevationChart.destroy();
    elevationChart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Elevation (ft)',
          data: values,
          borderColor: '#4f8bf0',
          backgroundColor: light ? 'rgba(79,139,240,0.10)' : 'rgba(79,139,240,0.14)',
          fill: true,
          tension: 0.25,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#fff',
          pointHoverBorderColor: '#4f8bf0',
          pointHoverBorderWidth: 2,
          segment: {
            borderColor: function (ctx) {
              var p = activeSamples[ctx.p1DataIndex];
              return p ? E.gradeColor(p.grade) : '#4f8bf0';
            },
            borderWidth: 3
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index',
            intersect: false,
            callbacks: {
              title: function (items) { return 'Distance ' + items[0].label + ' mi'; },
              label: function (item) {
                var p = activeSamples[item.dataIndex];
                var grade = p ? (p.grade * 100) : 0;
                return [
                  'Elevation ' + item.parsed.y.toFixed(0) + ' ft',
                  'Grade ' + (grade >= 0 ? '+' : '') + grade.toFixed(1) + '%'
                ];
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: gridColor },
            ticks: { color: textColor, maxTicksLimit: 12 },
            title: { display: true, text: 'Miles', color: textColor, font: { size: 11, weight: '600' } }
          },
          y: {
            grid: { color: gridColor },
            ticks: { color: textColor },
            title: { display: true, text: 'Feet', color: textColor, font: { size: 11, weight: '600' } }
          }
        },
        onHover: function (evt, els) {
          if (!map || !mapHoverMarker) return;
          if (els && els.length) {
            var p = activeSamples[els[0].index];
            if (p) {
              mapHoverMarker.setLatLng([p.lat, p.lon]);
              if (!map.hasLayer(mapHoverMarker)) mapHoverMarker.addTo(map);
            }
          } else if (map.hasLayer(mapHoverMarker)) {
            map.removeLayer(mapHoverMarker);
          }
        }
      }
    });

    // Climb bands under the chart so hills are visible at a glance.
    var strip = document.getElementById('climb-strip');
    var total = m.distanceMi || 1;
    strip.innerHTML = a.climbs.map(function (c) {
      var left = E.clamp((c.startDistMi / total) * 100, 0, 100);
      var width = E.clamp((c.lengthMi / total) * 100, 1.2, 100 - left);
      return '<div class="climb-band" style="left:' + left.toFixed(2) + '%;width:' + width.toFixed(2) + '%">' +
        '<span>' + c.index + '</span></div>';
    }).join('') || '<div style="padding:5px 10px;font-size:11px;color:var(--text-faint)">No detected climbs</div>';

    document.getElementById('mini-stats').innerHTML =
      '<div class="mini-stat"><div class="v">' + fmtFt(m.minFt) + ' ft</div><div class="l">Low Point</div></div>' +
      '<div class="mini-stat"><div class="v">' + fmtFt(m.maxFt) + ' ft</div><div class="l">High Point</div></div>' +
      '<div class="mini-stat"><div class="v">+' + fmtFt(m.gainFt) + ' / −' + fmtFt(m.lossFt) + ' ft</div><div class="l">Gain / Loss</div></div>' +
      '<div class="mini-stat"><div class="v">' + (m.max100mGradePct === null ? '—' : m.max100mGradePct.toFixed(1) + '%') + '</div><div class="l">Steepest 100m</div></div>' +
      '<div class="mini-stat"><div class="v">' + fmtMi(m.distanceMi) + ' mi</div><div class="l">Measured Distance</div></div>';
  }

  // ---------- terrain / footing ----------
  function terrainCardHtml(course, a) {
    var m = a.metrics;
    var surfaces = (course.surfaces || []).filter(function (s) { return parseFloat(s.pct) > 0; });
    var barHtml, legendHtml;
    if (surfaces.length) {
      barHtml = surfaces.map(function (s) {
        var color = E.SURFACE_COLORS[s.type] || '#5f6b7a';
        return '<div class="surface-segment" style="width:' + s.pct + '%;background:' + color + '" title="' + esc(s.type) + ': ' + s.pct + '%"></div>';
      }).join('');
      legendHtml = surfaces.map(function (s) {
        var color = E.SURFACE_COLORS[s.type] || '#5f6b7a';
        return '<div class="surface-legend-item"><span class="surface-legend-color" style="background:' + color + '"></span>' +
          esc(s.type) + ' <strong>(' + s.pct + '%)</strong>' +
          '<span style="color:var(--text-faint)">×' + (E.SURFACE_FACTORS[s.type] || 1.02).toFixed(3) + ' pace</span></div>';
      }).join('');
    } else {
      barHtml = '<div class="surface-segment" style="width:100%;background:#5f6b7a"></div>';
      legendHtml = '<div class="surface-legend-item">No footing breakdown recorded for this course — the pace model uses a neutral (firm) surface.</div>';
    }

    var ratingRows = '';
    if (a.hasElevation) {
      ratingRows =
        '<div class="card-facts" style="border-top:none;padding-top:0">' +
          '<div class="card-fact"><div class="v">' + a.rating.secondsOverFlat.toFixed(0) + ' s</div><div class="l">Over flat 5K (at 17:00)</div></div>' +
          '<div class="card-fact"><div class="v">' + signedPct(m.costPct) + '</div><div class="l">Terrain cost</div></div>' +
          '<div class="card-fact"><div class="v">' + a.climbs.length + '</div><div class="l">Climbs</div></div>' +
        '</div>';
    }

    return '<div class="card">' +
      '<div class="card-head">' +
        '<h2><span class="swatch" style="background:var(--summit)"></span>Terrain &amp; Footing</h2>' +
        '<span class="tag">' + (a.hasElevation ? a.rating.label + ' course' : 'Flat model only') + '</span>' +
      '</div>' +
      '<div class="surface-container">' +
        '<div class="surface-label-row"><span class="surface-title">Surface breakdown</span>' +
          '<span class="mono" style="font-size:11px;color:var(--text-faint)">footing multiplier</span></div>' +
        '<div class="surface-bar">' + barHtml + '</div>' +
        '<div class="surface-legend">' + legendHtml + '</div>' +
      '</div>' +
      (a.hasElevation ? '<div style="padding:0 18px 8px"><span style="font-size:11.5px;color:var(--text-dim)">Terrain rating ' +
        starsHtml(a.rating.stars) + '</span></div>' + ratingRows : '') +
      '<div class="notes"><p>' + esc(autoTerrainNotes(a)) + '</p></div>' +
    '</div>';
  }

  function autoTerrainNotes(a) {
    var m = a.metrics;
    if (!m) return '';
    if (!a.hasElevation) {
      return 'This track has no elevation samples, so grade, climbing, and footing cost cannot be measured. Distance (' +
        fmtMi(m.distanceMi) + ' mi) is still accurate from the GPS trace.';
    }
    var out = 'The measured track climbs ' + fmtFt(m.gainFt) + ' ft and descends ' + fmtFt(m.lossFt) +
      ' ft, with a net change of ' + (m.netFt >= 0 ? '+' : '−') + fmtFt(Math.abs(m.netFt)) + ' ft. ' +
      'Its terrain alone is worth ' + signedPct(m.costPct) + ' against the same distance run flat (climbing is charged in full; ' +
      'descending only credits back ' + Math.round(E.DESCENT_EFFICIENCY * 100) + '% of its theoretical saving on cross country footing)' +
      (a.climbs.length ? ', concentrated in ' + a.climbs.length + ' detected climb' + (a.climbs.length === 1 ? '' : 's') + '.' : '.');
    if (a.climbs.length) {
      var worst = a.climbs.slice().sort(function (x, y) { return y.score - x.score; })[0];
      out += ' The hardest pitch is ' + worst.name + ': ' + fmtFt(worst.gainFt) + ' ft over ' +
        worst.lengthMi.toFixed(2) + ' mi (' + worst.avgGradePct.toFixed(1) + '% average, peaking near ' +
        worst.maxGradePct.toFixed(1) + '%).';
    }
    return out;
  }

  // ---------- media (3D + video) ----------
  function mediaRowHtml(course) {
    var video = course.video
      ? '<div class="card no-print">' +
          '<div class="card-head"><h2><span class="swatch" style="background:var(--trail)"></span>Course Flyover</h2>' +
          '<span class="tag">' + esc(course.video.split('/').pop()) + '</span></div>' +
          '<div class="card-body"><div class="video-wrap">' +
            '<video id="course-video" controls preload="metadata" playsinline>' +
              '<source src="' + esc(assetUrl(course.video)) + '" type="video/mp4">' +
            '</video>' +
            '<div class="media-msg" id="video-msg">Video file not found at <span class="mono">' + esc(course.video) + '</span></div>' +
          '</div></div>' +
        '</div>'
      : '<div class="card no-print"><div class="card-head"><h2><span class="swatch" style="background:var(--trail)"></span>Course Flyover</h2></div>' +
        '<div class="media-placeholder">No flyover video has been recorded for this course yet.</div></div>';

    return '<div class="grid-2 even">' +
      '<div class="card no-print">' +
        '<div class="card-head"><h2><span class="swatch" style="background:var(--trail)"></span>3D Terrain Orbit</h2>' +
        '<span class="tag">Drag to rotate · coloured by grade</span></div>' +
        '<div class="card-body" style="background:#05070a"><div id="canvas3d-wrap"></div></div>' +
      '</div>' +
      video +
    '</div>';
  }

  function render3D(a) {
    var container = document.getElementById('canvas3d-wrap');
    if (!container || typeof THREE === 'undefined') return;
    container.innerHTML = '';
    var width = container.clientWidth || 600;
    var height = container.clientHeight || 400;

    var scene = new THREE.Scene();
    var cardColor = getComputedStyle(document.documentElement).getPropertyValue('--card').trim() || '#151a22';
    scene.background = new THREE.Color(cardColor);
    var camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 1000);
    camera.position.set(0, 12, 30);
    camera.lookAt(0, 0, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    var dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(10, 20, 10);
    scene.add(dir);

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    container.appendChild(renderer.domElement);

    var pts = E.resample(a.points, 600);
    var minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity, minEle = Infinity, maxEle = -Infinity;
    pts.forEach(function (p) {
      minLat = Math.min(minLat, p.lat); maxLat = Math.max(maxLat, p.lat);
      minLon = Math.min(minLon, p.lon); maxLon = Math.max(maxLon, p.lon);
      minEle = Math.min(minEle, p.eleSmooth); maxEle = Math.max(maxEle, p.eleSmooth);
    });
    var centerLat = (minLat + maxLat) / 2, centerLon = (minLon + maxLon) / 2, centerEle = (minEle + maxEle) / 2;
    var latCorr = Math.cos(centerLat * Math.PI / 180);
    var maxDiff = Math.max(maxLat - minLat, (maxLon - minLon) * latCorr) || 1;
    var geoScale = 14 / maxDiff;
    var eleSpan = (maxEle - minEle) || 1;
    var eleScale = Math.max(1.5, Math.min(4, eleSpan)) / eleSpan;

    var group = new THREE.Group();
    var vectors = pts.map(function (p) {
      return new THREE.Vector3(
        (p.lon - centerLon) * geoScale * latCorr,
        (p.eleSmooth - centerEle) * eleScale,
        -(p.lat - centerLat) * geoScale
      );
    });

    // One thin tube per grade band keeps colours honest without a shader.
    var colorHexes = {};
    E.GRADE_BANDS.forEach(function (b) { colorHexes[b.color] = new THREE.Color(b.color); });

    var runsFor = function (color) {
      var runs = [], cur = null;
      for (var i = 0; i < vectors.length; i++) {
        var c = E.gradeColor(pts[i].grade);
        if (!cur || c !== cur.color) {
          if (cur && cur.pts.length > 1) runs.push(cur);
          cur = { color: c, pts: [i > 0 ? vectors[i - 1] : vectors[i], vectors[i]] };
        } else {
          cur.pts.push(vectors[i]);
        }
      }
      if (cur && cur.pts.length > 1) runs.push(cur);
      return runs.filter(function (r) { return r.color === color; });
    };

    E.GRADE_BANDS.forEach(function (band) {
      runsFor(band.color).forEach(function (run) {
        var curve = new THREE.CatmullRomCurve3(run.pts);
        var geo = new THREE.TubeGeometry(curve, Math.max(2, Math.min(200, run.pts.length)), 0.13, 8, false);
        group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: colorHexes[band.color] })));
      });
    });

    var startBall = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), new THREE.MeshStandardMaterial({ color: 0x2fd0a3, roughness: 0.25 }));
    startBall.position.copy(vectors[0]);
    group.add(startBall);
    var endBall = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), new THREE.MeshStandardMaterial({ color: 0xe8654f, roughness: 0.25 }));
    endBall.position.copy(vectors[vectors.length - 1]);
    group.add(endBall);

    var grid = new THREE.GridHelper(20, 20, 0x5f6b7a, 0x232b36);
    grid.position.y = -3;
    scene.add(grid);
    scene.add(group);

    var interacting = false, lastPos = { x: 0, y: 0 };
    container.addEventListener('mousedown', function (e) { interacting = true; lastPos = { x: e.clientX, y: e.clientY }; });
    container.addEventListener('mousemove', function (e) {
      if (!interacting) return;
      group.rotation.y += (e.clientX - lastPos.x) * 0.007;
      group.rotation.x = E.clamp(group.rotation.x + (e.clientY - lastPos.y) * 0.007, -Math.PI / 3, Math.PI / 3);
      lastPos = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mouseup', function () { interacting = false; });
    container.addEventListener('touchstart', function (e) {
      if (e.touches.length === 1) { interacting = true; lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
    }, { passive: true });
    container.addEventListener('touchmove', function (e) {
      if (!interacting || e.touches.length !== 1) return;
      group.rotation.y += (e.touches[0].clientX - lastPos.x) * 0.007;
      group.rotation.x = E.clamp(group.rotation.x + (e.touches[0].clientY - lastPos.y) * 0.007, -Math.PI / 3, Math.PI / 3);
      lastPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    window.addEventListener('touchend', function () { interacting = false; });

    threeRefs = { renderer: renderer, scene: scene, group: group, disposed: false };
    (function loop() {
      if (!threeRefs || threeRefs.disposed) return;
      requestAnimationFrame(loop);
      if (!interacting) group.rotation.y += 0.0022;
      renderer.render(scene, camera);
    })();
  }

  // ---------- records + upcoming (unchanged behaviour, new markup) ----------
  function recordsRowHtml() {
    return '<div class="grid-2 even">' +
      '<div class="card">' +
        '<div class="card-head"><h2><span class="swatch" style="background:var(--danger)"></span>Course Records</h2>' +
        '<span class="tag">All-time fastest here</span></div>' +
        '<div id="course-records-panel"><div class="record-empty" style="padding:16px 18px">Loading…</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><h2><span class="swatch" style="background:var(--summit)"></span>Upcoming Meets</h2>' +
        '<span class="tag">Scheduled at this course</span></div>' +
        '<div id="upcoming-meets-panel"><div class="record-empty" style="padding:16px 18px">Loading…</div></div>' +
      '</div>' +
    '</div>';
  }

  function formatMeetDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr + 'T00:00:00');
    return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderRecordColumn(label, results) {
    if (!results.length) {
      return '<div class="record-col"><span class="record-col-title">' + label + '</span><div class="record-empty">No recorded results yet.</div></div>';
    }
    var top = results[0];
    var rows = results.slice(1, 5).map(function (r, i) {
      return '<tr><td class="rt-rank">' + (i + 2) + '</td><td>' + esc(r.athlete_name || 'Unknown') + '</td>' +
        '<td class="rt-time">' + E.fmtTimeTenths(r.timeSeconds) + '</td></tr>';
    }).join('');
    return '<div class="record-col"><span class="record-col-title">' + label + '</span>' +
      '<div class="record-highlight"><div class="rh-time">' + E.fmtTimeTenths(top.timeSeconds) + '</div>' +
      '<div class="rh-name">' + esc(top.athlete_name || 'Unknown') + '</div>' +
      '<div class="rh-meta">' + esc(top.meetName || 'Unknown meet') + ' · ' + formatMeetDate(top.meetDate) + '</div></div>' +
      (rows ? '<table class="record-table"><tbody>' + rows + '</tbody></table>' : '') +
      '</div>';
  }

  async function loadRecordsAndUpcoming(course) {
    var recordsPanel = document.getElementById('course-records-panel');
    var upcomingPanel = document.getElementById('upcoming-meets-panel');
    if (!recordsPanel && !upcomingPanel) return;

    if (typeof window.getAllMeets !== 'function' || typeof window.getResultsByMeet !== 'function') {
      if (recordsPanel) recordsPanel.innerHTML = '<div class="record-empty" style="padding:16px 18px">Course records unavailable right now.</div>';
      if (upcomingPanel) upcomingPanel.innerHTML = '<div class="record-empty" style="padding:16px 18px">Meet lookups unavailable right now.</div>';
      return;
    }

    try {
      var allMeets = await window.getAllMeets(5000);
      var courseMeets = (allMeets || []).filter(function (m) { return m.course_slug && m.course_slug === course.slug; });

      if (upcomingPanel) {
        var today = new Date().toISOString().slice(0, 10);
        var upcoming = courseMeets.filter(function (m) { return m.date && m.date >= today; })
          .sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
        upcomingPanel.innerHTML = upcoming.length
          ? '<div class="upcoming-list">' + upcoming.map(function (m) {
              return '<a class="upcoming-item" href="../meet.html?slug=' + encodeURIComponent(m.slug) + '">' +
                '<span class="um-name">' + esc(m.name || m.slug) + '</span>' +
                '<span class="um-date">' + formatMeetDate(m.date) + '</span></a>';
            }).join('') + '</div>'
          : '<div class="record-empty" style="padding:16px 18px">No upcoming meets scheduled at this course yet.</div>';
      }

      if (recordsPanel) {
        if (!courseMeets.length) {
          recordsPanel.innerHTML = '<div class="record-empty" style="padding:16px 18px">No meets are linked to this course yet, so no records exist. Link meets to this course in the admin to populate this panel.</div>';
        } else {
          var resultsByMeet = await Promise.all(courseMeets.map(function (m) { return window.getResultsByMeet(m.slug); }));
          var boys = [], girls = [];
          courseMeets.forEach(function (meet, idx) {
            (resultsByMeet[idx] || []).forEach(function (r) {
              var t = parseFloat(r.time);
              if (isNaN(t) || t <= 0) return;
              var entry = { athlete_name: r.athlete_name, timeSeconds: t, meetName: meet.name, meetDate: meet.date };
              var g = (r.gender || '').toUpperCase();
              if (g === 'M' || g === 'B' || g === 'BOY' || g === 'BOYS') boys.push(entry);
              else if (g === 'F' || g === 'G' || g === 'GIRL' || g === 'GIRLS') girls.push(entry);
            });
          });
          boys.sort(function (a, b) { return a.timeSeconds - b.timeSeconds; });
          girls.sort(function (a, b) { return a.timeSeconds - b.timeSeconds; });
          recordsPanel.innerHTML = '<div class="records-grid">' +
            renderRecordColumn('Fastest Boys', boys) + renderRecordColumn('Fastest Girls', girls) + '</div>';
        }
      }
    } catch (err) {
      console.warn('Course viewer: records/meets failed', err);
      if (recordsPanel) recordsPanel.innerHTML = '<div class="record-empty" style="padding:16px 18px">Unable to load course records right now.</div>';
      if (upcomingPanel) upcomingPanel.innerHTML = '<div class="record-empty" style="padding:16px 18px">Unable to load upcoming meets right now.</div>';
    }
  }

  // ---------- notes + actions ----------
  function notesCardHtml(course, a) {
    return '<div class="card">' +
      '<div class="card-head"><h2><span class="swatch" style="background:var(--text-dim)"></span>Course Notes</h2>' +
      '<span class="tag">' + (course.source === 'firebase' ? 'from database' : 'local manifest') + '</span></div>' +
      '<div class="notes">' +
        (course.notes ? '<p>' + esc(course.notes) + '</p>' : '<p>No hand-written notes for this course yet.</p>') +
        '<p style="color:var(--text-faint);font-size:12.5px">All distances, climbing, grades, and climb counts on this page are computed from the course GPX, not entered by hand. Elevation is smoothed by distance and gain uses a noise threshold, so short GPS spikes are not counted as hills.</p>' +
      '</div>' +
      '<div class="btn-row no-print">' +
        (course.gpx ? '<a class="btn" href="' + esc(assetUrl(course.gpx)) + '" download>Download GPX</a>' : '') +
        '<button class="btn primary" id="print-card">Print course card</button>' +
        '<button class="btn" id="copy-plan">Copy race plan</button>' +
      '</div>' +
    '</div>';
  }

  function planAsText() {
    if (!currentPlan) return '';
    var course = currentPlan.course, i = currentPlan.inputs, pred = currentPlan.pred, plan = currentPlan.plan;
    var lines = [];
    lines.push(course.name + ' — race plan');
    lines.push('Reference PR: ' + E.fmtTime(i.refSeconds) + ' for ' + i.refMi.toFixed(2) + ' mi (flat)');
    lines.push('Conditions: ' + Math.round(i.tempF) + 'F, ' + Math.round(i.humidityPct) + '% humidity');
    lines.push('Predicted finish: ' + E.fmtTime(pred.seconds) + ' (' +
      (pred.secondsOverFlat >= 0 ? '+' : '−') + E.fmtTime(Math.abs(pred.secondsOverFlat)) + ' vs flat same distance)');
    lines.push('');
    lines.push('Splits:');
    plan.splits.forEach(function (s) {
      lines.push('  ' + s.label + '  ' + E.fmtTime(s.timeSeconds) + '  (' + E.fmtPace(s.paceSecPerMi) + ')  ' +
        s.effortLabel + '  ' + E.fmtTime(s.cumulativeSeconds) + ' cumulative');
    });
    lines.push('');
    lines.push('Strategy:');
    plan.splits.forEach(function (s) { lines.push('  - ' + s.label + ': ' + s.guidance); });
    return lines.join('\n');
  }

  // Show a readable message instead of a dead black box when a flyover video is
  // missing on this deployment.
  function bindVideoFallback() {
    var video = document.getElementById('course-video');
    var msg = document.getElementById('video-msg');
    if (!video || !msg) return;
    var show = function () { msg.classList.add('show'); };
    video.addEventListener('error', show, { once: true });
    var source = video.querySelector('source');
    if (source) source.addEventListener('error', show, { once: true });
  }

  function bindNotesActions() {
    var printBtn = document.getElementById('print-card');
    if (printBtn) printBtn.addEventListener('click', function () { window.print(); });
    var copyBtn = document.getElementById('copy-plan');
    if (copyBtn) copyBtn.addEventListener('click', function () {
      var text = planAsText();
      if (!text) return;
      var done = function () { copyBtn.textContent = 'Copied ✓'; setTimeout(function () { copyBtn.textContent = 'Copy race plan'; }, 2000); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy race plan', text); });
      } else {
        window.prompt('Copy race plan', text);
      }
    });
  }

  // ---------------------------------------------------------------- routing
  async function route(slug, pushState) {
    var requestId = ++activeRequestId;
    teardownCourseView();
    if (pushState) {
      var url = new URL(window.location.href);
      if (slug) url.searchParams.set('course', slug); else url.searchParams.delete('course');
      window.history.pushState({ slug: slug }, '', url);
    }

    if (!slug) {
      window.scrollTo({ top: 0 });
      renderList();
      return;
    }

    var course = getCourse(slug);
    if (!course) {
      document.getElementById('page-content').innerHTML =
        '<div class="empty-state"><h2>Course not found</h2><p>“' + esc(slug) + '” is not in the course manifest.</p></div>';
      return;
    }

    document.title = course.name + ' — Course | Mountain State Miles';
    document.getElementById('breadcrumb-course').textContent = course.name;
    document.getElementById('page-content').innerHTML =
      renderCourseShell(course, null) +
      '<div class="loading">Measuring course from track data…</div>';
    window.scrollTo({ top: 0 });

    var a = await analyzeCourse(course);
    if (requestId !== activeRequestId) return; // a newer navigation won

    document.getElementById('page-content').innerHTML = renderCourseShell(course, a || { metrics: null });
    renderCourse(course, a || { metrics: null });
    bindNotesActions();
  }

  // ---------------------------------------------------------------- boot
  async function boot() {
    try { await loadManifest(); } catch (e) { console.warn(e); }
    if (!COURSES.length) {
      document.getElementById('page-content').innerHTML =
        '<div class="empty-state"><h2>No courses configured</h2><p>The course manifest is empty.</p></div>';
      return;
    }
    var params = new URLSearchParams(window.location.search);
    route(params.get('course'), false);
  }

  window.addEventListener('popstate', function () {
    route(new URLSearchParams(window.location.search).get('course'), false);
  });

  var themeObserver = new MutationObserver(function () {
    if (typeof Chart !== 'undefined' && elevationChart) {
      var light = document.documentElement.getAttribute('data-theme') === 'light';
      var grid = light ? '#eae5da' : '#232b36';
      var text = light ? '#1c2128' : '#9aa5b3';
      elevationChart.options.scales.x.grid.color = grid;
      elevationChart.options.scales.y.grid.color = grid;
      elevationChart.options.scales.x.ticks.color = text;
      elevationChart.options.scales.y.ticks.color = text;
      elevationChart.options.scales.x.title.color = text;
      elevationChart.options.scales.y.title.color = text;
      elevationChart.update('none');
    }
    if (threeRefs && threeRefs.scene) {
      var card = getComputedStyle(document.documentElement).getPropertyValue('--card').trim();
      if (card) threeRefs.scene.background.set(card);
    }
  });
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<div id="global-footer"></div>
