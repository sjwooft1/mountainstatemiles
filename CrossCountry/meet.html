<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Results | Mountain State Miles</title>
  
  <link rel="icon" type="image/png" href="assets/Favicon Generator/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/Favicon Generator/favicon.svg" />
  <link rel="shortcut icon" href="assets/Favicon Generator/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/Favicon Generator/apple-touch-icon.png" />
  <link rel="manifest" href="assets/Favicon Generator/site.webmanifest" />
  
  <meta name="description" content="WV cross country running results, rankings, team scores, and meet data — Mountain State Miles." />
  <meta name="keywords" content="WVXC, WV Track, West Virginia Running, Cross Country Results, WV HS Running, Mountain State Miles" />
  <link rel="stylesheet" href="/assets/main.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.1/jspdf.plugin.autotable.min.js"></script>
  <script src="/assets/components.js" defer></script>
  <script src="/assets/theme-toggle.js" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      if (slug) {
        document.title = `${slug.replace(/-/g, " ")} – Meet Results | Mountain State Miles`;
      }
    });
  </script>

  <style>
    /* ============================================
       Modern Meet Page Styles
       ============================================ */
    @font-face {
      font-family: 'Aqeon Demo';
      src: url('../assets/Aqeon Demo Font.ttf') format('truetype');
    }
    :root {
      --font-display: 'Aqeon Demo', sans-serif;
      --radius-lg: 14px;
      --radius-md: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    .content-section {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    /* --- Hero Header --- */
    .meet-header {
      background: var(--bg-primary);
      padding: 24px 16px;
      text-align: center;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin-bottom: 24px;
      box-shadow: 0 4px 16px var(--shadow-light);
    }
    .meet-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      color: var(--text-primary);
      margin: 0 0 8px;
      line-height: 1.1;
    }
    .meet-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .meet-stats {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .stat-item {
      text-align: center;
      padding: 0 12px;
    }
    .stat-value {
      display: block;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-tertiary);
      letter-spacing: 0.05em;
    }

    /* --- App-Style Tabs (Gender & Views) --- */
    .app-tabs-container {
      margin-bottom: 24px;
    }
    .app-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 2px solid var(--border);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
    }
    .app-tabs::-webkit-scrollbar { display: none; } /* Chrome/Safari */
    
    .app-tab {
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      white-space: nowrap;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .app-tab.active {
      color: var(--text-primary);
    }
    .app-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--text-primary);
    }

    /* --- Selectors (Divisions) --- */
    .division-chips {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .division-chips::-webkit-scrollbar { display: none; }
    
    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }

    /* --- Search & Actions --- */
    .utility-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--text-primary);
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
    }
    .action-btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* --- App-Style List Layout (The Core Update) --- */
    .app-list {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 32px;
      box-shadow: 0 2px 8px var(--shadow-light);
    }
    .list-header {
      background: var(--bg-secondary);
      padding: 12px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    .list-item {
      display: flex;
      align-items: stretch; /* Stretches the place box to full height */
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
      transition: background 0.2s;
    }
    .list-item:last-child {
      border-bottom: none;
    }
    .list-item:hover {
      background: var(--bg-secondary);
    }

    /* Placement Block */
    .item-place {
      width: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--text-primary);
      color: var(--bg-primary);
      font-weight: 800;
      font-size: 1.15rem;
    }

    /* Avatar / Logo */
    .item-avatar {
      display: flex;
      align-items: center;
      padding-left: 12px;
    }
    .item-avatar img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: contain;
      background: #fff; /* Keep white bg for logos to pop */
      padding: 2px;
      border: 1px solid var(--border);
    }

    /* Middle Details */
    .item-details {
      flex: 1;
      padding: 12px;
      min-width: 0; /* Prevents flex blowout on long names */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .item-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-primary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-school {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      margin: 2px 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      font-weight: 600;
    }

    /* Right Side (Time / Score) */
    .item-score {
      padding: 12px 16px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    /* Mini Scorer Badges */
    .scorer-badge {
      display: inline-block;
      padding: 2px 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      margin-right: 4px;
      color: var(--text-secondary);
    }

    /* Print Stylesheet */
    @media print {
      body { background: #fff !important; color: #000 !important; }
      #global-header, #global-footer, .app-tabs-container, .utility-bar { display: none !important; }
      .app-list { box-shadow: none; border: 1px solid #ccc; }
      .item-place { background: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>

<body>

  <div id="global-header"></div>
  <script src="/assets/msm-loader.js"></script>

  <main class="content-section">
      
      <div class="meet-header">
        <h1 class="meet-title" id="meet-title">Loading Meet...</h1>
        <div id="meet-meta" class="meet-subtitle">Retrieving data...</div>
        
        <div class="meet-stats" id="meet-stats" style="display:none;">
          <div class="stat-item"><span class="stat-value" id="stat-races">-</span><span class="stat-label">Races</span></div>
          <div class="stat-item"><span class="stat-value" id="stat-teams">-</span><span class="stat-label">Teams</span></div>
          <div class="stat-item"><span class="stat-value" id="stat-athletes">-</span><span class="stat-label">Athletes</span></div>
        </div>
      </div>

      <div id="error" class="error-message" style="display:none; text-align: center; color: var(--danger); padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; margin-bottom: 20px;"></div>

      <div id="selector" style="display:none;">
        
        <div class="app-tabs-container">
          <div class="app-tabs">
            <button class="app-tab active" id="view-all-btn">All Results</button>
            <button class="app-tab" id="view-teams-btn">Team Scores</button>
            <button class="app-tab" id="view-indiv-btn">Individual Grid</button>
          </div>
        </div>

        <div class="app-tabs-container">
          <div class="app-tabs">
            <button id="tab-boys" class="app-tab active">Boys</button>
            <button id="tab-girls" class="app-tab">Girls</button>
          </div>
          <div class="division-chips" id="race-button-wrap"></div>
        </div>

        <div class="utility-bar">
          <div class="search-box">
            <i>🔍</i>
            <input type="text" id="search-input" placeholder="Search athlete or school..." />
          </div>
          <button class="action-btn" onclick="exportToCSV()">📊 CSV</button>
          <button class="action-btn" onclick="exportResultsPDF()">📄 PDF</button>
        </div>

      </div>

    <div id="results-box"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-helpers.js"></script>

  <script>
    // ==========================================
    // 1. UTILITY & FORMATTING FUNCTIONS
    // ==========================================

    function formatTime(totalSeconds) {
      if (typeof totalSeconds !== 'number' || isNaN(totalSeconds) || totalSeconds <= 0) {
        return 'N/T';
      }
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${seconds.toFixed(2).padStart(5, '0')}`;
    }

    function calculatePacePerMile(totalSeconds, distanceMeters) {
      if (!totalSeconds || !distanceMeters) return '-';
      const MILE_IN_METERS = 1609.34;
      const secondsPerMile = (totalSeconds / distanceMeters) * MILE_IN_METERS;
      return formatTime(secondsPerMile);
    }
    
    function formatGrade(gradYear) {
      if (!gradYear) return '';
      const currentSeasonYear = 2025; 
      const diff = gradYear - (currentSeasonYear + 1);
      const gradeMap = { 0: '12', 1: '11', 2: '10', 3: '9', 4: '8', 5: '7', 6: '6' };
      return gradeMap[diff] || gradYear; 
    }

    function slugify(name) {
      if (!name) return '';
      return name.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    }

    function normalizeGender(r) {
      const g = String(r.gender || '').trim().toUpperCase();
      if (['M', 'BOYS', 'BOY', 'MALE', 'B'].includes(g)) return 'M';
      if (['F', 'GIRLS', 'GIRL', 'FEMALE', 'G'].includes(g)) return 'F';
      const raceText = (r.race_type || r.division || r.event || r.event_name || '').toLowerCase();
      if (raceText.includes('girl') || raceText.includes('female') || raceText.includes('women')) return 'F';
      if (raceText.includes('boy') || raceText.includes('male') || raceText.includes('men')) return 'M';
      return 'M';
    }

    function normalizeRaceType(r) {
      let raw = r.race_type || r.division || r.event || r.event_name || 'Varsity 5K';
      if (typeof raw !== 'string') return 'Varsity 5K';
      raw = raw.trim();
      if (!raw) return 'Varsity 5K';
      return raw.split(/\s+/).map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ')
        .replace(/\b5k\b/i, '5K').replace(/\b3k\b/i, '3K').replace(/\bJv\b/g, 'JV').replace(/\bMs\b/g, 'Middle School');
    }

    // ==========================================
    // 2. STATE MANAGEMENT
    // ==========================================
    let currentMeetData = null;
    let allResults = [];
    let activeGender = 'M';
    let activeRaceType = null;
    let currentFilteredResults = [];
    let activeViewMode = 'all'; // 'all', 'teams', 'indiv'

    // ==========================================
    // 3. MAIN INITIALIZATION
    // ==========================================

    window.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
    
      const errorDiv = document.getElementById("error");
      const metaDiv = document.getElementById("meet-meta");
      const selectorDiv = document.getElementById("selector");
    
      if (!slug) {
        errorDiv.style.display = "block";
        errorDiv.textContent = "No meet specified. Please return to the Meets page.";
        document.dispatchEvent(new Event("MSMDataLoaded"));
        return;
      }
      
      try {
        currentMeetData = await window.getMeetBySlug(slug);
        if (!currentMeetData) throw new Error("Meet not found.");
    
        // --- UPDATE TITLE AND HEADER HERE ---
        const meetName = currentMeetData.name || "Meet Results";
        
        // Set browser tab title
        document.title = `${meetName} | Mountain State Miles`;
        
        // Set main page header
        document.getElementById("meet-title").textContent = meetName;
        // ------------------------------------
    
        metaDiv.innerHTML = `<strong>${formatMeetDate(currentMeetData.date)}</strong> &nbsp;•&nbsp; ${currentMeetData.location || 'Location Unknown'}`;
    

        const schools = await window.getAllSchools();
        const schoolSlugToName = {};
        if (schools && schools.length) {
          schools.forEach(s => { schoolSlugToName[s.slug || ''] = s.name || s.slug; });
        }

        allResults = await window.getResultsByMeet(slug);
        
        if (!allResults || allResults.length === 0) {
            errorDiv.style.display = "block";
            errorDiv.textContent = "Results have not been uploaded for this meet yet.";
            return;
        }

        allResults.forEach(r => {
          r.normalizedGender = normalizeGender(r);
          r.normalizedRaceType = normalizeRaceType(r);
          if ((!r.school_name && !r.school) && r.school_slug) {
            r.school_name = schoolSlugToName[r.school_slug] || r.school_slug;
          }
        });
        
        // Populate Top Stats
        const uniqueRaces = new Set(allResults.map(r => r.normalizedRaceType)).size;
        const uniqueTeams = new Set(allResults.map(r => r.school_slug || r.school_name || r.school)).size;
        
        document.getElementById('stat-races').textContent = uniqueRaces || '-';
        document.getElementById('stat-teams').textContent = uniqueTeams || '-';
        document.getElementById('stat-athletes').textContent = allResults.length || '-';
        document.getElementById('meet-stats').style.display = 'flex';

        selectorDiv.style.display = "block";

        setupSearchAndControls();
        setupGenderTabs();
        document.getElementById("tab-boys").click();

      } catch (err) {
        console.error(err);
        errorDiv.style.display = "block";
        errorDiv.textContent = "Error loading meet data: " + err.message;
      } finally {
        document.dispatchEvent(new Event("MSMDataLoaded"));
      }
    });

    function formatMeetDate(dateStr) {
      if (!dateStr) return "Date TBD";
      const parts = String(dateStr).split("T")[0].split("-");
      if (parts.length === 3) {
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        return new Date(year, month, day).toLocaleDateString(undefined, {
          weekday: "short", month: "short", day: "numeric", year: "numeric",
        });
      }
      return new Date(dateStr).toLocaleDateString();
    }

    // ==========================================
    // 4. UI CONTROLS & SEARCH
    // ==========================================

    function setupSearchAndControls() {
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', renderTableForSelection);
      }

      const btnAll = document.getElementById('view-all-btn');
      const btnTeams = document.getElementById('view-teams-btn');
      const btnIndiv = document.getElementById('view-indiv-btn');

      const resetViewBtns = () => [btnAll, btnTeams, btnIndiv].forEach(b => b.classList.remove('active'));

      btnAll.addEventListener('click', () => { resetViewBtns(); btnAll.classList.add('active'); activeViewMode = 'all'; renderTableForSelection(); });
      btnTeams.addEventListener('click', () => { resetViewBtns(); btnTeams.classList.add('active'); activeViewMode = 'teams'; renderTableForSelection(); });
      btnIndiv.addEventListener('click', () => { resetViewBtns(); btnIndiv.classList.add('active'); activeViewMode = 'indiv'; renderTableForSelection(); });
    }

    function setupGenderTabs() {
        const btnBoys = document.getElementById('tab-boys');
        const btnGirls = document.getElementById('tab-girls');

        const resetTabs = () => { [btnBoys, btnGirls].forEach(b => b.classList.remove('active')); };

        btnBoys.addEventListener('click', () => {
            resetTabs(); btnBoys.classList.add('active'); activeGender = 'M'; updateRaceButtons();
        });

        btnGirls.addEventListener('click', () => {
            resetTabs(); btnGirls.classList.add('active'); activeGender = 'F'; updateRaceButtons();
        });
    }

    function updateRaceButtons() {
        const container = document.getElementById('race-button-wrap');
        container.innerHTML = ''; 
        document.getElementById('results-box').innerHTML = '';

        const relevantResults = allResults.filter(r => r.normalizedGender === activeGender);
        if (relevantResults.length === 0) return;

        const raceTypes = [...new Set(relevantResults.map(r => r.normalizedRaceType))].sort();

        raceTypes.forEach((type, index) => {
            const btn = document.createElement('button');
            btn.className = 'chip'; 
            btn.textContent = type;

            btn.onclick = () => {
                Array.from(container.children).forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                activeRaceType = type;
                renderTableForSelection();
            };
            container.appendChild(btn);
            if (index === 0) btn.click();
        });
    }

    function renderTableForSelection() {
        const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();

        let filteredData = allResults.filter(r => 
            r.normalizedGender === activeGender && r.normalizedRaceType === activeRaceType
        );

        if (query) {
          filteredData = filteredData.filter(r => {
            const name = (r.athlete_name || r.name || '').toLowerCase();
            const school = (r.school_name || r.school || '').toLowerCase();
            return name.includes(query) || school.includes(query);
          });
        }

        filteredData.sort((a, b) => {
            if (a.place && b.place) return parseInt(a.place) - parseInt(b.place);
            return parseFloat(a.time) - parseFloat(b.time); 
        });

        currentFilteredResults = filteredData;
        const distance = filteredData.length > 0 ? parseFloat(filteredData[0].distance) : 5000;
        const teamScores = calculateTeamScores(filteredData);
        
        const resultsBox = document.getElementById('results-box');
        resultsBox.innerHTML = '';

        if (activeViewMode === 'all' || activeViewMode === 'teams') {
          const teamSection = document.createElement('div');
          teamSection.innerHTML = renderTeamResultsHTML(teamScores);
          resultsBox.appendChild(teamSection);
        }

        if (activeViewMode === 'all' || activeViewMode === 'indiv') {
          const indivSection = document.createElement('div');
          indivSection.innerHTML = renderResultsTableHTML(filteredData, distance);
          resultsBox.appendChild(indivSection);
        }
    }

    function normalizeSchoolName(schoolName) {
        if (!schoolName) return 'Unknown';
        let normalized = schoolName.toLowerCase().trim();
        normalized = normalized.replace(/\s+(high\s+)?school\s*$/i, '').replace(/\s+hs\s*$/i, '').trim();
        return normalized.split(/\s+/).map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
    }

    function calculateTeamScores(results) {
        const teamMap = {};
        results.forEach(result => {
            const school = normalizeSchoolName(result.school_name || result.school || 'Unknown');
            if (!teamMap[school]) teamMap[school] = [];
            teamMap[school].push(result);
        });

        const scoringTeamNames = new Set(
            Object.entries(teamMap).filter(([, athletes]) => athletes.length >= 5).map(([s]) => s)
        );

        const scoringField = results
            .filter(r => scoringTeamNames.has(normalizeSchoolName(r.school_name || r.school || 'Unknown')))
            .sort((a, b) => {
                const placeA = parseInt(a.place) || 999;
                const placeB = parseInt(b.place) || 999;
                if (placeA !== placeB) return placeA - placeB;
                return (parseFloat(a.time) || 0) - (parseFloat(b.time) || 0);
            });

        scoringField.forEach((runner, index) => { runner.scoringPlace = index + 1; });

        const scores = [];
        Object.entries(teamMap).forEach(([school, athletes]) => {
            if (athletes.length < 5) return;
            const sorted = athletes.slice().sort((a, b) => (a.scoringPlace || 999) - (b.scoringPlace || 999));
            const topFive = sorted.slice(0, 5);
            const score = topFive.reduce((sum, a) => sum + (a.scoringPlace || 999), 0);
            
            const top5Times = topFive.map(a => parseFloat(a.time)).filter(t => !isNaN(t) && t > 0);
            const teamAvg = top5Times.length === 5 ? top5Times.reduce((s, t) => s + t, 0) / 5 : 0;
            const teamSplit = top5Times.length === 5 ? top5Times[4] - top5Times[0] : 0;

            scores.push({ 
              school, score, teamAvg, teamSplit, 
              sixthPlace: sorted[5]?.scoringPlace ?? 999, 
              seventhPlace: sorted[6]?.scoringPlace ?? 999, 
              athletes: topFive 
            });
        });

        return scores.sort((a, b) => {
            if (a.score !== b.score) return a.score - b.score;
            if (a.sixthPlace !== b.sixthPlace) return a.sixthPlace - b.sixthPlace;
            return a.seventhPlace - b.seventhPlace;
        });
    }

    // ==========================================
    // APP-STYLE RENDERING HTML GENERATORS
    // ==========================================

    function renderTeamResultsHTML(teamScores) {
        if (!teamScores || teamScores.length === 0) {
          return activeViewMode === 'teams' ? '<div style="text-align:center; padding:20px; color:var(--text-secondary);">No team scores available (minimum 5 finishers required).</div>' : '';
        }

        let html = `<div class="app-list">
                      <div class="list-header">Team Standings</div>`;
        
        teamScores.forEach((team, index) => {
            const schoolSlug = slugify(team.school);
            const logoUrl = `/assets/team logos/${schoolSlug}.png`;

            const scorersHtml = team.athletes.map(a => 
              `<span class="scorer-badge">#${a.scoringPlace != null ? a.scoringPlace : a.place}</span>`
            ).join('');

            html += `
            <div class="list-item">
                <div class="item-place">${index + 1}</div>
                <div class="item-avatar">
                    <img src="${logoUrl}" alt="${team.school}" onerror="this.src='/assets/images/logob.png'" />
                </div>
                <div class="item-details">
                    <div class="item-name">${team.school}</div>
                    <div class="item-meta" style="margin-bottom:4px;">Avg: ${formatTime(team.teamAvg)} • Split: ${formatTime(team.teamSplit)}</div>
                    <div>${scorersHtml}</div>
                </div>
                <div class="item-score">${team.score}</div>
            </div>`;
        });
        
        return html + `</div>`;
    }

    function renderResultsTableHTML(results, distanceMeters) {
        if (!results || results.length === 0) {
            return '<div style="text-align:center; padding:20px; color:var(--text-secondary);">No individual results found.</div>';
        }

        let html = `<div class="app-list">
                      <div class="list-header">Individual Results</div>`;

        results.forEach((runner, index) => {
            const timeSeconds = runner.time ? parseFloat(runner.time) : 0; 
            const athleteName = runner.athlete_name || runner.name || 'Unknown';
            const rawSchool = runner.school_name || runner.school || runner.school_slug || 'Unknown';
            const schoolSlug = runner.school_slug || slugify(normalizeSchoolName(rawSchool));
            const athleteHref = `athlete.html?name=${encodeURIComponent(athleteName)}&school=${encodeURIComponent(schoolSlug)}`;
            
            const logoUrl = `/assets/team logos/${schoolSlug}.png`;
            const grade = formatGrade(runner.gradYear || runner.grade);
            const pace = calculatePacePerMile(timeSeconds, distanceMeters);
            
            // Build the meta string (e.g., "+1pts • Yr: 10 • Pace: 5:45")
            let metaParts = [];
            if (runner.scoringPlace) metaParts.push(`+${runner.scoringPlace}pts`);
            if (grade) metaParts.push(`Yr: ${grade}`);
            metaParts.push(`Pace: ${pace}`);

            html += `
            <div class="list-item">
                <div class="item-place">${runner.place || (index + 1)}</div>
                <div class="item-avatar">
                    <img src="${logoUrl}" alt="${rawSchool}" onerror="this.src='/assets/images/logob.png'" />
                </div>
                <div class="item-details">
                    <a href="${athleteHref}" class="item-name">${athleteName}</a>
                    <a href="school.html?slug=${schoolSlug}" class="item-school">${rawSchool}</a>
                    <div class="item-meta">${metaParts.join(' • ')}</div>
                </div>
                <div class="item-score">${formatTime(timeSeconds)}</div>
            </div>`;
        });
        
        return html + `</div>`;
    }

    // ==========================================
    // EXPORT UTILITIES (CSV/PDF)
    // ==========================================
    function exportToCSV() {
      if (!currentFilteredResults || currentFilteredResults.length === 0) return alert("No results to export.");
      const meetName = currentMeetData ? currentMeetData.name : "Meet_Results";
      const filename = `${slugify(meetName)}_${slugify(activeGender)}_${slugify(activeRaceType)}.csv`;
      let csvRows = [["Place", "Athlete Name", "Grade", "School", "Time", "Pace Per Mile"]];
      const distance = currentFilteredResults.length > 0 ? parseFloat(currentFilteredResults[0].distance) : 5000;
      currentFilteredResults.forEach(r => {
        const t = r.time ? parseFloat(r.time) : 0;
        csvRows.push([ r.place || '', `"${r.athlete_name || r.name || ''}"`, `"${formatGrade(r.gradYear || r.grade)}"`, `"${r.school_name || r.school || ''}"`, `"${formatTime(t)}"`, `"${calculatePacePerMile(t, distance)}"` ]);
      });
      const link = document.createElement("a");
      link.href = encodeURI("data:text/csv;charset=utf-8," + csvRows.map(e => e.join(",")).join("\n"));
      link.download = filename;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }
    
    // PDF export logic kept exactly identical to preserve existing jspdf implementation
    function getBrandColorRgbArray() { try { const r = getComputedStyle(document.documentElement).getPropertyValue('--primary'); const m = r.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i); if(m) { let h = m[1]; if(h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255, (n>>8)&255, n&255]; } return [26, 95, 76]; } catch(e) { return [26, 95, 76]; } }
    async function exportResultsPDF() {
      if (!currentFilteredResults || currentFilteredResults.length === 0) return alert("No results to export.");
      if (typeof window.jspdf === 'undefined') return alert("PDF library loading.");
      const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: 'landscape' }); const bc = getBrandColorRgbArray();
      const meetName = currentMeetData ? currentMeetData.name : "Meet Results";
      
      const drawHeader = () => { doc.setFillColor(bc[0], bc[1], bc[2]); doc.rect(0, 0, doc.internal.pageSize.getWidth(), 5, 'F'); doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(0, 0, 0); doc.text(meetName, 14, 17); };
      
      const teamScores = calculateTeamScores(currentFilteredResults);
      if (teamScores.length > 0) {
        doc.autoTable({ head: [['Place', 'School', 'Score', 'Avg / Split', 'Scoring Top 5']], body: teamScores.map((t, i) => [i + 1, t.school, t.score, `${formatTime(t.teamAvg)} / ${formatTime(t.teamSplit)}`, t.athletes.map(a => `#${a.scoringPlace||a.place} ${a.athlete_name||a.name}`).join(', ')]), startY: 24, margin: { top: 24 }, styles: { fontSize: 8 }, headStyles: { fillColor: bc, textColor: [255, 255, 255] }, didDrawPage: drawHeader });
        doc.addPage();
      }
      const distance = currentFilteredResults.length > 0 ? parseFloat(currentFilteredResults[0].distance) : 5000;
      doc.autoTable({ head: [['Place', 'Name', 'Grade', 'School', 'Time', 'Pace/Mile']], body: currentFilteredResults.map(r => [r.place || '-', r.athlete_name || r.name || '', formatGrade(r.gradYear || r.grade), r.school_name || r.school || '', formatTime(r.time ? parseFloat(r.time) : 0), calculatePacePerMile(r.time ? parseFloat(r.time) : 0, distance)]), startY: 24, margin: { top: 24 }, styles: { fontSize: 8 }, headStyles: { fillColor: bc, textColor: [255, 255, 255] }, didDrawPage: drawHeader });
      doc.save(`${slugify(meetName)}_results.pdf`);
    }
  </script>

  <div id="global-footer"></div>
