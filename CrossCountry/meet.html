      const subtitle = exportSelect && exportSelect !== 'all' ? `Filtered by Team: ${exportSelect}` : '';

      // 2. Safely load the site logo using Fetch & FileReader (Bypasses Canvas CORS issues)
      const getBase64Image = async (url) => {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(blob);
            });
        } catch (e) {
            console.warn("Could not load logo for PDF:", e);
            return null;
        }
      };

      const logoBase64 = await getBase64Image('assets/images/logo.png');

      // 3. Custom PDF Header with Logo and Titles
      const drawHeader = () => {
        // Draw Header Background
        doc.setFillColor(bc[0], bc[1], bc[2]);
        doc.rect(0, 0, doc.internal.pageSize.getWidth(), 24, 'F');

        let textX = 14;
        if (logoBase64) {
          try {
            // Add Logo (Image Data, Format, X, Y, Width, Height)
            doc.addImage(logoBase64, 'PNG', 14, 4, 16, 16);
            textX = 36; // Shift text over to make room for the logo
          } catch (e) {
            console.warn("Failed to draw image to PDF", e);
          }
        }

        // Draw Main Title
        doc.setFontSize(15);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(255, 255, 255); // White text

        // If there is a subtitle, shift the main title up slightly
        const titleY = subtitle ? 11 : 14;
        doc.text(raceTitle, textX, titleY);

        // Draw Subtitle (if a specific team is selected)
        if (subtitle) {
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(220, 220, 220); // Light Gray text
            doc.text(subtitle, textX, 18);
        }
      };

      // 4. Coach's Report extras: storyline blurb + a quick score-comparison bar
      //    chart, drawn straight from the FULL (unfiltered) standings so the
      //    story reflects the whole race even if a single team is selected below.
      let startY = 30; // Push table down to clear the new 24px header

      if (currentFullTeamScores && currentFullTeamScores.length >= 2 && activeViewMode !== 'indiv') {
        const top = currentFullTeamScores[0];
        const second = currentFullTeamScores[1];
        const margin = second.score - top.score;
        const marginText = relay
          ? `by ${formatTime(margin)} over ${second.school}`
          : `by ${margin} point${margin === 1 ? '' : 's'} over ${second.school}`;

        doc.setTextColor(60, 60, 60);
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(10.5);
        doc.text(`${top.school} wins it ${marginText}.`, 14, startY);
        startY += 8;

        // Mini horizontal bar chart comparing the top teams (lower score bar = leader).
        const chartTeams = currentFullTeamScores.slice(0, 6);
        const maxScore = Math.max(...chartTeams.map(t => t.score), 1);
        const chartX = 14, chartW = 120, rowH = 6.2;
        chartTeams.forEach((t, i) => {
          const rowY = startY + i * rowH;
          const barW = Math.max((t.score / maxScore) * chartW, 2);
          doc.setFillColor(230, 230, 230);
          doc.rect(chartX + 46, rowY - 3.6, chartW, 4.6, 'F');
          doc.setFillColor(bc[0], bc[1], bc[2]);
          doc.rect(chartX + 46, rowY - 3.6, barW, 4.6, 'F');
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8);
          doc.setTextColor(30, 30, 30);
          doc.text(String(t.school).slice(0, 24), chartX, rowY);
          doc.setFont('helvetica', 'normal');
          doc.text(relay ? formatTime(t.score) : String(t.score), chartX + 46 + chartW + 4, rowY);
        });
        startY += chartTeams.length * rowH + 8;
      }

      // 5. Generate the Tables

      // Draw Team / Relay Scores Table (if applicable and not hidden)
      if (hasTeams && activeViewMode !== 'indiv') {
        if (relay) {
          doc.autoTable({
              head: [['Place', 'Relay Team', 'Total Time', 'Avg Leg', 'Legs']],
              body: currentTeamScores.map((t, i) => [i + 1, t.school, formatTime(t.score), formatTime(t.teamAvg), t.athletes.length + (t.complete ? '' : ' (inc.)')]),
              startY: startY,
              margin: { top: 30 },
              styles: { fontSize: 8 },
              headStyles: { fillColor: bc, textColor: [255, 255, 255] },
              alternateRowStyles: { fillColor: [245, 245, 245] },
              didDrawPage: drawHeader
          });
        } else {
          doc.autoTable({
              head: [['Place', 'School', 'Score', 'Avg / Split', 'Scoring Top 5']],
              body: currentTeamScores.map((t, i) => [i + 1, t.school, t.score, `${formatTime(t.teamAvg)} / ${formatTime(t.teamSplit)}`, t.athletes.map(a => `${scorerBadgeText(a)} ${a.athlete_name||a.name}`).join(', ')]),
              startY: startY,
              margin: { top: 30 },
              styles: { fontSize: 8 },
              headStyles: { fillColor: bc, textColor: [255, 255, 255] },
              alternateRowStyles: { fillColor: [245, 245, 245] },
              didDrawPage: drawHeader
          });
        }
        startY = doc.lastAutoTable.finalY + 10;
      }

      // Draw Individual Results Table (if not hidden)
      if (activeViewMode !== 'teams' && hasIndiv) {
          const indivHead = relay
            ? [['Place', 'Name', 'Relay Team', 'School', 'Time', 'Pace/Mile']]
            : [['Place', 'Name', 'Grade', 'School', 'Time', 'Pace/Mile']];
          doc.autoTable({
              head: indivHead,
              body: currentFilteredResults.map(r => {
                const t = r.time ? parseFloat(r.time) : 0;
                const school = r.school_name || r.school || '';
                const pace = calculatePacePerMile(t, distance);
                return relay
                  ? [r.place || '-', r.athlete_name || r.name || '', r.relay_team || '', school, formatTime(t), pace]
                  : [r.place || '-', r.athlete_name || r.name || '', formatGrade(r.gradYear || r.grade), school, formatTime(t), pace];
              }),
              startY: startY,
              margin: { top: 30 },
              styles: { fontSize: 8 },
              headStyles: { fillColor: bc, textColor: [255, 255, 255] },
              alternateRowStyles: { fillColor: [245, 245, 245] },
              didDrawPage: drawHeader
          });
      }

      doc.save(`${slugify(raceTitle)}.pdf`);
    }
  </script>

  <div id="global-footer"></div>

</body>
