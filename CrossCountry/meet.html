<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Results | Mountain State Miles</title>

  <link rel="icon" type="image/png" href="assets/Favicon Generator/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="assets/Favicon Generator/favicon.svg" />
  <link rel="shortcut icon" href="assets/Favicon Generator/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/Favicon Generator/apple-touch-icon.png" />
  <link rel="manifest" href="assets/Favicon Generator/site.webmanifest" />

  <meta name="description" content="WV cross country running results, rankings, team scores, and meet data — Mountain State Miles." />
  <meta name="keywords" content="WVXC, WV Track, West Virginia Running, Cross Country Results, WV HS Running, Mountain State Miles" />
  <link rel="stylesheet" href="/assets/main.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.1/jspdf.plugin.autotable.min.js"></script>
  <script src="/assets/components.js" defer></script>
  <script src="/assets/theme-toggle.js" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      if (slug) {
        document.title = `${slug.replace(/-/g, " ")} – Meet Results | Mountain State Miles`;
      }
    });
  </script>
  <script src="meet-analytics.js" defer></script>


  <style>
    /* ============================================
       Modern Meet Page Styles
       ============================================ */
    @font-face {
      font-family: 'Aqeon Demo';
      src: url('../assets/Aqeon Demo Font.ttf') format('truetype');
    }
    :root {
      --font-display: 'Aqeon Demo', sans-serif;
      --radius-lg: 14px;
      --radius-md: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    .content-section {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    /* --- Hero Header --- */
    .meet-header {
      background: var(--bg-primary);
      padding: 24px 16px;
      text-align: center;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin-bottom: 24px;
      box-shadow: 0 4px 16px var(--shadow-light);
    }
    .meet-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      color: var(--text-primary);
      margin: 0 0 8px;
      line-height: 1.1;
    }
    .meet-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .meet-stats {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .stat-item {
      text-align: center;
      padding: 0 12px;
    }
    .stat-value {
      display: block;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-tertiary);
      letter-spacing: 0.05em;
    }

    /* --- Expected Teams Dropdown --- */
    .expected-teams-details {
      margin-top: 20px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      text-align: left;
    }
    .expected-teams-details summary {
      padding: 12px 16px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .expected-teams-details summary::-webkit-details-marker {
      display: none;
    }
    .expected-teams-details summary::after {
      content: '▼';
      font-size: 0.8em;
      transition: transform 0.2s;
    }
    .expected-teams-details[open] summary::after {
      transform: rotate(180deg);
    }
    .expected-teams-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 16px 16px;
    }
    .expected-team-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .expected-team-chip:hover {
      background: var(--bg-secondary);
      border-color: var(--text-primary);
    }
    .expected-team-chip img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: contain;
      background: #fff;
    }

    /* --- Empty States (Upcoming/Past meets) --- */
    .empty-state-container {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .empty-state-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .empty-state-text {
      color: var(--text-secondary);
      font-size: 1rem;
    }
    .empty-state-image {
      max-width: 200px;
      margin: 0 auto 20px;
    }

    /* Theme logic for the runner image */
    .runner-light { display: block; margin: 0 auto 20px; }
    .runner-dark { display: none; margin: 0 auto 20px; }

    html[data-theme='dark'] .runner-light,
    body.dark-theme .runner-light { display: none; }
    html[data-theme='dark'] .runner-dark,
    body.dark-theme .runner-dark { display: block; }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]):not(.light-theme) .runner-light { display: none; }
      html:not([data-theme="light"]):not(.light-theme) .runner-dark { display: block; }
    }

    /* --- App-Style Tabs (Gender & Views) --- */
    .app-tabs-container {
      margin-bottom: 24px;
      align-items: center;
    }
    .app-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 2px solid var(--border);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
      align-items: center;
    }
    .app-tabs::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    .app-tab {
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      white-space: nowrap;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .app-tab.active {
      color: var(--text-primary);
    }
    .app-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--text-primary);
    }

    /* --- Selectors (Divisions) --- */
    .division-chips {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .division-chips::-webkit-scrollbar { display: none; }

    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }

    /* --- Search & Actions --- */
    .utility-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--text-primary);
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
    }
    .action-btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn:hover { border-color: var(--text-primary); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* --- App-Style List Layout (The Core Update) --- */
    .app-list {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 32px;
      box-shadow: 0 2px 8px var(--shadow-light);
    }

    .list-item {
      display: flex;
      align-items: stretch; /* Stretches the place box to full height */
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
      transition: background 0.2s;
    }
    .list-item:last-child {
      border-bottom: none;
    }
    .list-item:hover {
      background: var(--bg-secondary);
    }

    /* Placement Block */
    .item-place {
      width: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--text-primary);
      color: var(--bg-primary);
      font-weight: 800;
      font-size: 1.15rem;
    }

    /* Avatar / Logo */
    .item-avatar {
      display: flex;
      align-items: center;
      padding-left: 12px;
    }
    .item-avatar img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: contain;
      background: #fff; /* Keep white bg for logos to pop */
      padding: 2px;
      border: 1px solid var(--border);
    }

    /* Middle Details */
    .item-details {
      flex: 1;
      padding: 12px;
      min-width: 0; /* Prevents flex blowout on long names */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .item-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-primary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-school {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      margin: 2px 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      font-weight: 600;
    }

    /* Right Side (Time / Score) */
    .item-score {
      padding: 12px 16px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    /* Mini Scorer Badges */
    .scorer-badge {
      display: inline-block;
      padding: 2px 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      margin-right: 4px;
      color: var(--text-secondary);
    }

    /* ============================================
       Export Menu (dropdown)
       ============================================ */
    .export-menu-wrap { position: relative; }
    .export-toggle-btn {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-color: var(--text-primary);
    }
    .export-toggle-btn:hover { opacity: 0.9; border-color: var(--text-primary); }
    .export-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 240px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px var(--shadow-light);
      overflow: hidden;
      z-index: 40;
      display: none;
    }
    .export-menu.open { display: block; }
    .export-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .export-menu-item:last-child { border-bottom: none; }
    .export-menu-item:hover { background: var(--bg-secondary); }
    .export-menu-item .emi-icon { font-size: 1.05rem; width: 22px; text-align: center; flex-shrink: 0; }
    .export-menu-item .emi-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .export-menu-item .emi-title { color: var(--text-primary); }
    .export-menu-item .emi-sub { font-size: 0.72rem; font-weight: 500; color: var(--text-tertiary); white-space: normal; }

    /* ============================================
       Coach Analysis Panel
       ============================================ */
    .analysis-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow-light);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .analysis-card .list-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .analysis-card-body { padding: 16px; }

    .storyline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .storyline-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .storyline-item .si-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }
    .storyline-item .si-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
    }
    .storyline-item .si-text b { color: var(--xc-primary, var(--text-primary)); }

    .pack-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .pack-row:last-child { border-bottom: none; }
    .pack-rank {
      width: 22px;
      flex-shrink: 0;
      font-weight: 800;
      color: var(--text-tertiary);
      font-size: 0.85rem;
    }
    .pack-label {
      width: 130px;
      flex-shrink: 0;
      min-width: 0;
    }
    .pack-label .pl-name {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pack-label .pl-sub {
      font-size: 0.68rem;
      color: var(--text-tertiary);
      font-weight: 600;
    }
    .pack-track {
      flex: 1;
      height: 20px;
      background: var(--bg-secondary);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      min-width: 60px;
    }
    .pack-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      border-radius: 6px;
      background: var(--xc-primary, #0284c7);
      opacity: 0.85;
      min-width: 3px;
    }
    .pack-split-label {
      width: 64px;
      flex-shrink: 0;
      text-align: right;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .h2h-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .h2h-controls select {
      flex: 1;
      min-width: 140px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .h2h-vs {
      font-weight: 800;
      color: var(--text-tertiary);
      font-size: 0.8rem;
    }
    .h2h-table { width: 100%; border-collapse: collapse; }
    .h2h-table th {
      text-align: left;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-tertiary);
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .h2h-table th.h2h-num, .h2h-table td.h2h-num { text-align: center; }
    .h2h-table td {
      padding: 8px;
      font-size: 0.85rem;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .h2h-table tr:last-child td { border-bottom: none; }
    .h2h-win { font-weight: 800; color: var(--xc-primary, #0284c7); }
    .h2h-summary {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg-secondary);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
    }

    .displacer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .displacer-item:last-child { border-bottom: none; }
    .displacer-place {
      width: 26px;
      flex-shrink: 0;
      text-align: center;
      font-weight: 800;
      color: var(--text-tertiary);
    }
    .displacer-item .d-name { font-weight: 700; color: var(--text-primary); }
    .displacer-item .d-school { color: var(--text-secondary); font-size: 0.78rem; }
    .displacer-tag {
      margin-left: auto;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-tertiary);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 6px;
      white-space: nowrap;
    }

    /* Toast (used for Copy Recap confirmation) */
    #msm-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: var(--text-primary);
      color: var(--bg-primary);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 8px 24px var(--shadow-light);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    #msm-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Print Stylesheet */
    @media print {
      body { background: #fff !important; color: #000 !important; }
      #global-header, #global-footer, .app-tabs-container, .utility-bar, #expected-teams-container { display: none !important; }
      .app-list { box-shadow: none; border: 1px solid #ccc; }
      .item-place { background: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>

<body>

  <div id="global-header"></div>
  <script src="/assets/msm-loader.js"></script>

  <main class="content-section">

      <div class="meet-header">
        <h1 class="meet-title" id="meet-title">Loading Meet...</h1>
        <div id="meet-meta" class="meet-subtitle">Retrieving data...</div>

        <div class="meet-stats" id="meet-stats" style="display:none;">
          <div class="stat-item"><span class="stat-value" id="stat-races">-</span><span class="stat-label">Races</span></div>
          <div class="stat-item"><span class="stat-value" id="stat-teams">-</span><span class="stat-label">Teams</span></div>
          <div class="stat-item"><span class="stat-value" id="stat-athletes">-</span><span class="stat-label">Athletes</span></div>
        </div>

        <!-- Expected Teams Dropdown -->
        <div id="expected-teams-container" style="display:none;">
          <details class="expected-teams-details">
            <summary>Expected Teams</summary>
            <div class="expected-teams-list" id="expected-teams-list"></div>
          </details>
        </div>
      </div>

      <div id="error" class="error-message" style="display:none; text-align: center; color: var(--danger); padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; margin-bottom: 20px;"></div>

      <div id="empty-state" style="display:none;"></div>

      <div id="selector" style="display:none;">

        <div class="app-tabs-container">
          <div class="app-tabs">
            <button class="app-tab active" id="view-all-btn">All Results</button>
            <button class="app-tab" id="view-teams-btn">Team Scores</button>
            <button class="app-tab" id="view-indiv-btn">Individual</button>
            <button class="app-tab" id="view-analysis-btn">📈 Coach Analysis</button>
          </div>
        </div>

        <div class="app-tabs-container">
          <div class="app-tabs">
            <button id="tab-boys" class="app-tab active">Boys</button>
            <button id="tab-girls" class="app-tab">Girls</button>
          </div>
          <div class="division-chips" id="race-button-wrap"></div>
        </div>

        <div class="utility-bar">
          <div class="search-box">
            <i>🔍</i>
            <input type="text" id="search-input" placeholder="Search athlete or school..." />
          </div>
          <select id="team-export-select" class="action-btn" onchange="renderTableForSelection()" style="outline: none;">
              <option value="all">All Teams</option>
          </select>
          <div class="export-menu-wrap" id="export-menu-wrap">
            <button class="action-btn export-toggle-btn" id="export-toggle-btn" onclick="toggleExportMenu()">⬇️ Export</button>
            <div class="export-menu" id="export-menu">
              <button class="export-menu-item" onclick="exportResultsPDF(); closeExportMenu();">
                <span class="emi-icon">📄</span>
                <span class="emi-text"><span class="emi-title">Coach's Report (PDF)</span><span class="emi-sub">Branded recap with storyline & score chart</span></span>
              </button>
              <button class="export-menu-item" onclick="exportToCSV(); closeExportMenu();">
                <span class="emi-icon">📊</span>
                <span class="emi-text"><span class="emi-title">Spreadsheet (CSV)</span><span class="emi-sub">Open in Excel or Google Sheets</span></span>
              </button>
              <button class="export-menu-item" onclick="exportRawDataJSON(); closeExportMenu();">
                <span class="emi-icon">🗂️</span>
                <span class="emi-text"><span class="emi-title">Raw Data (JSON)</span><span class="emi-sub">For your own stats tools</span></span>
              </button>
              <button class="export-menu-item" onclick="exportShareCard(); closeExportMenu();">
                <span class="emi-icon">🖼️</span>
                <span class="emi-text"><span class="emi-title">Share Card (Image)</span><span class="emi-sub">Postable graphic for team chat/socials</span></span>
              </button>
              <button class="export-menu-item" onclick="copyRecapToClipboard(); closeExportMenu();">
                <span class="emi-icon">📋</span>
                <span class="emi-text"><span class="emi-title">Copy Recap Text</span><span class="emi-sub">Paste into a text or email</span></span>
              </button>
              <button class="export-menu-item" onclick="window.print(); closeExportMenu();">
                <span class="emi-icon">🖨️</span>
                <span class="emi-text"><span class="emi-title">Print</span><span class="emi-sub">Printer-friendly results</span></span>
              </button>
            </div>
          </div>
        </div>

      </div>

    <div id="results-box"></div>
  </main>

  <div id="msm-toast"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-helpers.js"></script>

  <script>
    // ==========================================
    // 1. UTILITY & FORMATTING FUNCTIONS
    // ==========================================

    function formatTime(totalSeconds) {
      if (typeof totalSeconds !== 'number' || isNaN(totalSeconds) || totalSeconds <= 0) {
        return 'N/T';
      }
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${seconds.toFixed(2).padStart(5, '0')}`;
    }

    // Text for a scorer badge: the athlete's actual finish PLACE (not the points
    // they contributed). Displacement scoring can make those two numbers differ
    // (non-scorers still consume a place), so when they diverge we show the real
    // place plus the points earned in parentheses for clarity.
    function scorerBadgeText(a) {
      const place = a.place != null && a.place !== '' ? a.place : (a.scoringPlace != null ? a.scoringPlace : '-');
      if (a.scoringPlace != null && parseInt(a.place) !== a.scoringPlace) {
        return `#${place} (${a.scoringPlace}pt${a.scoringPlace === 1 ? '' : 's'})`;
      }
      return `#${place}`;
    }

    function calculatePacePerMile(totalSeconds, distanceMeters) {
      if (!totalSeconds || !distanceMeters) return '-';
      const MILE_IN_METERS = 1609.34;
      const secondsPerMile = (totalSeconds / distanceMeters) * MILE_IN_METERS;
      return formatTime(secondsPerMile);
    }

    function formatGrade(gradYear) {
      if (!gradYear) return '';
      const currentSeasonYear = 2025;
      const diff = gradYear - (currentSeasonYear + 1);
      const gradeMap = { 0: '12', 1: '11', 2: '10', 3: '9', 4: '8', 5: '7', 6: '6' };
      return gradeMap[diff] || gradYear;
    }

    function slugify(name) {
      if (!name) return '';
      return name.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    }

    // Brand color for PDF header. Reuses the site-wide helper if present, else
    // falls back to MSM blue. (Previously this helper was called but never
    // defined, which threw a ReferenceError and silently killed the PDF export.)
    function getBrandColorRgbArray() {
      try {
        if (typeof window.getBrandColorRgbArray === 'function' && window.getBrandColorRgbArray !== getBrandColorRgbArray) {
          const c = window.getBrandColorRgbArray();
          if (Array.isArray(c) && c.length === 3) return c;
        }
        // Pull the site's primary color from CSS if it's defined as an rgb() value.
        const cssVar = getComputedStyle(document.documentElement).getPropertyValue('--xc-primary').trim();
        const match = cssVar.match(/\d+/g);
        if (match && match.length >= 3) return [parseInt(match[0]), parseInt(match[1]), parseInt(match[2])];
      } catch (e) { /* fall through to default */ }
      return [2, 132, 199]; // #0284c7
    }

    // Quote a value for CSV: wrap in double quotes and escape embedded quotes.
    function csvCell(value) {
      const s = value == null ? '' : String(value);
      return `"${s.replace(/"/g, '""')}"`;
    }

    // Trigger a client-side file download from an in-memory Blob. Using a Blob
    // (instead of a data: URI) avoids truncation on '#' and mangled commas that
    // broke the old encodeURI-based CSV export.
    function downloadBlob(filename, mime, content) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function normalizeGender(r) {
      const g = String(r.gender || '').trim().toUpperCase();
      if (['M', 'BOYS', 'BOY', 'MALE', 'B'].includes(g)) return 'M';
      if (['F', 'GIRLS', 'GIRL', 'FEMALE', 'G'].includes(g)) return 'F';
      const raceText = (r.race_type || r.division || r.event || r.event_name || '').toLowerCase();
      if (raceText.includes('girl') || raceText.includes('female') || raceText.includes('women')) return 'F';
      if (raceText.includes('boy') || raceText.includes('male') || raceText.includes('men')) return 'M';
      return 'M';
    }

    function normalizeRaceType(r) {
      let raw = r.race_type || r.division || r.event || r.event_name || 'Varsity 5K';
      if (typeof raw !== 'string') return 'Varsity 5K';
      raw = raw.trim();
      if (!raw) return 'Varsity 5K';
      return raw.split(/\s+/).map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ')
        .replace(/\b5k\b/i, '5K').replace(/\b3k\b/i, '3K').replace(/\bJv\b/g, 'JV').replace(/\bMs\b/g, 'Middle School')
        .replace(/\bAaaa\b/g, 'AAAA').replace(/\bAaa\b/g, 'AAA').replace(/\bAa\b/g, 'AA');
    }

    // ==========================================
    // 2. STATE MANAGEMENT
    // ==========================================
    let currentMeetData = null;
    let allResults = [];
    let activeGender = 'M';
    let activeRaceType = null;
    let currentFilteredResults = [];
    let currentTeamScores = [];   // team standings for the active race (post-filter)
    let activeViewMode = 'all'; // 'all', 'teams', 'indiv', 'analysis'
    let currentRaceData = [];        // FULL field for the active race (unfiltered by search/team select) — used for analysis
    let currentFullTeamScores = [];  // FULL team standings for the active race (unfiltered by team select) — used for analysis
    let currentIsRelay = false;
    let h2hTeamA = null;
    let h2hTeamB = null;

    // ==========================================
    // 3. MAIN INITIALIZATION
    // ==========================================

    window.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");

      const errorDiv = document.getElementById("error");
      const emptyStateDiv = document.getElementById("empty-state");
      const metaDiv = document.getElementById("meet-meta");
      const selectorDiv = document.getElementById("selector");

      if (!slug) {
        errorDiv.style.display = "block";
        errorDiv.textContent = "No meet specified. Please return to the Meets page.";
        document.dispatchEvent(new Event("MSMDataLoaded"));
        return;
      }

      try {
        currentMeetData = await window.getMeetBySlug(slug);
        if (!currentMeetData) throw new Error("Meet not found.");

        // --- UPDATE TITLE AND HEADER HERE ---
        const meetName = currentMeetData.name || `${slug.replace(/-/g, " ")} – Meet Results`;

        // Set browser tab title
        document.title = `${meetName} | Mountain State Miles`;

        // Set main page header
        document.getElementById("meet-title").textContent = meetName;
        // ------------------------------------

        metaDiv.innerHTML = `<strong>${formatMeetDate(currentMeetData.date)}</strong> &nbsp;•&nbsp; ${currentMeetData.location || 'Location Unknown'}`;

        // --- POPULATE EXPECTED TEAMS ---
        const teamsList = currentMeetData.teams || currentMeetData.expected_teams || [];
        if (teamsList.length > 0) {
            const etContainer = document.getElementById("expected-teams-container");
            const etList = document.getElementById("expected-teams-list");
            etContainer.style.display = "block";

            teamsList.forEach(team => {
                const teamName = typeof team === 'object' ? (team.name || team.school) : team;
                const teamSlug = typeof team === 'object' && team.slug ? team.slug : slugify(teamName);
                const logoUrl = `/assets/team logos/${teamSlug}.png`;

                const chip = document.createElement("a");
                chip.className = "expected-team-chip";
                chip.href = `school.html?slug=${teamSlug}`;
                chip.innerHTML = `
                    <img src="${logoUrl}" alt="${teamName}" onerror="this.src='/assets/images/msmrunner.svg'" />
                    ${teamName}
                `;
                etList.appendChild(chip);
            });
        }

        const schools = await window.getAllSchools();
        const schoolSlugToName = {};
        if (schools && schools.length) {
          schools.forEach(s => { schoolSlugToName[s.slug || ''] = s.name || s.slug; });
        }

        allResults = await window.getResultsByMeet(slug);

        // --- HANDLE NO RESULTS (UPCOMING / PAST LOGIC) ---
        if (!allResults || allResults.length === 0) {
            const meetDateObj = new Date(currentMeetData.date);
            const todayObj = new Date();

            emptyStateDiv.style.display = "block";

            if (meetDateObj > todayObj) {
                // Meet is in the future
                emptyStateDiv.innerHTML = `
                  <div class="empty-state-container">
                    <h3 class="empty-state-title">Upcoming on ${formatMeetDate(currentMeetData.date)}</h3>
                    <p class="empty-state-text">Results will be posted here as soon as the meet concludes.</p>
                  </div>
                `;
            } else {
                // Meet is in the past
                emptyStateDiv.innerHTML = `
                  <div class="empty-state-container">
                    <img src="/assets/images/MSM runner.svg" alt="Running around" class="empty-state-image runner-light" />
                    <img src="/assets/images/msmrunner.svg" alt="Running around" class="empty-state-image runner-dark" />
                    <h3 class="empty-state-title">We are running around to get these results!</h3>
                    <p class="empty-state-text">Check back soon, our team is working on uploading the data.</p>
                  </div>
                `;
            }
            return;
        }

        allResults.forEach(r => {
          r.normalizedGender = normalizeGender(r);
          r.normalizedRaceType = normalizeRaceType(r);
          if ((!r.school_name && !r.school) && r.school_slug) {
            r.school_name = schoolSlugToName[r.school_slug] || r.school_slug;
          }
        });

        // Populate Top Stats
        const uniqueRaces = new Set(allResults.map(r => r.normalizedRaceType)).size;
        const uniqueTeams = new Set(allResults.map(r => r.school_slug || r.school_name || r.school)).size;

        document.getElementById('stat-races').textContent = uniqueRaces || '-';
        document.getElementById('stat-teams').textContent = uniqueTeams || '-';
        document.getElementById('stat-athletes').textContent = allResults.length || '-';
        document.getElementById('meet-stats').style.display = 'flex';

        selectorDiv.style.display = "block";

        setupSearchAndControls();
        setupGenderTabs();
        document.getElementById("tab-boys").click();

      } catch (err) {
        console.error(err);
        errorDiv.style.display = "block";
        errorDiv.textContent = "Error loading meet data: " + err.message;
      } finally {
        document.dispatchEvent(new Event("MSMDataLoaded"));
      }
    });

    function formatMeetDate(dateStr) {
      if (!dateStr) return "Date TBD";
      const parts = String(dateStr).split("T")[0].split("-");
      if (parts.length === 3) {
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        return new Date(year, month, day).toLocaleDateString(undefined, {
          weekday: "short", month: "short", day: "numeric", year: "numeric",
        });
      }
      return new Date(dateStr).toLocaleDateString();
    }

    // ==========================================
    // 4. UI CONTROLS & SEARCH
    // ==========================================

    function setupSearchAndControls() {
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', renderTableForSelection);
      }

      const btnAll = document.getElementById('view-all-btn');
      const btnTeams = document.getElementById('view-teams-btn');
      const btnIndiv = document.getElementById('view-indiv-btn');
      const btnAnalysis = document.getElementById('view-analysis-btn');

      const resetViewBtns = () => [btnAll, btnTeams, btnIndiv, btnAnalysis].forEach(b => b.classList.remove('active'));

      btnAll.addEventListener('click', () => { resetViewBtns(); btnAll.classList.add('active'); activeViewMode = 'all'; renderTableForSelection(); });
      btnTeams.addEventListener('click', () => { resetViewBtns(); btnTeams.classList.add('active'); activeViewMode = 'teams'; renderTableForSelection(); });
      btnIndiv.addEventListener('click', () => { resetViewBtns(); btnIndiv.classList.add('active'); activeViewMode = 'indiv'; renderTableForSelection(); });
      btnAnalysis.addEventListener('click', () => { resetViewBtns(); btnAnalysis.classList.add('active'); activeViewMode = 'analysis'; h2hTeamA = null; h2hTeamB = null; renderTableForSelection(); });

      // Close the export dropdown on outside click / Escape.
      document.addEventListener('click', (e) => {
        const wrap = document.getElementById('export-menu-wrap');
        if (wrap && !wrap.contains(e.target)) closeExportMenu();
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeExportMenu(); });
    }

    function toggleExportMenu() {
      document.getElementById('export-menu')?.classList.toggle('open');
    }
    function closeExportMenu() {
      document.getElementById('export-menu')?.classList.remove('open');
    }

    function showToast(message) {
      const toast = document.getElementById('msm-toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function setupGenderTabs() {
        const btnBoys = document.getElementById('tab-boys');
        const btnGirls = document.getElementById('tab-girls');

        const resetTabs = () => { [btnBoys, btnGirls].forEach(b => b.classList.remove('active')); };

        btnBoys.addEventListener('click', () => {
            resetTabs(); btnBoys.classList.add('active'); activeGender = 'M'; updateRaceButtons();
        });

        btnGirls.addEventListener('click', () => {
            resetTabs(); btnGirls.classList.add('active'); activeGender = 'F'; updateRaceButtons();
        });
    }

    function updateRaceButtons() {
        const container = document.getElementById('race-button-wrap');
        container.innerHTML = '';
        document.getElementById('results-box').innerHTML = '';

        const relevantResults = allResults.filter(r => r.normalizedGender === activeGender);
        if (relevantResults.length === 0) return;

        const raceTypes = [...new Set(relevantResults.map(r => r.normalizedRaceType))].sort();

        raceTypes.forEach((type, index) => {
            const btn = document.createElement('button');
            btn.className = 'chip';
            btn.textContent = type;

            btn.onclick = () => {
                Array.from(container.children).forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                activeRaceType = type;
                renderTableForSelection();
            };
            container.appendChild(btn);
            if (index === 0) btn.click();
        });
    }

    function renderTableForSelection() {
        const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
        const exportSelect = document.getElementById('team-export-select')?.value || 'all';

        // 1. Grab the full race data (DO NOT filter by search yet)
        let raceData = allResults.filter(r =>
            r.normalizedGender === activeGender && r.normalizedRaceType === activeRaceType
        );

        // 2. Sort by actual place/time
        raceData.sort((a, b) => {
            if (a.place && b.place) return parseInt(a.place) - parseInt(b.place);
            return parseFloat(a.time) - parseFloat(b.time);
        });

        // 3. Calculate team scores & scoring places based on the ENTIRE field.
        //    Relay races (results carrying a relay_team tag) are scored by summing
        //    each relay squad's leg times instead of the usual place-sum scoring.
        const relay = isRelayRace(raceData);
        const teamScores = relay ? calculateRelayScores(raceData) : calculateTeamScores(raceData);
        const distance = raceData.length > 0 ? parseFloat(raceData[0].distance) : 5000;

        // 4. Update the Export Dropdown with the teams in this race
        updateExportDropdown(teamScores);

        // Stash the FULL (unfiltered) field + standings for the Coach Analysis panel,
        // so analysis always reflects the whole race regardless of search/team filter.
        currentRaceData = raceData;
        currentFullTeamScores = teamScores;
        currentIsRelay = relay;

        // 5. NOW apply search and team filters for what is displayed and exported
        let filteredData = raceData;
        if (query) {
          filteredData = filteredData.filter(r => {
            const name = (r.athlete_name || r.name || '').toLowerCase();
            const school = (r.school_name || r.school || '').toLowerCase();
            const squad = (r.relay_team || '').toLowerCase();
            return name.includes(query) || school.includes(query) || squad.includes(query);
          });
        }
        if (exportSelect !== 'all') {
            // Match on the dropdown's team identity: relay squad name for relays,
            // else the normalized school name.
            filteredData = filteredData.filter(r =>
                (relay ? (r.relay_team || '') : normalizeSchoolName(r.school_name || r.school || 'Unknown')) === exportSelect
            );
        }

        currentFilteredResults = filteredData;

        // Keep the team standings that match the current team filter around for export.
        currentTeamScores = (exportSelect !== 'all')
            ? teamScores.filter(t => t.school === exportSelect)
            : teamScores;

        const resultsBox = document.getElementById('results-box');
        resultsBox.innerHTML = '';

        if (activeViewMode === 'all' || activeViewMode === 'teams') {
          const teamSection = document.createElement('div');
          teamSection.innerHTML = renderTeamResultsHTML(currentTeamScores);
          resultsBox.appendChild(teamSection);
        }

        if (activeViewMode === 'all' || activeViewMode === 'indiv') {
          const indivSection = document.createElement('div');
          indivSection.innerHTML = renderResultsTableHTML(filteredData, distance);
          resultsBox.appendChild(indivSection);
        }

        if (activeViewMode === 'analysis') {
          const analysisSection = document.createElement('div');
          analysisSection.innerHTML = renderAnalysisHTML(teamScores, raceData, relay, distance);
          resultsBox.appendChild(analysisSection);
          setupHeadToHeadControls(teamScores, relay);
        }
    }

    function updateExportDropdown(teamScores) {
        const select = document.getElementById('team-export-select');
        if (!select) return;
        const currentVal = select.value;
        select.innerHTML = '<option value="all">All Teams</option>';

        const sortedTeams = teamScores.map(t => t.school).sort();
        sortedTeams.forEach(team => {
            const opt = document.createElement('option');
            opt.value = team;
            opt.textContent = team;
            select.appendChild(opt);
        });

        // Retain selection if they switch tabs but the team is still present
        if (sortedTeams.includes(currentVal)) {
            select.value = currentVal;
        }
    }

    function normalizeSchoolName(schoolName) {
        if (!schoolName) return 'Unknown';
        let normalized = schoolName.toLowerCase().trim();
        normalized = normalized.replace(/\s+(high\s+)?school\s*$/i, '').replace(/\s+hs\s*$/i, '').trim();
        return normalized.split(/\s+/).map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
    }

    // Meets that use true NFHS scoring: non-scorers (incomplete teams / extra
    // individuals) are removed and everyone below moves up, so scoring places are
    // contiguous. Every other meet uses displacement scoring, where a non-scorer
    // still occupies a place and the scorers below keep their gapped number.
    const NFHS_SCORING_MEETS = [
      'state-meet',
      '2024-state-meet',
      '25-state-meet',
      // 'class-aaa-region-i',
    ];

    function calculateTeamScores(results) {
        const teamMap = {};
        results.forEach(result => {
            const school = normalizeSchoolName(result.school_name || result.school || 'Unknown');
            if (!teamMap[school]) teamMap[school] = [];
            teamMap[school].push(result);
        });

        const scoringTeamNames = new Set(
            Object.entries(teamMap).filter(([, athletes]) => athletes.length >= 5).map(([s]) => s)
        );

        const meetSlug = new URLSearchParams(window.location.search).get('slug');
        const useNFHS = NFHS_SCORING_MEETS.includes(meetSlug);
        const isScorer = r => scoringTeamNames.has(normalizeSchoolName(r.school_name || r.school || 'Unknown'));

        const byFinish = (a, b) => {
            const placeA = parseInt(a.place) || 999;
            const placeB = parseInt(b.place) || 999;
            if (placeA !== placeB) return placeA - placeB;
            return (parseFloat(a.time) || 0) - (parseFloat(b.time) || 0);
        };

        if (useNFHS) {
            // Contiguous: pull non-scorers out entirely, then number 1..N.
            results.filter(isScorer).sort(byFinish)
                .forEach((runner, index) => { runner.scoringPlace = index + 1; });
        } else {
            // Displacement (default): number over the FULL finish order; non-scorers
            // still consume a place but get no scoringPlace, so they earn no points.
            let counter = 0;
            results.slice().sort(byFinish).forEach(runner => {
                runner.scoringPlace = isScorer(runner) ? ++counter : null;
            });
        }


        const scores = [];
        Object.entries(teamMap).forEach(([school, athletes]) => {
            if (athletes.length < 5) return;
            const sorted = athletes.slice().sort((a, b) => (a.scoringPlace || 999) - (b.scoringPlace || 999));
            const topFive = sorted.slice(0, 5);
            const score = topFive.reduce((sum, a) => sum + (a.scoringPlace || 999), 0);

            const top5Times = topFive.map(a => parseFloat(a.time)).filter(t => !isNaN(t) && t > 0);
            const teamAvg = top5Times.length === 5 ? top5Times.reduce((s, t) => s + t, 0) / 5 : 0;
            const teamSplit = top5Times.length === 5 ? top5Times[4] - top5Times[0] : 0;

            scores.push({
              school, score, teamAvg, teamSplit,
              sixthPlace: sorted[5]?.scoringPlace ?? 999,
              seventhPlace: sorted[6]?.scoringPlace ?? 999,
              athletes: topFive
            });
        });

        return scores.sort((a, b) => {
            if (a.score !== b.score) return a.score - b.score;
            if (a.sixthPlace !== b.sixthPlace) return a.sixthPlace - b.sixthPlace;
            return a.seventhPlace - b.seventhPlace;
        });
    }

    // ==========================================
    // RELAY SCORING
    // ==========================================
    // A race is a relay if any result carries a relay_team tag (e.g. "Morgantown A").
    // Relays are imported one row per LEG, so each runner's `time` is a single-leg
    // time and their relay_team is the squad they ran for.
    function isRelayRace(results) {
        return Array.isArray(results) && results.some(r => r && r.relay_team);
    }

    // Relay scoring: a squad's time is the SUM of its legs; squads rank by total
    // time ascending (fastest wins). This mirrors how a 4x1.5mile relay is scored
    // and matches the official results (e.g. Morgantown A = sum of its 4 legs).
    // Returns objects shaped like calculateTeamScores() so the existing renderers
    // and exporters keep working, except `score` here is TOTAL SECONDS and each
    // team also carries `schoolBase` (the school without the A/B/C tag) + `isRelay`.
    function calculateRelayScores(results) {
        const squads = {};
        results.forEach(r => {
            const squad = r.relay_team || (normalizeSchoolName(r.school_name || r.school || 'Unknown') + ' A');
            (squads[squad] = squads[squad] || []).push(r);
        });

        const scored = Object.entries(squads).map(([squad, legs]) => {
            const legTimes = legs.map(l => parseFloat(l.time)).filter(t => !isNaN(t) && t > 0);
            const total = legTimes.reduce((s, t) => s + t, 0);
            // School is the squad name minus a trailing single-letter tag (" A", " B", ...).
            const schoolBase = squad.replace(/\s+[A-Z]$/, '').trim();
            // Show legs fastest-first inside the squad.
            const ordered = legs.slice().sort((a, b) => (parseFloat(a.time) || 0) - (parseFloat(b.time) || 0));
            return {
                school: squad,               // squad identity shown in standings + dropdown
                schoolBase,                  // presence of this marks a relay row for renderers
                isRelay: true,
                score: total,                // TOTAL seconds (lower is better)
                teamAvg: legTimes.length ? total / legTimes.length : 0,
                teamSplit: legTimes.length ? Math.max(...legTimes) - Math.min(...legTimes) : 0,
                complete: legs.length === 4,
                athletes: ordered
            };
        }).filter(t => t.athletes.length > 0);

        // Complete 4-leg squads first, then fastest total time.
        return scored.sort((a, b) => {
            if (a.complete !== b.complete) return a.complete ? -1 : 1;
            return a.score - b.score;
        });
    }

    // ==========================================
    // APP-STYLE RENDERING HTML GENERATORS
    // ==========================================

    function renderTeamResultsHTML(teamScores) {
        if (!teamScores || teamScores.length === 0) {
          return activeViewMode === 'teams' ? '<div style="text-align:center; padding:20px; color:var(--text-secondary);">No team scores available (minimum 5 finishers required).</div>' : '';
        }

        const anyRelay = teamScores.some(t => t.isRelay);
        let html = `<div class="app-list">
                      <div class="list-header">${anyRelay ? 'Relay Standings' : 'Team Standings'}</div>`;

        teamScores.forEach((team, index) => {
            // For relays, logo comes from the base school (strip the A/B/C tag).
            const logoBase = team.isRelay ? team.schoolBase : team.school;
            const schoolSlug = slugify(logoBase);
            const logoUrl = `/assets/team logos/${schoolSlug}.png`;

            // Relay: show each leg's time. Normal meet: show each scorer's place.
            const scorersHtml = team.isRelay
              ? team.athletes.map(a => `<span class="scorer-badge">${formatTime(parseFloat(a.time))}</span>`).join('')
              : team.athletes.map(a => `<span class="scorer-badge">${scorerBadgeText(a)}</span>`).join('');

            // Relay score is a total time; normal score is points.
            const scoreDisplay = team.isRelay ? formatTime(team.score) : team.score;
            const metaLine = team.isRelay
              ? `Legs: ${team.athletes.length}${team.complete ? '' : ' (incomplete)'} • Avg leg: ${formatTime(team.teamAvg)}`
              : `Avg: ${formatTime(team.teamAvg)} • Split: ${formatTime(team.teamSplit)}`;

            html += `
            <div class="list-item">
                <div class="item-place">${index + 1}</div>
                <div class="item-avatar">
                    <img src="${logoUrl}" alt="${team.school}" onerror="this.src='/assets/images/msm.svg'" />
                </div>
                <div class="item-details">
                    <div class="item-name">${team.school}</div>
                    <div class="item-meta" style="margin-bottom:4px;">${metaLine}</div>
                    <div>${scorersHtml}</div>
                </div>
                <div class="item-score">${scoreDisplay}</div>
            </div>`;
        });

        return html + `</div>`;
    }

    function renderResultsTableHTML(results, distanceMeters) {
        if (!results || results.length === 0) {
            return '<div style="text-align:center; padding:20px; color:var(--text-secondary);">No individual results found.</div>';
        }

        let html = `<div class="app-list">
                      <div class="list-header">Individual Results</div>`;

        results.forEach((runner, index) => {
            const timeSeconds = runner.time ? parseFloat(runner.time) : 0;
            const athleteName = runner.athlete_name || runner.name || 'Unknown';
            const rawSchool = runner.school_name || runner.school || runner.school_slug || 'Unknown';
            const schoolSlug = runner.school_slug || slugify(normalizeSchoolName(rawSchool));
            const athleteHref = `athlete.html?name=${encodeURIComponent(athleteName)}&school=${encodeURIComponent(schoolSlug)}`;

            const logoUrl = `/assets/team logos/${schoolSlug}.png`;
            const grade = formatGrade(runner.gradYear || runner.grade);
            const pace = calculatePacePerMile(timeSeconds, distanceMeters);

            // Build the meta string (e.g., "+1pts • Yr: 10 • Pace: 5:45").
            // For relays, show which squad the runner was a leg of.
            let metaParts = [];
            if (runner.relay_team) metaParts.push(runner.relay_team);
            if (runner.scoringPlace) metaParts.push(`+${runner.scoringPlace}pts`);
            if (grade) metaParts.push(`Yr: ${grade}`);
            metaParts.push(`Pace: ${pace}`);

            html += `
            <div class="list-item">
                <div class="item-place">${runner.place || (index + 1)}</div>
                <div class="item-avatar">
                    <img src="${logoUrl}" alt="${rawSchool}" onerror="this.src='/assets/images/msmrunner.svg'" />
                </div>
                <div class="item-details">
                    <a href="${athleteHref}" class="item-name">${athleteName}</a>
                    <a href="school.html?slug=${schoolSlug}" class="item-school">${rawSchool}</a>
                    <div class="item-meta">${metaParts.join(' • ')}</div>
                </div>
                <div class="item-score">${formatTime(timeSeconds)}</div>
            </div>`;
        });

        return html + `</div>`;
    }

    // ==========================================
    // COACH ANALYSIS
    // ==========================================

    // Builds the "storyline" cards: winner/margin, closest battle, tightest pack,
    // fastest lineup. Works for both standard scoring and relay (total-time) races.
    function buildStorylineCards(teamScores, relay) {
      if (!teamScores || teamScores.length === 0) return '';
      const cards = [];
      const fmtScore = t => relay ? formatTime(t.score) : `${t.score} pts`;

      if (teamScores.length >= 2) {
        const [first, second] = teamScores;
        const margin = relay ? (second.score - first.score) : (second.score - first.score);
        const marginText = relay ? `by ${formatTime(margin)}` : `by ${margin} point${margin === 1 ? '' : 's'}`;
        cards.push({
          label: relay ? '🏆 Winning Squad' : '🏆 Team Champion',
          text: `<b>${first.school}</b> ${marginText === 'by 0 points' || marginText === 'by 0:00.00' ? '(tie at the top!)' : `takes it ${marginText}`} over ${second.school} (${fmtScore(first)} to ${fmtScore(second)}).`
        });

        // Closest consecutive margin anywhere in the standings.
        let closest = null;
        for (let i = 0; i < teamScores.length - 1; i++) {
          const gap = teamScores[i + 1].score - teamScores[i].score;
          if (closest === null || gap < closest.gap) closest = { gap, a: teamScores[i], b: teamScores[i + 1], rank: i + 1 };
        }
        if (closest && closest.gap > 0) {
          const gapText = relay ? formatTime(closest.gap) : `${closest.gap} pt${closest.gap === 1 ? '' : 's'}`;
          cards.push({
            label: '🔥 Closest Battle',
            text: `<b>${closest.a.school}</b> edges <b>${closest.b.school}</b> by just ${gapText} for ${closest.rank === 1 ? '1st place' : `the #${closest.rank} spot`}.`
          });
        }
      }

      const withSplit = teamScores.filter(t => t.teamSplit > 0);
      if (withSplit.length > 0) {
        const tightest = withSplit.reduce((a, b) => (a.teamSplit < b.teamSplit ? a : b));
        cards.push({
          label: relay ? '📦 Most Even Legs' : '📦 Tightest Pack',
          text: `<b>${tightest.school}</b> ${relay ? 'ran the most even set of legs' : 'ran the tightest pack'} — just ${formatTime(tightest.teamSplit)} ${relay ? 'between fastest & slowest leg' : 'from 1st to 5th scorer'}.`
        });
      }

      const withAvg = teamScores.filter(t => t.teamAvg > 0);
      if (withAvg.length > 0) {
        const fastest = withAvg.reduce((a, b) => (a.teamAvg < b.teamAvg ? a : b));
        cards.push({
          label: relay ? '⚡ Fastest Avg Leg' : '⚡ Fastest Avg Runner',
          text: `<b>${fastest.school}</b> posted the fastest team average at ${formatTime(fastest.teamAvg)}${relay ? ' per leg' : ''}.`
        });
      }

      if (cards.length === 0) return '';
      return `<div class="storyline-grid">${cards.map(c => `
        <div class="storyline-item">
          <div class="si-label">${c.label}</div>
          <div class="si-text">${c.text}</div>
        </div>`).join('')}</div>`;
    }

    // Horizontal "pack spread" chart — visualizes how tight each team's 1st-to-5th
    // scorer gap is (or fastest-to-slowest leg, for relays). Coaches use pack
    // tightness as a leading indicator of team consistency and racing IQ.
    function buildPackChart(teamScores, relay) {
      const withSplit = teamScores.filter(t => t.teamSplit > 0);
      if (withSplit.length === 0) {
        return '<div style="padding:16px; text-align:center; color:var(--text-secondary); font-size:0.85rem;">Not enough finish-time data to chart pack spread for this race.</div>';
      }
      const maxSplit = Math.max(...withSplit.map(t => t.teamSplit), 1);
      const rows = withSplit.map((t, i) => {
        const widthPct = Math.max((t.teamSplit / maxSplit) * 100, 2);
        return `
        <div class="pack-row">
          <div class="pack-rank">${i + 1}</div>
          <div class="pack-label">
            <div class="pl-name">${t.school}</div>
            <div class="pl-sub">Avg ${formatTime(t.teamAvg)}</div>
          </div>
          <div class="pack-track"><div class="pack-fill" style="width:${widthPct}%;"></div></div>
          <div class="pack-split-label">${formatTime(t.teamSplit)}</div>
        </div>`;
      }).join('');
      return `<div style="padding: 4px 16px 8px;">${rows}</div>`;
    }

    // Runners who didn't score for a team but finished inside the scoring pack —
    // i.e. they "displaced" opposing scorers to worse points. Useful for coaches
    // sizing up which unattached/JV/incomplete-team runners affected the outcome.
    function buildDisplacers(raceData, teamScores) {
      const scoringSchools = new Set(teamScores.map(t => t.school));
      const scorerPlaces = raceData.filter(r => r.scoringPlace).map(r => parseInt(r.place) || 0);
      if (scorerPlaces.length === 0) return '<div style="padding:16px; text-align:center; color:var(--text-secondary); font-size:0.85rem;">No displacement data available.</div>';
      const maxScorerPlace = Math.max(...scorerPlaces);

      const displacers = raceData
        .filter(r => !r.scoringPlace && (parseInt(r.place) || 9999) <= maxScorerPlace)
        .sort((a, b) => (parseInt(a.place) || 9999) - (parseInt(b.place) || 9999))
        .slice(0, 6);

      if (displacers.length === 0) {
        return '<div style="padding:16px; text-align:center; color:var(--text-secondary); font-size:0.85rem;">No non-scoring runners affected the scoring pack in this race.</div>';
      }

      const rows = displacers.map(r => {
        const school = normalizeSchoolName(r.school_name || r.school || 'Unknown');
        const tag = scoringSchools.has(school) ? '7th+ Runner' : 'Unscored Team';
        return `
        <div class="displacer-item">
          <div class="displacer-place">${r.place || '-'}</div>
          <div>
            <div class="d-name">${r.athlete_name || r.name || 'Unknown'}</div>
            <div class="d-school">${r.school_name || r.school || 'Unknown'}</div>
          </div>
          <div class="displacer-tag">${tag}</div>
        </div>`;
      }).join('');

      return `<div style="padding: 4px 16px 8px;">${rows}</div>
      <div style="padding: 0 16px 14px; font-size:0.75rem; color:var(--text-tertiary);">These runners finished ahead of at least one opposing scorer, pushing that scorer's points down the field.</div>`;
    }

    // Recomputes a true two-team "dual meet" score using only these two teams'
    // scoring runners (individual) or squads' total time (relay) — shows coaches
    // exactly how the matchup would have gone as a standalone dual.
    function renderHeadToHead(teamAName, teamBName, teamScores, relay) {
      const container = document.getElementById('h2h-result');
      if (!container) return;
      const teamA = teamScores.find(t => t.school === teamAName);
      const teamB = teamScores.find(t => t.school === teamBName);
      if (!teamA || !teamB || teamAName === teamBName) {
        container.innerHTML = '<div style="padding:12px; text-align:center; color:var(--text-secondary); font-size:0.85rem;">Pick two different teams to compare.</div>';
        return;
      }

      if (relay) {
        const aFaster = teamA.score <= teamB.score;
        container.innerHTML = `
          <table class="h2h-table">
            <thead><tr><th>Squad</th><th class="h2h-num">Total Time</th><th class="h2h-num">Avg Leg</th></tr></thead>
            <tbody>
              <tr><td class="${aFaster ? 'h2h-win' : ''}">${teamA.school}</td><td class="h2h-num ${aFaster ? 'h2h-win' : ''}">${formatTime(teamA.score)}</td><td class="h2h-num">${formatTime(teamA.teamAvg)}</td></tr>
              <tr><td class="${!aFaster ? 'h2h-win' : ''}">${teamB.school}</td><td class="h2h-num ${!aFaster ? 'h2h-win' : ''}">${formatTime(teamB.score)}</td><td class="h2h-num">${formatTime(teamB.teamAvg)}</td></tr>
            </tbody>
          </table>
          <div class="h2h-summary">${aFaster ? teamA.school : teamB.school} would win this head-to-head by ${formatTime(Math.abs(teamA.score - teamB.score))}.</div>`;
        return;
      }

      const combined = [
        ...teamA.athletes.map(a => ({ ...a, _team: 'A' })),
        ...teamB.athletes.map(a => ({ ...a, _team: 'B' }))
      ].sort((x, y) => (parseFloat(x.time) || 99999) - (parseFloat(y.time) || 99999));

      let scoreA = 0, scoreB = 0;
      const rows = combined.map((r, idx) => {
        const dualPlace = idx + 1;
        if (r._team === 'A') scoreA += dualPlace; else scoreB += dualPlace;
        const winCls = r._team === 'A' ? 'h2h-win' : '';
        return `<tr>
          <td class="h2h-num">${dualPlace}</td>
          <td>${r.athlete_name || r.name || 'Unknown'}</td>
          <td class="${r._team === 'A' ? 'h2h-win' : ''}">${r._team === 'A' ? teamA.school : teamB.school}</td>
          <td class="h2h-num">${formatTime(parseFloat(r.time) || 0)}</td>
        </tr>`;
      }).join('');

      const aWins = scoreA < scoreB;
      const tie = scoreA === scoreB;
      container.innerHTML = `
        <table class="h2h-table">
          <thead><tr><th class="h2h-num">Dual #</th><th>Runner</th><th>Team</th><th class="h2h-num">Time</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="h2h-summary">${tie ? `Dead even — both teams score ${scoreA}.` : `${aWins ? teamA.school : teamB.school} wins the dual ${Math.min(scoreA, scoreB)}–${Math.max(scoreA, scoreB)}.`}</div>`;
    }

    function updateHeadToHead() {
      const selA = document.getElementById('h2h-team-a');
      const selB = document.getElementById('h2h-team-b');
      if (!selA || !selB) return;
      h2hTeamA = selA.value;
      h2hTeamB = selB.value;
      renderHeadToHead(h2hTeamA, h2hTeamB, currentFullTeamScores, currentIsRelay);
    }

    function setupHeadToHeadControls(teamScores, relay) {
      const selA = document.getElementById('h2h-team-a');
      const selB = document.getElementById('h2h-team-b');
      if (!selA || !selB || teamScores.length < 2) return;
      if (!h2hTeamA || !teamScores.some(t => t.school === h2hTeamA)) h2hTeamA = teamScores[0].school;
      if (!h2hTeamB || !teamScores.some(t => t.school === h2hTeamB) || h2hTeamB === h2hTeamA) {
        h2hTeamB = (teamScores[1] && teamScores[1].school !== h2hTeamA) ? teamScores[1].school : (teamScores[0].school === h2hTeamA && teamScores[1] ? teamScores[1].school : teamScores[0].school);
      }
      selA.value = h2hTeamA;
      selB.value = h2hTeamB;
      renderHeadToHead(h2hTeamA, h2hTeamB, teamScores, relay);
    }

    function renderAnalysisHTML(teamScores, raceData, relay, distanceMeters) {
      if (!teamScores || teamScores.length === 0) {
        return '<div style="text-align:center; padding:20px; color:var(--text-secondary);">Coach Analysis needs at least one scoring team (5+ finishers) for this race.</div>';
      }

      const storyline = buildStorylineCards(teamScores, relay);
      const packChart = buildPackChart(teamScores, relay);

      const teamOptions = teamScores.map(t => `<option value="${t.school.replace(/"/g, '&quot;')}">${t.school}</option>`).join('');
      const h2hSection = teamScores.length >= 2 ? `
        <div class="analysis-card">
          <div class="list-header">🥊 Head-to-Head Dual</div>
          <div class="analysis-card-body">
            <div class="h2h-controls">
              <select id="h2h-team-a" onchange="updateHeadToHead()">${teamOptions}</select>
              <span class="h2h-vs">VS</span>
              <select id="h2h-team-b" onchange="updateHeadToHead()">${teamOptions}</select>
            </div>
            <div id="h2h-result"></div>
          </div>
        </div>` : '';

      const displacersSection = relay ? '' : `
        <div class="analysis-card">
          <div class="list-header">🚧 Key Displacers</div>
          ${buildDisplacers(raceData, teamScores)}
        </div>`;

      return `
        ${storyline ? `<div class="analysis-card"><div class="list-header">📖 Race Storyline</div><div class="analysis-card-body">${storyline}</div></div>` : ''}
        <div class="analysis-card">
          <div class="list-header">📦 ${relay ? 'Leg Spread' : 'Team Pack Spread'} (tighter bar = tighter pack)</div>
          ${packChart}
        </div>
        ${h2hSection}
        ${displacersSection}
      `;
    }

    // ==========================================
    // EXPORT UTILITIES (CSV/PDF)
    // ==========================================

    // Filename stem shared by CSV + PDF, e.g. "state-meet_m_varsity-5k".
    function exportFilenameStem() {
      const meetName = currentMeetData ? (currentMeetData.name || 'Meet Results') : 'Meet Results';
      return `${slugify(meetName)}_${slugify(activeGender)}_${slugify(activeRaceType)}`;
    }

    function exportToCSV() {
      const hasIndiv = currentFilteredResults && currentFilteredResults.length > 0;
      const hasTeams = currentTeamScores && currentTeamScores.length > 0;
      if (!hasIndiv && !hasTeams) return alert("No results to export.");

      const rows = [];
      const distance = hasIndiv ? (parseFloat(currentFilteredResults[0].distance) || 5000) : 5000;
      const relay = hasTeams && currentTeamScores.some(t => t.isRelay);

      // Team standings first (when the current view includes them).
      if ((activeViewMode === 'all' || activeViewMode === 'teams') && hasTeams) {
        if (relay) {
          rows.push(['Relay Standings'].map(csvCell));
          rows.push(['Place', 'Relay Team', 'Total Time', 'Avg Leg', 'Legs', 'Leg Times'].map(csvCell));
          currentTeamScores.forEach((t, i) => {
            const legs = t.athletes.map(a => `${a.athlete_name || a.name || ''} ${formatTime(parseFloat(a.time))}`).join('; ');
            rows.push([i + 1, t.school, formatTime(t.score), formatTime(t.teamAvg), t.athletes.length + (t.complete ? '' : ' (incomplete)'), legs].map(csvCell));
          });
        } else {
          rows.push(['Team Standings'].map(csvCell));
          rows.push(['Place', 'School', 'Score', 'Team Avg', 'Team Split', 'Scoring Top 5'].map(csvCell));
          currentTeamScores.forEach((t, i) => {
            const scorers = t.athletes.map(a => `${scorerBadgeText(a)} ${a.athlete_name || a.name || ''}`).join('; ');
            rows.push([i + 1, t.school, t.score, formatTime(t.teamAvg), formatTime(t.teamSplit), scorers].map(csvCell));
          });
        }
        if (activeViewMode === 'all' && hasIndiv) rows.push([]); // spacer row
      }

      // Individual results (when the current view includes them).
      if ((activeViewMode === 'all' || activeViewMode === 'indiv') && hasIndiv) {
        rows.push(['Individual Results'].map(csvCell));
        const indivHead = ['Place', 'Athlete Name', 'Grade', 'School', 'Time', 'Pace Per Mile'];
        if (relay) indivHead.splice(4, 0, 'Relay Team');
        rows.push(indivHead.map(csvCell));
        currentFilteredResults.forEach(r => {
          const t = r.time ? parseFloat(r.time) : 0;
          const row = [
            r.place || '',
            r.athlete_name || r.name || '',
            formatGrade(r.gradYear || r.grade),
            r.school_name || r.school || '',
            formatTime(t),
            calculatePacePerMile(t, distance)
          ];
          if (relay) row.splice(4, 0, r.relay_team || '');
          rows.push(row.map(csvCell));
        });
      }

      // Prepend a UTF-8 BOM so Excel opens accented names correctly.
      const csv = '﻿' + rows.map(cols => cols.join(',')).join('\r\n');
      downloadBlob(`${exportFilenameStem()}.csv`, 'text/csv;charset=utf-8;', csv);
    }

    // Raw JSON export — everything currently computed for the race (full field +
    // full team standings, independent of the search/team-select filters) so a
    // coach can pull it into their own spreadsheet, Python notebook, etc.
    function exportRawDataJSON() {
      const hasData = (currentRaceData && currentRaceData.length > 0) || (currentFullTeamScores && currentFullTeamScores.length > 0);
      if (!hasData) return alert("No results to export.");

      const payload = {
        meet: currentMeetData ? {
          name: currentMeetData.name,
          date: currentMeetData.date,
          location: currentMeetData.location
        } : null,
        gender: activeGender === 'M' ? 'Boys' : 'Girls',
        raceType: activeRaceType,
        isRelay: currentIsRelay,
        exportedAt: new Date().toISOString(),
        teamStandings: currentFullTeamScores,
        results: currentRaceData
      };
      downloadBlob(`${exportFilenameStem()}.json`, 'application/json;charset=utf-8;', JSON.stringify(payload, null, 2));
    }

    // Builds a short plain-text recap of the race for pasting into a text
    // message, email, or team group chat.
    function buildRecapText() {
      const meetName = currentMeetData?.name || document.getElementById("meet-title")?.textContent || "Meet Results";
      const genderText = activeGender === 'M' ? 'Boys' : 'Girls';
      const lines = [`${meetName} — ${genderText} ${activeRaceType || ''}`.trim(), ''];

      if (currentFullTeamScores && currentFullTeamScores.length > 0) {
        lines.push(currentIsRelay ? 'Relay Standings:' : 'Team Standings:');
        currentFullTeamScores.slice(0, 10).forEach((t, i) => {
          lines.push(`${i + 1}. ${t.school} — ${currentIsRelay ? formatTime(t.score) : `${t.score} pts`}`);
        });
        lines.push('');
      }

      if (currentRaceData && currentRaceData.length > 0) {
        lines.push('Top Individual Finishers:');
        currentRaceData.slice(0, 5).forEach(r => {
          const name = r.athlete_name || r.name || 'Unknown';
          const school = r.school_name || r.school || '';
          lines.push(`${r.place || '-'}. ${name} (${school}) — ${formatTime(parseFloat(r.time) || 0)}`);
        });
      }

      return lines.join('\n');
    }

    async function copyRecapToClipboard() {
      const hasData = (currentRaceData && currentRaceData.length > 0) || (currentFullTeamScores && currentFullTeamScores.length > 0);
      if (!hasData) return alert("No results to copy.");
      const text = buildRecapText();
      try {
        await navigator.clipboard.writeText(text);
        showToast('✅ Recap copied to clipboard!');
      } catch (e) {
        console.warn('Clipboard write failed, falling back to download.', e);
        downloadBlob(`${exportFilenameStem()}_recap.txt`, 'text/plain;charset=utf-8;', text);
        showToast('Clipboard unavailable — downloaded a text file instead.');
      }
    }

    // Draws a shareable 1200x630 results "card" (social/group-chat size) with the
    // meet name, race, and top teams/finishers, then downloads it as a PNG — or
    // hands it to the native share sheet on mobile when available.
    async function exportShareCard() {
      const hasData = (currentRaceData && currentRaceData.length > 0) || (currentFullTeamScores && currentFullTeamScores.length > 0);
      if (!hasData) return alert("No results to share.");

      const bc = getBrandColorRgbArray();
      const brand = `rgb(${bc[0]}, ${bc[1]}, ${bc[2]})`;
      const W = 1200, H = 630;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      // Background gradient.
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, brand);
      grad.addColorStop(1, '#0b1220');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Header text.
      const meetName = currentMeetData?.name || document.getElementById("meet-title")?.textContent || "Meet Results";
      const genderText = activeGender === 'M' ? 'Boys' : 'Girls';
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 22px Helvetica, Arial, sans-serif';
      ctx.fillText('MOUNTAIN STATE MILES', 56, 58);
      ctx.font = '800 44px Helvetica, Arial, sans-serif';
      wrapCanvasText(ctx, meetName, 56, 112, 1080, 48);
      ctx.font = '600 24px Helvetica, Arial, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(`${genderText} ${activeRaceType || ''}`.trim(), 56, 172);

      // Divider.
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.moveTo(56, 196); ctx.lineTo(W - 56, 196); ctx.stroke();

      let y = 240;
      if (currentFullTeamScores && currentFullTeamScores.length > 0) {
        ctx.font = '700 20px Helvetica, Arial, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText(currentIsRelay ? 'RELAY STANDINGS' : 'TEAM STANDINGS', 56, y);
        y += 36;
        currentFullTeamScores.slice(0, 5).forEach((t, i) => {
          ctx.font = '800 30px Helvetica, Arial, sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`${i + 1}.`, 56, y);
          ctx.font = '700 28px Helvetica, Arial, sans-serif';
          ctx.fillText(t.school, 110, y);
          const scoreText = currentIsRelay ? formatTime(t.score) : `${t.score} pts`;
          ctx.font = '800 28px Helvetica, Arial, sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(scoreText, W - 56, y);
          ctx.textAlign = 'left';
          y += 44;
        });
      }

      // Footer.
      ctx.font = '600 18px Helvetica, Arial, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(formatMeetDate(currentMeetData?.date) + (currentMeetData?.location ? ` • ${currentMeetData.location}` : ''), 56, H - 40);

      const filename = `${exportFilenameStem()}_share.png`;
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: 'image/png' })] })) {
          try {
            await navigator.share({
              files: [new File([blob], filename, { type: 'image/png' })],
              title: meetName,
              text: `${meetName} — ${genderText} results`
            });
            return;
          } catch (e) { /* user cancelled or share failed — fall back to download */ }
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    // Simple word-wrap helper for the canvas share card title.
    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = String(text).split(' ');
      let line = '';
      let curY = y;
      let linesDrawn = 0;
      for (let i = 0; i < words.length; i++) {
        const testLine = line + words[i] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && line !== '' && linesDrawn < 1) {
          ctx.fillText(line, x, curY);
          line = words[i] + ' ';
          curY += lineHeight;
          linesDrawn++;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, curY);
    }

    async function exportResultsPDF() {
      const hasIndiv = currentFilteredResults && currentFilteredResults.length > 0;
      const hasTeams = currentTeamScores && currentTeamScores.length > 0;
      if (!hasIndiv && !hasTeams) return alert("No results to export.");
      if (typeof window.jspdf === 'undefined') return alert("PDF library is still loading. Please try again in a second.");

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape' });
      const bc = getBrandColorRgbArray();
      const relay = hasTeams && currentTeamScores.some(t => t.isRelay);

      // 1. Build the Detailed Context Title
      const meetName = currentMeetData?.name || document.getElementById("meet-title")?.textContent || "Meet Results";
      const distance = hasIndiv ? (currentFilteredResults[0].distance || 5000) : 5000;
      const genderText = activeGender === 'M' ? 'Boys' : 'Girls';
      const raceTitle = `${meetName} - ${genderText} ${activeRaceType} ${distance}m`;

      const exportSelect = document.getElementById('team-export-select')?.value;
